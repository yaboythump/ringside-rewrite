name: YouTube custom thumbnail gate

on:
  push:
    paths:
      - youtube-thumbnail-job.json
  workflow_dispatch:

concurrency:
  group: youtube-thumbnail-gate
  cancel-in-progress: false

jobs:
  set-and-verify-thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set custom YouTube thumbnail
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UPLOAD_POST_API_KEY:-}" || { echo "::error::UPLOAD_POST_API_KEY secret is missing"; exit 1; }

          SHOW=$(jq -r '.show' youtube-thumbnail-job.json)
          USER_NAME=$(jq -r '.user' youtube-thumbnail-job.json)
          VIDEO_ID=$(jq -r '.video_id // empty' youtube-thumbnail-job.json)
          TITLE_QUERY=$(jq -r '.title_query // empty' youtube-thumbnail-job.json)
          THUMBNAIL_URL=$(jq -r '.thumbnail_url // empty' youtube-thumbnail-job.json)
          THUMBNAIL_BASE64=$(jq -r '.thumbnail_base64 // empty' youtube-thumbnail-job.json)
          THUMBNAIL_FILENAME=$(jq -r '.thumbnail_filename // "thumbnail.jpg"' youtube-thumbnail-job.json)
          TITLE=$(jq -r '.title // empty' youtube-thumbnail-job.json)

          for value in "$SHOW" "$USER_NAME"; do
            test -n "$value" && test "$value" != "null"
          done
          if [ -z "$THUMBNAIL_URL" ] && [ -z "$THUMBNAIL_BASE64" ]; then
            echo "::error::Provide thumbnail_url or thumbnail_base64"
            exit 1
          fi

          if [ -z "$VIDEO_ID" ]; then
            test -n "$TITLE_QUERY" || { echo "::error::Provide video_id or title_query"; exit 1; }
            echo "Resolving YouTube video ID for: $TITLE_QUERY"
            for PAGE in 1 2 3 4 5 6; do
              curl -sS --fail -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
                "https://api.upload-post.com/api/uploadposts/history?limit=100&page=$PAGE" -o history.json
              VIDEO_ID=$(jq -r --arg profile "$USER_NAME" --arg q "$TITLE_QUERY" '
                .history[]? |
                select(.profile_username == $profile and .platform == "youtube" and .success == true) |
                select((.post_title // "" | ascii_downcase | contains($q | ascii_downcase))) |
                select((.post_title // "" | contains("#Shorts") | not)) |
                .platform_post_id // empty
              ' history.json | head -n1)
              if [ -n "$VIDEO_ID" ]; then break; fi
            done
            test -n "$VIDEO_ID" || { echo "::error::Could not resolve a full YouTube episode for title query: $TITLE_QUERY"; exit 1; }
          fi

          echo "Applying custom thumbnail: $SHOW | $TITLE | $VIDEO_ID"
          if [ -n "$THUMBNAIL_BASE64" ]; then
            printf '%s' "$THUMBNAIL_BASE64" | base64 --decode > "$THUMBNAIL_FILENAME"
            HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://api.upload-post.com/api/uploadposts/youtube/thumbnail' \
              -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
              -F "user=$USER_NAME" \
              -F "video_id=$VIDEO_ID" \
              -F "thumbnail=@$THUMBNAIL_FILENAME")
          else
            curl -L --fail --retry 3 -sS "$THUMBNAIL_URL" -o "$THUMBNAIL_FILENAME"
            HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' -X POST 'https://api.upload-post.com/api/uploadposts/youtube/thumbnail' \
              -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
              -F "user=$USER_NAME" \
              -F "video_id=$VIDEO_ID" \
              -F "thumbnail=@$THUMBNAIL_FILENAME")
          fi
          cat response.json
          echo
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 300 || { echo "::error::Thumbnail API returned HTTP $HTTP_CODE"; exit 1; }
          jq -e '.success == true and .video_id == $vid' --arg vid "$VIDEO_ID" response.json >/dev/null
          printf '%s' "$VIDEO_ID" > resolved-video-id.txt

      - name: Verify visible YouTube thumbnail derivatives
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          THUMBNAIL_URL=$(jq -r '.thumbnail_url // empty' youtube-thumbnail-job.json)
          THUMBNAIL_BASE64=$(jq -r '.thumbnail_base64 // empty' youtube-thumbnail-job.json)
          VIDEO_ID=$(cat resolved-video-id.txt)
          if [ -n "$THUMBNAIL_BASE64" ]; then
            printf '%s' "$THUMBNAIL_BASE64" | base64 --decode > custom.jpg
          else
            curl -L --fail --retry 3 -sS "$THUMBNAIL_URL" -o custom.jpg
          fi

          VIDEO_ID="$VIDEO_ID" python - <<'PY'
          import io, json, os, time, urllib.request
          from PIL import Image, ImageChops, ImageOps, ImageStat, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          job = json.load(open('youtube-thumbnail-job.json', encoding='utf-8'))
          vid = os.environ['VIDEO_ID']
          expected = Image.open('custom.jpg').convert('RGB')
          names = ['mqdefault', 'hqdefault', 'sddefault', 'maxresdefault']

          def youtube_geometry(source, target_size):
              contained = ImageOps.contain(source, target_size, method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', target_size, (0, 0, 0))
              canvas.paste(contained, ((target_size[0] - contained.width) // 2, (target_size[1] - contained.height) // 2))
              return canvas

          def mae(actual, source):
              normalized = youtube_geometry(source, actual.size)
              stat = ImageStat.Stat(ImageChops.difference(actual, normalized))
              return sum(stat.mean) / 3.0

          last = {}
          for attempt in range(8):
              passed = True
              last = {}
              for name in names:
                  url = f'https://i.ytimg.com/vi/{vid}/{name}.jpg?gate={time.time_ns()}'
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          actual = Image.open(io.BytesIO(r.read())).convert('RGB')
                      score = mae(actual, expected)
                      last[name] = round(score, 2)
                      if score > 20.0:
                          passed = False
                  except Exception as exc:
                      last[name] = str(exc)
                      passed = False
              print(f'attempt={attempt+1} thumbnail_mae={last}')
              if passed:
                  print(f'THUMBNAIL_GATE_PASS video_id={vid} show={job.get("show")}')
                  raise SystemExit(0)
              time.sleep(15)
          raise SystemExit(f'THUMBNAIL_GATE_FAIL video_id={vid} results={last}')
          PY
