name: Finish HHWI Scott La Rock Episode

on:
  push:
    paths:
      - 'hhwi-scott-la-rock-finish-command.json'
      - 'tools/hhwi_scott_final_remote.py'
      - '.github/workflows/hhwi-scott-la-rock-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hhwi-scott-la-rock-finish
  cancel-in-progress: true

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve active factory pod
        id: pod
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id' hhwi-scott-la-rock-finish-command.json)
          [[ -n "$POD_ID" && "$POD_ID" != "null" ]] || exit 2
          POD=$(curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer $RUNPOD_API_KEY")
          STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
          if [[ "$STATUS" != "RUNNING" ]]; then
            curl -fsS -X POST "https://rest.runpod.io/v1/pods/$POD_ID/start" -H "Authorization: Bearer $RUNPOD_API_KEY" >/dev/null || true
            for i in $(seq 1 90); do
              sleep 5
              POD=$(curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer $RUNPOD_API_KEY")
              STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
              [[ "$STATUS" == "RUNNING" ]] && break
            done
          fi
          [[ "$STATUS" == "RUNNING" ]] || { echo "pod not running: $STATUS"; exit 3; }
          JPASS=$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          [[ -n "$JPASS" ]] || { echo "Jupyter password missing"; exit 4; }
          echo "::add-mask::$JPASS"
          umask 077
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Run F06 final production
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet requests websocket-client
          python3 tools/hhwi_scott_final_remote.py

      - name: Runner QC
        shell: bash
        run: |
          set -euo pipefail
          MASTER=deliverables/HHWI_What_If_Scott_La_Rock_Never_Died.mp4
          test -s "$MASTER"
          test "$(jq -r '.pass' deliverables/qc.json)" = "true"
          test "$(jq -r '.narrator' deliverables/qc.json)" = "F06"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,sample_rate -of json "$MASTER" | tee deliverables/runner_ffprobe.json

      - uses: actions/upload-artifact@v4
        with:
          name: HHWI-Scott-La-Rock-F06-Final
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Deliver master
        shell: bash
        run: |
          set -euo pipefail
          TAG=hhwi-scott-la-rock-f06-final
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" deliverables/HHWI_What_If_Scott_La_Rock_Never_Died.mp4 deliverables/qc.json --clobber
          else
            gh release create "$TAG" deliverables/HHWI_What_If_Scott_La_Rock_Never_Died.mp4 deliverables/qc.json --title "HHWI — What If Scott La Rock Never Died?" --notes "CTNETWORK final production delivery. Narrator: F06. 20 scenes total, 8 animated. No external publishing performed."
          fi
          gh release view "$TAG" --json url,assets | tee deliverables/release.json

      - name: Stop CTNETWORK factory after delivery
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://rest.runpod.io/v1/pods/$POD_ID/stop" -H "Authorization: Bearer $RUNPOD_API_KEY" >/dev/null || true
          for i in $(seq 1 60); do
            sleep 2
            S=$(curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer $RUNPOD_API_KEY" | jq -r '.desiredStatus // "unknown"')
            echo "stop_check=$i status=$S"
            [[ "$S" != "RUNNING" ]] && exit 0
          done
          exit 1
