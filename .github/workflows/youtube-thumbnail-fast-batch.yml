name: YouTube thumbnail fast batch

on:
  push:
    paths:
      - youtube-thumbnail-fast-batch.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-thumbnail-fast-batch
  cancel-in-progress: false

jobs:
  upload-all:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Upload all thumbnails without blocking on YouTube cache
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import io
          import json
          import os
          import sys
          from pathlib import Path

          import requests
          from PIL import Image, ImageOps

          job_path = Path('youtube-thumbnail-fast-batch.json')
          if not job_path.exists():
              raise SystemExit(f'Missing {job_path}')

          payload = json.loads(job_path.read_text())
          jobs = payload.get('jobs') or []
          if not jobs:
              raise SystemExit('No thumbnail jobs found')

          api_key = os.environ.get('UPLOAD_POST_API_KEY')
          if not api_key:
              raise SystemExit('Missing UPLOAD_POST_API_KEY')

          endpoint = 'https://api.upload-post.com/api/upload-video/youtube/thumbnail'
          results = []
          failed = False

          for idx, job in enumerate(jobs, start=1):
              user = job['user']
              video_id = job['video_id']
              title = job.get('title', video_id)
              image_url = job['thumbnail_url']
              kind = job.get('kind', 'video')
              target = (1080, 1920) if kind == 'short' else (1280, 720)
              print(f'[{idx}/{len(jobs)}] {title} ({video_id}) [{kind}]')

              try:
                  src = requests.get(image_url, timeout=90)
                  src.raise_for_status()
                  img = Image.open(io.BytesIO(src.content)).convert('RGB')
                  img = ImageOps.fit(img, target, method=Image.Resampling.LANCZOS)
                  buf = io.BytesIO()
                  img.save(buf, format='JPEG', quality=90, optimize=True, progressive=True)
                  upload_bytes = buf.getvalue()

                  resp = requests.post(
                      endpoint,
                      data={'video': video_id, 'user': user, 'apiKey': api_key},
                      files={'file': (f'{video_id}.jpg', upload_bytes, 'image/jpeg')},
                      timeout=180,
                  )
                  body = resp.text
                  ok = 200 <= resp.status_code < 300
                  try:
                      parsed = resp.json()
                      if isinstance(parsed, dict) and parsed.get('success') is False:
                          ok = False
                  except Exception:
                      parsed = None

                  results.append({
                      'video_id': video_id,
                      'title': title,
                      'kind': kind,
                      'status_code': resp.status_code,
                      'ok': ok,
                      'response': parsed if parsed is not None else body[:2000],
                  })
                  print('UPLOAD RESPONSE:', resp.status_code, body[:1000])
                  if not ok:
                      failed = True
              except Exception as exc:
                  failed = True
                  results.append({
                      'video_id': video_id,
                      'title': title,
                      'kind': kind,
                      'ok': False,
                      'error': repr(exc),
                  })
                  print('UPLOAD ERROR:', repr(exc))

          Path('youtube-thumbnail-fast-results.json').write_text(json.dumps(results, indent=2))
          if failed:
              sys.exit(1)
          print(f'Uploaded {len(results)} thumbnails successfully.')
          PY

      - name: Upload result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-thumbnail-fast-results
          path: youtube-thumbnail-fast-results.json
          if-no-files-found: ignore
