name: Render Ringside Recap AEW 0916

on:
  push:
    paths:
      - 'ringside-recap-aew-0916-render-command.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringside-recap-aew-0916-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests websocket-client
      - name: Render full episode, Shorts, thumbnail, and QC
        run: python tools/ringside_recap_aew_0916_render.py
      - name: Upload approval package
        uses: actions/upload-artifact@v4
        with:
          name: ringside-recap-aew-0916-approval
          path: ringside-recap-aew-0916-render/ringside-recap-aew-0916-package.tar.gz
          retention-days: 7
          if-no-files-found: error
