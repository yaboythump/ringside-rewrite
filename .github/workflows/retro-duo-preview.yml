name: Retro Duo simulator preview (temporary)
on:
  push:
    branches: [feature/retro-duo]
    paths: [".github/workflows/retro-duo-preview.yml", "games/retro-duo/ios/**"]
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run in the simulator and print screenshots
        run: |
          set -euo pipefail
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          dev="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          names=[x for r,l in d.items() if "iOS" in r for x in l]
          duo=[x for x in names if "Duo" in x["name"]]
          pick=(duo or [x for x in names if "Pro" in x["name"]] or names)[0]
          print(pick["udid"])')"
          echo "device: $dev"
          xcodebuild -project games/retro-duo/ios/RetroDuo.xcodeproj -scheme RetroDuo -configuration Debug \
            -sdk iphonesimulator -destination "id=$dev" -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/sim.log" | head -40; exit 1; }
          app="$(find "$RUNNER_TEMP/sim/Build/Products" -name RetroDuo.app -maxdepth 2 | head -1)"
          xcrun simctl boot "$dev" || true
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$app"
          shot() {
            xcrun simctl io "$dev" screenshot "$RUNNER_TEMP/$1.png"
            sips -Z 700 "$RUNNER_TEMP/$1.png" >/dev/null
            echo "BEGIN_PNG $1"; base64 -i "$RUNNER_TEMP/$1.png" | tr -d '\n'; echo; echo "END_PNG $1"
          }
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo
          sleep 6; shot library
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemo
          sleep 2; shot boot
          sleep 8; shot game
          xcrun simctl spawn "$dev" log show --last 2m --predicate 'process == "RetroDuo"' --style compact 2>/dev/null | grep -iE "fault|crash|error" | head -20 || true
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          sleep 2
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemo
          sleep 6; shot resumed
