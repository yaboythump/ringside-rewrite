name: Retro Duo simulator preview (temporary)
on:
  push:
    branches: [feature/retro-duo-snes]
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run in the simulator and print screenshots
        run: |
          set -euo pipefail
          python3 games/retro-duo/tools/generate_blastem.py
          dev="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          names=[x for r,l in d.items() if "iOS" in r for x in l]
          duo=[x for x in names if "Duo" in x["name"]]
          print((duo or names)[0]["udid"])')"
          xcodebuild -project games/retro-duo/ios/RetroDuo.xcodeproj -scheme RetroDuo -configuration Release \
            -sdk iphonesimulator -destination "id=$dev" -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/sim.log" | head -40; exit 1; }
          app="$(find "$RUNNER_TEMP/sim/Build/Products" -name RetroDuo.app -maxdepth 2 | head -1)"
          xcrun simctl boot "$dev" || true
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$app"
          shot() {
            f="$RUNNER_TEMP/$1.png"
            xcrun simctl io "$dev" screenshot --display=1 "$f" >/dev/null 2>&1 || return 0
            sips -Z 640 "$f" >/dev/null
            echo "BEGIN_PNG $1"; base64 -i "$f" | tr -d '\n'; echo; echo "END_PNG $1"
          }
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemoGenesis -RetroDuoUITests
          sleep 12; shot genesis
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemoSMS -RetroDuoUITests
          sleep 12; shot sms
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemoGG -RetroDuoUITests
          sleep 12; shot gg
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemoSNES -RetroDuoUITests
          sleep 12; shot snes
