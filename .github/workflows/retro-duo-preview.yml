name: Retro Duo simulator preview (temporary)
on:
  push:
    branches: [feature/retro-duo-ds]
    paths: [".github/workflows/retro-duo-preview.yml"]
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  preview:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run in the simulator and print screenshots
        run: |
          set -euo pipefail
          dev="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          names=[x for r,l in d.items() if "iOS" in r for x in l]
          duo=[x for x in names if "Duo" in x["name"]]
          print((duo or names)[0]["udid"])')"
          echo "device: $dev"
          xcodebuild -project games/retro-duo/ios/RetroDuo.xcodeproj -scheme RetroDuo -configuration Release \
            -sdk iphonesimulator -destination "id=$dev" -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/sim.log" | head -40; exit 1; }
          app="$(find "$RUNNER_TEMP/sim/Build/Products" -name RetroDuo.app -maxdepth 2 | head -1)"
          xcrun simctl boot "$dev" || true
          xcrun simctl bootstatus "$dev" -b
          xcrun simctl install "$dev" "$app"
          shot() {
            for display in 1 3; do
              f="$RUNNER_TEMP/$1-d$display.png"
              xcrun simctl io "$dev" screenshot --display=$display "$f" >/dev/null 2>&1 || continue
              sips -Z 640 "$f" >/dev/null
              echo "BEGIN_PNG $1-d$display"; base64 -i "$f" | tr -d '\n'; echo; echo "END_PNG $1-d$display"
            done
          }
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemo
          sleep 9; shot gb
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo -RetroDuoDemoDS -RetroDuoUITests
          sleep 10; shot ds
          xcrun simctl terminate "$dev" com.ctnetworkstudios.retroduo || true
          xcrun simctl launch "$dev" com.ctnetworkstudios.retroduo
          sleep 5; shot library
