name: Ringside YouTube catalog discovery

on:
  push:
    paths:
      - .github/workflows/ringside-media-catalog.yml
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch full Ringside YouTube catalog
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key=os.environ['UPLOAD_POST_API_KEY']
          base='https://api.upload-post.com/api/uploadposts/media'
          cursor=None
          all_items=[]
          seen=set()
          for _ in range(30):
              params={'platform':'youtube','user':'Ringsiderewrite','limit':'100'}
              if cursor: params['cursor']=cursor
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url, headers={'Authorization':f'Apikey {key}'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  payload=json.load(r)
              for item in payload.get('media',[]):
                  vid=item.get('id')
                  if vid and vid not in seen:
                      seen.add(vid); all_items.append(item)
              page=payload.get('pagination',{})
              if not page.get('has_more'): break
              cursor=page.get('next_cursor')
              if not cursor: break
          with open('ringside-youtube-catalog.json','w') as f:
              json.dump(all_items,f,indent=2)
          print('CATALOG_COUNT',len(all_items))
          for item in all_items:
              print(item.get('id'), '\t', item.get('timestamp'), '\t', item.get('caption'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ringside-youtube-catalog
          path: ringside-youtube-catalog.json
          if-no-files-found: error
