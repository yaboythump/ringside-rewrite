name: Six Report H02 Narration

on:
  push:
    paths:
      - '.github/workflows/six-report-h02-narration.yml'
      - 'content/six_report/gta6_album_h02_narration.txt'
      - 'tools/ctnetwork_six_report_h02_narrate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: six-report-h02-narration
  cancel-in-progress: true

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      CTN_VOLUME: 9wjb3sa5zm
      CTN_DC: EU-RO-1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create narration pod
        id: pod
        shell: bash
        run: |
          set -euo pipefail

          START_CMD=$(cat <<'BASH'
          set -Eeuo pipefail
          ROOT=/workspace/ctnetwork-local
          LOG=/workspace/six-report-h02.log
          STATUS=/workspace/six-report-h02-status.txt
          OUT=/workspace/Six_Report_GTA6_Album_H02
          rm -f "$STATUS" "$LOG"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cd /workspace
          python3 -m http.server 8000 --bind 0.0.0.0 >/tmp/ctn-http.log 2>&1 &
          HTTP_PID=$!

          {
            echo "Six Report H02 narration boot"
            date -u +%FT%TZ
            export DEBIAN_FRONTEND=noninteractive
            export HF_HUB_ENABLE_HF_TRANSFER=0

            if ! command -v ffmpeg >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y --no-install-recommends ffmpeg curl ca-certificates
            fi

            QPY="$ROOT/envs/qwen3-tts/bin/python"
            [[ -x "$QPY" ]] || { echo "QWEN_ENV_MISSING:$QPY"; echo 20 > "$STATUS"; wait "$HTTP_PID"; exit 20; }

            REF=$(find               "$ROOT/narrator-auditions"               "$ROOT/narrator-audition-export"               "$ROOT/narrator-timebox-export"               /workspace/CTNETWORK_ARCHIVE               /workspace/ctnetwork-production               -type f \( -iname 'H02.wav' -o -iname 'H02.mp3' -o -iname 'H02.flac' -o -iname '*H02*.wav' -o -iname '*H02*.mp3' -o -iname '*H02*.flac' \)               2>/dev/null | grep -Ev '/cache/|/models/|/envs/' | head -n 1 || true)

            if [[ -z "$REF" || ! -s "$REF" ]]; then
              echo "H02_REFERENCE_MISSING"
              find "$ROOT" -maxdepth 7 -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' \) 2>/dev/null | grep -Ei 'H0[1-9]|male|narrator|audition' | head -100 || true
              echo 21 > "$STATUS"
              wait "$HTTP_PID"
              exit 21
            fi
            echo "H02_REF=$REF"

            curl -L --fail --retry 5               "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/tools/ctnetwork_six_report_h02_narrate.py"               -o /tmp/ctnetwork_six_report_h02_narrate.py
            curl -L --fail --retry 5               "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/content/six_report/gta6_album_h02_narration.txt"               -o "$OUT/script.txt"

            "$QPY" /tmp/ctnetwork_six_report_h02_narrate.py               --text-file "$OUT/script.txt"               --ref-audio "$REF"               --output "$OUT/narration_raw.wav"

            ffmpeg -y -loglevel error -i "$OUT/narration_raw.wav"               -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2.2:attack=12:release=100,loudnorm=I=-16:TP=-1.5:LRA=8,alimiter=limit=0.95"               -ar 48000 -ac 1 -c:a pcm_s16le               "$OUT/The_Six_Report_GTA6_Album_H02.wav"

            ffmpeg -y -loglevel error -i "$OUT/The_Six_Report_GTA6_Album_H02.wav"               -b:a 192k "$OUT/The_Six_Report_GTA6_Album_H02.mp3"

            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$OUT/The_Six_Report_GTA6_Album_H02.wav"
            rm -f "$OUT/narration_raw.wav"

            tar -czf /workspace/Six_Report_GTA6_Album_H02.tar.gz -C /workspace "$(basename "$OUT")"
            echo 0 > "$STATUS"
            echo "NARRATION_READY"
          } >"$LOG" 2>&1

          wait "$HTTP_PID"
          BASH
          )

          GPU_TYPES='["NVIDIA GeForce RTX 4090","NVIDIA RTX PRO 4500 Blackwell","NVIDIA GeForce RTX 5090","NVIDIA L4"]'
          BODY=$(jq -nc             --arg name "six-report-h02-$(date +%s)"             --arg dc "$CTN_DC"             --arg vol "$CTN_VOLUME"             --arg cmd "$START_CMD"             --argjson gpus "$GPU_TYPES"             '{
              name:$name,
              imageName:"runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",
              cloudType:"SECURE",
              computeType:"GPU",
              gpuTypeIds:$gpus,
              gpuTypePriority:"availability",
              gpuCount:1,
              dataCenterIds:[$dc],
              dataCenterPriority:"availability",
              containerDiskInGb:40,
              networkVolumeId:$vol,
              volumeMountPath:"/workspace",
              ports:["8000/http"],
              dockerStartCmd:["bash","-lc",$cmd]
            }')

          HTTP=$(curl -sS -o /tmp/create.json -w '%{http_code}'             -X POST https://rest.runpod.io/v1/pods             -H "Authorization: Bearer $RUNPOD_API_KEY"             -H 'Content-Type: application/json'             --data "$BODY" || true)

          echo "create http=$HTTP"
          cat /tmp/create.json
          [[ "$HTTP" =~ ^2 ]] || exit 2

          POD_ID=$(jq -r '.id // empty' /tmp/create.json)
          [[ -n "$POD_ID" ]] || exit 3
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${POD_ID}-8000.proxy.runpod.net" >> "$GITHUB_OUTPUT"

      - name: Wait for narration server
        env:
          BASE_URL: ${{ steps.pod.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/" || true)
            echo "attempt=$i http=$code"
            [[ "$code" == 200 ]] && exit 0
            sleep 5
          done
          exit 4

      - name: Wait for H02 narration
        env:
          BASE_URL: ${{ steps.pod.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 1200); do
            status=$(curl -fsS --max-time 10 "$BASE_URL/six-report-h02-status.txt" 2>/dev/null || true)
            if [[ -n "$status" ]]; then
              curl -fsS --max-time 20 "$BASE_URL/six-report-h02.log" -o /tmp/six-report-h02.log || true
              cat /tmp/six-report-h02.log || true
              if [[ "$status" == "0" ]]; then
                curl -fL --retry 5 --max-time 900                   "$BASE_URL/Six_Report_GTA6_Album_H02.tar.gz"                   -o /tmp/Six_Report_GTA6_Album_H02.tar.gz
                test -s /tmp/Six_Report_GTA6_Album_H02.tar.gz
                exit 0
              fi
              exit "$status"
            fi
            if (( i % 24 == 0 )); then
              curl -fsS --max-time 10 "$BASE_URL/six-report-h02.log" 2>/dev/null | tail -25 || true
            fi
            sleep 5
          done
          exit 5

      - name: Upload H02 narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: Six-Report-GTA6-Album-H02
          path: /tmp/Six_Report_GTA6_Album_H02.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Terminate narration pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          [[ -n "${POD_ID:-}" ]] || exit 0
          curl -sS -X DELETE "https://rest.runpod.io/v1/pods/$POD_ID"             -H "Authorization: Bearer $RUNPOD_API_KEY" >/dev/null || true
          echo "Narration pod terminated: $POD_ID"
