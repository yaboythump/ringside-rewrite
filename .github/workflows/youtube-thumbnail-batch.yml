name: YouTube thumbnail batch replacement

on:
  push:
    paths:
      - youtube-thumbnail-batch.json
  workflow_dispatch:

concurrency:
  group: youtube-thumbnail-batch
  cancel-in-progress: false

jobs:
  replace-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Replace full-episode thumbnails and verify
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${UPLOAD_POST_API_KEY:-}" || { echo "::error::UPLOAD_POST_API_KEY secret is missing"; exit 1; }
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import io, json, os, time
          import requests
          from PIL import Image, ImageChops, ImageOps, ImageStat, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          jobs = json.load(open('youtube-thumbnail-batch.json', encoding='utf-8'))['jobs']
          key = os.environ['UPLOAD_POST_API_KEY']
          headers = {'Authorization': f'Apikey {key}', 'Content-Type': 'application/json'}
          endpoint = 'https://api.upload-post.com/api/uploadposts/youtube/thumbnail'

          print(f'Applying {len(jobs)} Ringside Rewrite thumbnails...')
          for idx, job in enumerate(jobs, 1):
              body = {'user': job['user'], 'video_id': job['video_id'], 'thumbnail_url': job['thumbnail_url']}
              r = requests.post(endpoint, headers=headers, json=body, timeout=90)
              print(f'[{idx}/{len(jobs)}] {job["video_id"]} {job["title"]}: HTTP {r.status_code} {r.text[:500]}')
              r.raise_for_status()
              payload = r.json()
              if payload.get('success') is not True or payload.get('video_id') != job['video_id']:
                  raise SystemExit(f'Unexpected thumbnail response for {job["video_id"]}: {payload}')

          def youtube_geometry(source, target_size):
              contained = ImageOps.contain(source, target_size, method=Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', target_size, (0, 0, 0))
              canvas.paste(contained, ((target_size[0]-contained.width)//2, (target_size[1]-contained.height)//2))
              return canvas

          def mae(actual, source):
              normalized = youtube_geometry(source, actual.size)
              stat = ImageStat.Stat(ImageChops.difference(actual, normalized))
              return sum(stat.mean) / 3.0

          expected = {}
          for job in jobs:
              rr = requests.get(job['thumbnail_url'], timeout=60)
              rr.raise_for_status()
              expected[job['video_id']] = Image.open(io.BytesIO(rr.content)).convert('RGB')

          pending = {job['video_id']: job for job in jobs}
          names = ['mqdefault', 'hqdefault', 'sddefault', 'maxresdefault']
          for attempt in range(8):
              if not pending:
                  break
              print(f'Verification attempt {attempt+1}; pending={len(pending)}')
              passed_now=[]
              for vid, job in list(pending.items()):
                  scores={}
                  ok=True
                  for name in names:
                      try:
                          url=f'https://i.ytimg.com/vi/{vid}/{name}.jpg?gate={time.time_ns()}'
                          rr=requests.get(url, timeout=30)
                          rr.raise_for_status()
                          actual=Image.open(io.BytesIO(rr.content)).convert('RGB')
                          score=mae(actual, expected[vid])
                          scores[name]=round(score,2)
                          if score > 20.0: ok=False
                      except Exception as exc:
                          scores[name]=str(exc); ok=False
                  print(f'{vid} {job["title"]}: {scores}')
                  if ok:
                      print(f'THUMBNAIL_GATE_PASS video_id={vid}')
                      passed_now.append(vid)
              for vid in passed_now:
                  pending.pop(vid, None)
              if pending:
                  time.sleep(15)

          if pending:
              raise SystemExit('THUMBNAIL_BATCH_GATE_FAIL pending=' + ','.join(pending))
          print(f'THUMBNAIL_BATCH_GATE_PASS count={len(jobs)}')
          PY
