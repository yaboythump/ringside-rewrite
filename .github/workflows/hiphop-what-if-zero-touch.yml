name: Hip Hop What If zero-touch production

on:
  push:
    branches: [main]
    paths:
      - 'hiphop_whatif/current/job.json'
  workflow_dispatch:

concurrency:
  group: hiphop-what-if-zero-touch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-qc-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zero-credit production runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq fonts-dejavu-core
          python -m pip install --quiet requests pillow numpy
          mkdir -p hiphop_whatif/current/output

      - name: Enforce locked Eazy-E recovery package
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.profile == "HipHopWhatIf"' hiphop_whatif/current/job.json >/dev/null
          jq -e '.slug and .full.title and .full.description' hiphop_whatif/current/job.json >/dev/null
          test "$(jq '.audio_urls | length' hiphop_whatif/current/job.json)" -eq 8
          test "$(jq '.shorts | length' hiphop_whatif/current/job.json)" -eq 5
          test -s hiphop_whatif/current/build.py
          test -s hiphop_whatif/zero_touch_publish.py

      - name: Build zero-credit cinematic master and Shorts
        run: python hiphop_whatif/current/build.py

      - name: Hard technical QC
        shell: bash
        run: |
          set -euo pipefail
          FULL=hiphop_whatif/current/output/full.mp4
          THUMB=hiphop_whatif/current/output/thumbnail.jpg
          test -s "$FULL" && test -s "$THUMB"
          ffmpeg -v error -i "$FULL" -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$FULL" | grep -qx '1920,1080'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FULL" | grep -q .
          for i in 01 02 03 04 05; do
            S="hiphop_whatif/current/output/short_${i}.mp4"
            test -s "$S"
            ffmpeg -v error -i "$S" -f null -
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$S" | grep -qx '1080,1920'
          done

      - name: Publish full episode and schedule Shorts
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: python hiphop_whatif/zero_touch_publish.py hiphop_whatif/current/job.json

      - name: Publish thumbnail asset and arm shared YouTube thumbnail gate
        shell: bash
        run: |
          set -euo pipefail
          JOB=hiphop_whatif/current/job.json
          RECEIPT=hiphop_whatif/current/output/publish-receipt.json
          SLUG=$(jq -r '.slug' "$JOB")
          VIDEO_ID=$(jq -r '.full.youtube.video_id' "$RECEIPT")
          test -n "$VIDEO_ID" && test "$VIDEO_ID" != null
          DEST="published-assets/hiphop-what-if/$SLUG"
          mkdir -p "$DEST"
          cp hiphop_whatif/current/output/thumbnail.jpg "$DEST/thumbnail.jpg"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${DEST}/thumbnail.jpg"
          TITLE=$(jq -r '.full.title' "$JOB")
          TOKEN="hhwi-${SLUG}-$(date -u +%Y%m%d%H%M%S)"
          jq -n --arg show 'Hip Hop What If' --arg user 'HipHopWhatIf' --arg video_id "$VIDEO_ID" --arg thumbnail_url "$RAW" --arg title "$TITLE" --arg updated_token "$TOKEN" '{show:$show,user:$user,video_id:$video_id,thumbnail_url:$thumbnail_url,title:$title,updated_token:$updated_token}' > youtube-thumbnail-job.json
          git config user.name 'CTNETWORK Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST/thumbnail.jpg" youtube-thumbnail-job.json
          git commit -m "Arm Hip Hop What If thumbnail gate: $SLUG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save recovery outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiphop-what-if-eazy-recovery
          retention-days: 7
          path: |
            hiphop_whatif/current/output/full.mp4
            hiphop_whatif/current/output/short_*.mp4
            hiphop_whatif/current/output/thumbnail.jpg
            hiphop_whatif/current/output/publish-receipt.json
          if-no-files-found: warn
