name: Ringside S2E01 Narration Detached

on:
  push:
    paths:
      - '.github/workflows/ringside-s2e01-narration-detached.yml'
      - 'tools/ringside_s2e01_narration_detached.py'
      - 'runpod/ctnetwork_qwen_narrate_resume.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringside-s2e01-narration-detached
  cancel-in-progress: true

jobs:
  narrate-detached:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests websocket-client
      - name: Resume Kevin narration detached
        run: python tools/ringside_s2e01_narration_detached.py
      - name: Verify narration archive
        run: test -s narration-detached/ringside-s2e01-narration-only.tar.gz
      - name: Upload Kevin narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringside-s2e01-kevin-narration-detached
          path: narration-detached/ringside-s2e01-narration-only.tar.gz
          retention-days: 7
          if-no-files-found: error
