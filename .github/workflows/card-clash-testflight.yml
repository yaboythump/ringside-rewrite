name: Ringside Card Clash TestFlight
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-clash-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload the tested build to App Store Connect
        required: true
        type: boolean
        default: false
      release_candidate:
        description: Build the isolated Version 1.0 release candidate
        required: true
        type: boolean
        default: false
      inspect_build:
        description: Read Apple status and internal tester access for a build number
        required: false
        type: string

permissions:
  contents: read

env:
  RCC_RELEASE_SOURCE: 4bb6b41315d9c8ada510c8463e05d96332ae3acb
  RCC_SOURCE: ${{ inputs.release_candidate && '4bb6b41315d9c8ada510c8463e05d96332ae3acb' || '93f90f0a6dd021285d31bc5dbfbc4270380916a3' }}
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  RCC_TEAM: J4Y8FY6JNZ
  RCC_BUNDLE: com.ctnetworkstudios.ringsidecardclash
  RCC_PROJECT: games/card-clash/ios/RingsideCardClash.xcodeproj

concurrency:
  group: ringside-card-clash-testflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && !inputs.inspect_build
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RCC_SOURCE }}
          persist-credentials: false
      - name: Archive the tested iPhone build without signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RCC_SOURCE"
          archive="$RUNNER_TEMP/rcc-verify.xcarchive"
          xcodebuild -project "$RCC_PROJECT" -scheme RingsideCardClash \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/rcc-verify" \
            CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/RingsideCardClash.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$RCC_BUNDLE"
          test -s "$app/index.html"
          for cue in arena-loop tag entrance card hit big block hype heal count bell crowd boo ref-1 ref-2 ref-3; do
            test -s "$app/sound/$cue.mp3"
          done
          if [[ "$RCC_SOURCE" == "$RCC_RELEASE_SOURCE" ]]; then
            test -s "$app/sound/menu-loop.mp3"
            test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          fi
          node --test games/card-clash/tests/fight-camp.test.cjs games/card-clash/tests/ios-bridge.test.cjs
          xcodebuild -help 2>&1 | grep -E 'app-store-connect|authenticationKeyPath' > "$RUNNER_TEMP/rcc-xcode-help.txt"
          grep -F 'app-store-connect' "$RUNNER_TEMP/rcc-xcode-help.txt" >/dev/null
          grep -F 'authenticationKeyPath' "$RUNNER_TEMP/rcc-xcode-help.txt" >/dev/null

  upload:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.upload && !inputs.inspect_build
    needs: verify
    environment: ringside-testflight
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RCC_SOURCE }}
          persist-credentials: false
      - name: Sign and upload the private beta build
        env:
          ASC_PRIVATE_KEY: ${{ secrets.RCC_ASC_PRIVATE_KEY }}
          DISTRIBUTION_PACKAGE: ${{ secrets.RCC_DISTRIBUTION_PACKAGE }}
          ASC_KEY_ID: ${{ secrets.RCC_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.RCC_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RCC_SOURCE"
          for name in ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID DISTRIBUTION_PACKAGE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration for $name in ringside-testflight."
              exit 1
            fi
          done
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ || ! "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f-]+$ ]]; then
            echo "::error::Apple returned an unexpected key or issuer identifier format."
            exit 1
          fi
          umask 077
          signing="$(mktemp -d "$RUNNER_TEMP/rcc-signing.XXXXXX")"
          keychain="$signing/distribution.keychain-db"
          installed_profile=""
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            if [[ -n "$installed_profile" ]]; then rm -f -- "$installed_profile"; fi
            rm -rf -- "$signing"
          }
          trap cleanup EXIT
          auth_key="$signing/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key"
          unset ASC_PRIVATE_KEY
          if ! openssl pkey -in "$auth_key" -noout >/dev/null 2>&1; then
            echo "::error::RCC_ASC_PRIVATE_KEY must contain the original Apple .p8 file text."
            exit 1
          fi
          python3 - "$signing" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          value = os.environ["DISTRIBUTION_PACKAGE"].strip()
          try:
              package = json.loads(value)
          except json.JSONDecodeError:
              # A mobile paste may stop after the first field in an earlier package.
              match = re.match(r'\{\s*"certificate"\s*:\s*"([A-Za-z0-9+/=]+)"', value)
              package = {"certificate": match[1] if match else value}
          if not isinstance(package, dict):
              sys.exit("::error::The signing secret must contain the certificate package.")
          try:
              certificate = base64.b64decode(package["certificate"], validate=True)
              if not certificate:
                  raise ValueError("empty certificate")
          except (ValueError, KeyError, TypeError):
              sys.exit(f"::error::The signing secret has no complete certificate ({len(value)} characters received).")
          (output / "distribution.p12").write_bytes(certificate)

          if package.get("profile"):
              try:
                  profile = base64.b64decode(package["profile"], validate=True)
              except (ValueError, TypeError):
                  profile = b""
              if profile:
                  (output / "ringside.mobileprovision").write_bytes(profile)
          PY
          unset DISTRIBUTION_PACKAGE
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -noout > /dev/null 2>&1 || {
            echo "::error::The signing secret does not contain a complete PKCS#12 file."
            exit 1
          }
          if [[ ! -s "$signing/ringside.mobileprovision" ]]; then
            # Download only the App Store profile created for Ringside.
            token="$(ruby -ropenssl -rbase64 -rjson - "$auth_key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'RUBY'
          key_path, key_id, issuer = ARGV
          encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
          now = Time.now.to_i
          header = encode.call(JSON.generate(alg: "ES256", kid: key_id, typ: "JWT"))
          claims = encode.call(JSON.generate(iss: issuer, iat: now, exp: now + 300, aud: "appstoreconnect-v1"))
          input = "#{header}.#{claims}"
          key = OpenSSL::PKey.read(File.binread(key_path))
          der = key.sign("SHA256", input)
          raw = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\x00") }.join
          puts "#{input}.#{encode.call(raw)}"
          RUBY
            )"
            echo "::add-mask::$token"
            if ! curl --silent --show-error --fail --max-time 30 --get \
              --header "Authorization: Bearer $token" \
              --data-urlencode 'filter[name]=Ringside Card Clash App Store' \
              --data-urlencode 'fields[profiles]=name,profileType,profileState,profileContent' \
              --output "$signing/profile-response.json" https://api.appstoreconnect.apple.com/v1/profiles; then
              echo "::error::Apple would not supply the Ringside provisioning profile with the upload key."
              exit 1
            fi
            unset token
            python3 - "$signing" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          signing = Path(sys.argv[1])
          records = json.loads((signing / "profile-response.json").read_bytes())["data"]
          matches = [
              row["attributes"]["profileContent"] for row in records
              if row["attributes"]["name"] == "Ringside Card Clash App Store"
              and row["attributes"]["profileType"] == "IOS_APP_STORE"
              and row["attributes"]["profileState"] == "ACTIVE"
          ]
          if len(matches) != 1:
              sys.exit("::error::Apple did not return exactly one active Ringside App Store profile.")
          (signing / "ringside.mobileprovision").write_bytes(base64.b64decode(matches[0], validate=True))
          PY
          fi
          security cms -D -i "$signing/ringside.mobileprovision" > "$signing/profile.plist"
          profile_id="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$signing/profile.plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$signing/profile.plist")"
          [[ "$profile_id" =~ ^[0-9A-Fa-f-]{36}$ && "$app_id" == "$RCC_TEAM.$RCC_BUNDLE" ]]
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          installed_profile="$profile_dir/$profile_id.mobileprovision"
          cp "$signing/ringside.mobileprovision" "$installed_profile"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security list-keychains -d user -s "$keychain"
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -nodes -out "$signing/identity.pem"
          openssl rand -hex 24 > "$signing/import-password"
          openssl pkcs12 -export -in "$signing/identity.pem" -out "$signing/apple-import.p12" \
            -passout "file:$signing/import-password" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security import "$signing/apple-import.p12" -f pkcs12 -k "$keychain" \
            -P "$(cat "$signing/import-password")" -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$signing/identity.pem" "$signing/apple-import.p12" "$signing/import-password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          unset keychain_password
          auth=(-authenticationKeyPath "$auth_key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          archive="$RUNNER_TEMP/rcc-upload.xcarchive"
          xcodebuild -project "$RCC_PROJECT" -scheme RingsideCardClash \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/rcc-upload" \
            DEVELOPMENT_TEAM="$RCC_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive
          app="$archive/Products/Applications/RingsideCardClash.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$RCC_BUNDLE"
          test -s "$app/index.html"
          if [[ "$RCC_SOURCE" == "$RCC_RELEASE_SOURCE" ]]; then
            test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = false
          fi
          codesign --verify --strict "$app"
          export_options="$signing/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate -string "Apple Distribution" "$export_options"
          plutil -insert provisioningProfiles -xml '<dict/>' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$RCC_BUNDLE string $profile_id" "$export_options"
          plutil -insert teamID -string "$RCC_TEAM" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          xcodebuild -exportArchive -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/rcc-testflight-export" -exportOptionsPlist "$export_options" "${auth[@]}"

          # Read Apple’s processing and TestFlight state with the existing upload key.
          token="$(ruby -ropenssl -rbase64 -rjson - "$auth_key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'RUBY'
          key_path, key_id, issuer = ARGV
          encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
          now = Time.now.to_i
          header = encode.call(JSON.generate(alg: "ES256", kid: key_id, typ: "JWT"))
          claims = encode.call(JSON.generate(iss: issuer, iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
          input = "#{header}.#{claims}"
          key = OpenSSL::PKey.read(File.binread(key_path))
          der = key.sign("SHA256", input)
          raw = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\x00") }.join
          puts "#{input}.#{encode.call(raw)}"
          RUBY
          )"
          echo "::add-mask::$token"
          RCC_STATUS_TOKEN="$token" RCC_BUILD="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          build = os.environ["RCC_BUILD"]
          headers = {"Authorization": "Bearer " + os.environ["RCC_STATUS_TOKEN"]}

          def get(path, filters):
              url = "https://api.appstoreconnect.apple.com/v1/" + path
              request = urllib.request.Request(url + "?" + urllib.parse.urlencode(filters), headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              apps = get("apps", {"filter[bundleId]": os.environ["RCC_BUNDLE"], "fields[apps]": "bundleId"})["data"]
              if len(apps) != 1:
                  print("::warning::Apple accepted the upload, but did not return one matching app record.")
                  raise SystemExit(0)

              app = apps[0]["id"]
              versions = get(f"apps/{app}/appStoreVersions", {
                  "filter[platform]": "IOS",
                  "filter[versionString]": "1.0",
                  "fields[appStoreVersions]": "versionString,appStoreState",
              })["data"]
              for version in versions:
                  print("App Store 1.0 state:", version["attributes"]["appStoreState"])
              if not versions:
                  print("App Store 1.0 version record not found.")
          except urllib.error.HTTPError as error:
              print(f"::warning::App Store Connect status query returned HTTP {error.code}. The build was uploaded.")
              raise SystemExit(0)
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
              print("::warning::App Store Connect status could not be read. The build was uploaded.")
              raise SystemExit(0)

          for attempt in range(12):
              try:
                  response = get("builds", {
                      "filter[app]": app,
                      "filter[preReleaseVersion.version]": "1.0",
                      "filter[version]": build,
                      "include": "buildBetaDetail",
                      "fields[builds]": "version,processingState,buildBetaDetail",
                      "fields[buildBetaDetails]": "internalBuildState",
                  })
                  records = response["data"]
                  state = records[0]["attributes"]["processingState"] if records else "NOT_INDEXED"
                  beta = next((item["attributes"]["internalBuildState"] for item in response.get("included", [])
                               if item["type"] == "buildBetaDetails"), "UNKNOWN")
                  print(f"Build {build}: processing={state}; internal TestFlight={beta}", flush=True)
                  if beta in {"READY_FOR_BETA_TESTING", "IN_BETA_TESTING"} and records:
                      try:
                          groups = get(f"builds/{records[0]['id']}/betaGroups", {
                              "fields[betaGroups]": "isInternalGroup",
                              "limit": 200,
                          })["data"]
                          internal = sum(group["attributes"]["isInternalGroup"] for group in groups)
                          print(f"Build {build}: assigned internal TestFlight groups={internal}")
                      except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
                          print("::warning::Internal TestFlight group assignments could not be confirmed.")
                      break
                  if state in {"INVALID", "FAILED"} or beta in {
                      "MISSING_EXPORT_COMPLIANCE",
                      "PROCESSING_EXCEPTION", "IN_EXPORT_COMPLIANCE_REVIEW", "EXPIRED",
                  }:
                      break
              except urllib.error.HTTPError as error:
                  print(f"::warning::Apple upload succeeded, but build status returned HTTP {error.code}.")
                  break
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError):
                  print("::warning::No build status returned on this attempt.")
              if attempt < 11:
                  time.sleep(20)
          PYTHON
          unset token

  inspect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.inspect_build && !inputs.upload
    environment: ringside-testflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the game’s Apple release and TestFlight records
        env:
          RCC_BUILD: ${{ inputs.inspect_build }}
          ASC_PRIVATE_KEY: ${{ secrets.RCC_ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.RCC_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.RCC_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ "$RCC_BUILD" =~ ^[0-9]+\.[0-9]+$ ]]
          umask 077
          auth_key="$(mktemp "$RUNNER_TEMP/rcc-status.XXXXXX")"
          trap 'rm -f -- "$auth_key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key"
          unset ASC_PRIVATE_KEY
          token="$(ruby -ropenssl -rbase64 -rjson - "$auth_key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'RUBY'
          key_path, key_id, issuer = ARGV
          encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
          now = Time.now.to_i
          header = encode.call(JSON.generate(alg: "ES256", kid: key_id, typ: "JWT"))
          claims = encode.call(JSON.generate(iss: issuer, iat: now, exp: now + 600, aud: "appstoreconnect-v1"))
          input = "#{header}.#{claims}"
          key = OpenSSL::PKey.read(File.binread(key_path))
          der = key.sign("SHA256", input)
          raw = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\x00") }.join
          puts "#{input}.#{encode.call(raw)}"
          RUBY
          )"
          echo "::add-mask::$token"
          RCC_STATUS_TOKEN="$token" python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          host = "https://api.appstoreconnect.apple.com/v1/"
          headers = {"Authorization": "Bearer " + os.environ["RCC_STATUS_TOKEN"]}
          build_version = os.environ["RCC_BUILD"]

          def fetch(path, params=None):
              url = host + path + "?" + urllib.parse.urlencode(params or {})
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=18) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(f"Apple {path.split('/')[-1]} query returned HTTP {error.code}.")
              except (urllib.error.URLError, TimeoutError, ValueError):
                  print(f"Apple {path.split('/')[-1]} query did not return a usable response.")
              return None

          def rows(response):
              return (response or {}).get("data", [])

          apps = rows(fetch("apps", {"filter[bundleId]": os.environ["RCC_BUNDLE"]}))
          if len(apps) != 1:
              raise SystemExit("Expected exactly one matching app.")
          app = apps[0]["id"]
          versions = rows(fetch(f"apps/{app}/appStoreVersions", {
              "filter[platform]": "IOS", "filter[versionString]": "1.0",
              "fields[appStoreVersions]": "versionString,appStoreState",
          }))
          for version in versions:
              version_id = version["id"]
              print("Release state:", version["attributes"]["appStoreState"])
              localizations = rows(fetch(f"appStoreVersions/{version_id}/appStoreVersionLocalizations", {
                  "fields[appStoreVersionLocalizations]": "locale,description,supportUrl",
              }))
              for loc in localizations:
                  fields = loc["attributes"]
                  print(fields["locale"], "store description set:", bool(fields.get("description")),
                        "support URL set:", bool(fields.get("supportUrl")))
          infos = rows(fetch(f"apps/{app}/appInfos", {"fields[appInfos]": "appStoreState"}))
          for info in infos:
              locs = rows(fetch(f"appInfos/{info['id']}/appInfoLocalizations", {
                  "fields[appInfoLocalizations]": "locale,privacyPolicyUrl",
              }))
              for loc in locs:
                  fields = loc["attributes"]
                  print(fields["locale"], "privacy URL set:", bool(fields.get("privacyPolicyUrl")))

          builds = rows(fetch("builds", {
              "filter[app]": app, "filter[version]": build_version,
              "filter[preReleaseVersion.version]": "1.0", "fields[builds]": "version,processingState",
          }))
          if len(builds) != 1:
              raise SystemExit("Expected exactly one matching iPhone build.")
          build = builds[0]
          print("Build", build_version, "processing:", build["attributes"]["processingState"])
          group_response = fetch("betaGroups", {
              "filter[app]": app, "fields[betaGroups]": "isInternalGroup,hasAccessToAllBuilds",
              "limit": 200,
          })
          if group_response is None:
              raise SystemExit("Internal TestFlight groups could not be checked with this key.")
          internal = [g for g in rows(group_response) if g["attributes"].get("isInternalGroup")]
          accessible = 0
          unknown = 0
          for group in internal:
              if group["attributes"].get("hasAccessToAllBuilds"):
                  accessible += 1
                  continue
              group_builds = fetch(f"betaGroups/{group['id']}/builds", {
                  "fields[builds]": "version", "limit": 200,
              })
              if group_builds is None:
                  unknown += 1
              elif any(candidate["id"] == build["id"] for candidate in rows(group_builds)):
                  accessible += 1
              elif group_builds.get("links", {}).get("next"):
                  unknown += 1
          print(f"Build {build_version}: internal groups with access={accessible}, "
                f"groups checked={len(internal)}, group checks unresolved={unknown}")
          PYTHON
          unset token
