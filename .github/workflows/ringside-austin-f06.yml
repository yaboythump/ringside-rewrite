name: Ringside Austin F06 Narration

on:
  push:
    paths:
      - 'ringside-austin-f06-command.json'
      - 'tools/ringside_austin_f06_remote.py'
      - '.github/workflows/ringside-austin-f06.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ringside-austin-f06
  cancel-in-progress: true

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve active factory pod
        id: pod
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id // empty' ringside-austin-f06-command.json)
          TARGET=$(jq -r '.target_name // "ctnetwork-factory-next"' ringside-austin-f06-command.json)
          if [[ -n "$POD_ID" ]]; then
            HTTP=$(curl -sS -o /tmp/pod.json -w '%{http_code}' "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer ${RUNPOD_API_KEY}" || true)
          else
            HTTP=404
          fi
          if [[ "$HTTP" != 200 ]]; then
            PODS=$(curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer ${RUNPOD_API_KEY}")
            POD_ID=$(printf '%s' "$PODS" | jq -r --arg target "$TARGET" '[.[]|select((.name//"")==$target)]|first|.id // empty')
            [[ -n "$POD_ID" ]] || { echo "Factory pod not found"; exit 3; }
            curl -fsS "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer ${RUNPOD_API_KEY}" > /tmp/pod.json
          fi
          STATUS=$(jq -r '.desiredStatus // "unknown"' /tmp/pod.json)
          if [[ "$STATUS" != RUNNING ]]; then
            curl -sS -X POST "https://rest.runpod.io/v1/pods/$POD_ID/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
            for i in $(seq 1 120); do
              sleep 5
              HTTP=$(curl -sS -o /tmp/pod.json -w '%{http_code}' "https://rest.runpod.io/v1/pods/$POD_ID" -H "Authorization: Bearer ${RUNPOD_API_KEY}" || true)
              [[ "$HTTP" == 200 ]] || continue
              STATUS=$(jq -r '.desiredStatus // "unknown"' /tmp/pod.json)
              [[ "$STATUS" == RUNNING ]] && break
            done
          fi
          [[ "$STATUS" == RUNNING ]] || { echo "Pod failed to reach RUNNING: $STATUS"; exit 4; }
          JPASS=$(jq -r '.env.JUPYTER_PASSWORD // empty' /tmp/pod.json)
          [[ -n "$JPASS" ]] || { echo "Jupyter password missing"; exit 5; }
          echo "::add-mask::$JPASS"
          umask 077
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Generate F06 narration only
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet requests websocket-client
          python3 tools/ringside_austin_f06_remote.py

      - name: Preserve narration immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ringside-Austin-F06
          path: deliverables/F06_Austin.wav
          if-no-files-found: warn
          retention-days: 30

      - name: Deliver raw narration immediately
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s deliverables/F06_Austin.wav || exit 0
          TAG=ringside-austin-f06
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" deliverables/F06_Austin.wav --clobber
          else
            gh release create "$TAG" deliverables/F06_Austin.wav --title "Ringside Rewrite Austin F06 Narration" --notes "Narration-only delivery for What If Stone Cold Never Broke His Neck?"
          fi

      - name: Validate narration
        shell: bash
        run: |
          set -euo pipefail
          test -s deliverables/F06_Austin.wav
          python3 -c "import json,wave,os; p='deliverables/F06_Austin.wav'; w=wave.open(p,'rb'); sr=w.getframerate(); frames=w.getnframes(); ch=w.getnchannels(); w.close(); print(json.dumps({'duration':frames/sr,'size':os.path.getsize(p),'sample_rate':sr,'channels':ch},indent=2))" | tee deliverables/f06_ffprobe.json

      - name: Attach validation report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s deliverables/f06_ffprobe.json || exit 0
          gh release upload ringside-austin-f06 deliverables/f06_ffprobe.json --clobber || true

      - name: Stop factory after narration
        if: success()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          set +e
          [[ -n "${POD_ID:-}" ]] || exit 0
          curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null
