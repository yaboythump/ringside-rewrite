          - Jay-Z backstage, 2000 — Mikamote / Wikimedia Commons — CC BY-SA 3.0
            https://commons.wikimedia.org/wiki/File:Jay-Z-01-mika.jpg
          - Marcy Houses — Jim.henderson / Wikimedia Commons — CC0 1.0
            https://commons.wikimedia.org/wiki/File:Marcy_Houses_Park_Av_rainy_jeh.jpg
          - Brooklyn Bridge in 2000 — Joseolgon / Wikimedia Commons — license listed on Wikimedia Commons file page
            https://commons.wikimedia.org/wiki/File:Brooklyn_Bridge_in_2000_01.jpg
          All motion graphics, branding frames, timeline art, music bed, and edit treatments are original CTNETWORK / Hip Hop What If production assets.
          Historical setup is factual; events after the branch point are hypothetical alternate-history commentary.
          EOF
          cat > final/METADATA.txt <<'EOF'
