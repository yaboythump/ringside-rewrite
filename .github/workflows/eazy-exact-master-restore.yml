name: Restore exact Eazy-E master

on:
  workflow_dispatch:
  push:
    paths:
      - 'hiphop_whatif/eazy-exact-restore-trigger.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: hiphop-what-if-eazy-exact-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install restore runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests

      - name: Recover exact approved artifact
        uses: actions/download-artifact@v4
        with:
          name: hiphop-what-if-eazy-recovery
          path: /tmp/eazy
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34482046413

      - name: Restore exact master to YouTube and Facebook
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: python scripts/restore_eazy_exact.py

      - name: Save restore receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eazy-e-exact-restore-receipt
          retention-days: 14
          path: /tmp/eazy/restore-receipt-20260911.json
          if-no-files-found: warn
