name: Ringside WCW Review Master

on:
  push:
    paths:
      - 'tools/ringside_wcw_fullframe_rebuild.py'
      - '.github/workflows/ringside-wcw-review-master.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ringside-wcw-review-master
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependencies
        run: python -m pip install --quiet requests websocket-client
      - name: Rebuild WCW master with full-frame visuals
        run: python tools/ringside_wcw_fullframe_rebuild.py
      - name: Upload corrected review master
        uses: actions/upload-artifact@v4
        with:
          name: ringside-wcw-fullframe-review
          path: ringside-wcw-reframed/
          retention-days: 7
          if-no-files-found: error
