name: CTNETWORK Narrator Archive Scan

on:
  push:
    paths:
      - 'ctnetwork-narrator-archive-command.json'
      - '.github/workflows/ctnetwork-narrator-archive-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve pod
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id' ctnetwork-narrator-archive-command.json)
          API="https://rest.runpod.io/v1/pods/${POD_ID}"
          POD=$(curl -fsS "$API" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
          if [[ "$STATUS" != "RUNNING" ]]; then
            curl -fsS -X POST "$API/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
            for i in $(seq 1 90); do
              sleep 4
              POD=$(curl -fsS "$API" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
              STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
              [[ "$STATUS" == "RUNNING" ]] && break
            done
          fi
          [[ "$STATUS" == "RUNNING" ]] || exit 2
          JPASS=$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          [[ -n "$JPASS" ]] || exit 3
          echo "::add-mask::$JPASS"
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Scan archive
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY' | tee /tmp/ctn-voice-archive.txt
          import base64, json, os, re, sys, time
          import requests, websocket
          pid=os.environ['POD_ID']; pw=open(os.environ['JUPYTER_PASSWORD_FILE']).read().strip()
          base=f'https://{pid}-8888.proxy.runpod.net'; s=requests.Session()
          for _ in range(60):
              try:
                  r=s.get(base+'/login',timeout=10)
                  if r.ok: break
              except Exception: pass
              time.sleep(2)
          else: raise SystemExit('Jupyter unavailable')
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
          if not m: raise SystemExit('xsrf missing')
          rr=s.post(base+'/login',data={'_xsrf':m.group(1),'password':pw,'next':'/'},timeout=20,allow_redirects=False)
          if rr.status_code not in (200,302,303): rr.raise_for_status()
          xc=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xc} if xc else {}
          t=s.post(base+'/api/terminals',headers=headers,json={},timeout=20); t.raise_for_status(); name=t.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pid}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=30)
          script=r'''set +e
          echo "=== ARCHIVE DIRS ==="
          find /workspace/CTNETWORK_ARCHIVE -maxdepth 4 -type d 2>/dev/null | sort | head -400
          echo "=== ARCHIVE AUDIO ==="
          find /workspace/CTNETWORK_ARCHIVE -maxdepth 8 -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.flac' \) 2>/dev/null | sort | head -1000
          echo "=== VOICE-NAMED FILES ANY TYPE ==="
          find /workspace/CTNETWORK_ARCHIVE -maxdepth 8 -type f 2>/dev/null | grep -Ei 'voice|narr|audition|casting|reel|female|male|f0?[0-9]|m0?[0-9]' | sort | head -1000
          echo "__ARCHIVE_SCAN_DONE__"
          '''
          enc=base64.b64encode(script.encode()).decode()
          marker='__ARCHIVE_DONE__'+str(int(time.time()*1000))
          ws.send(json.dumps(['stdin',f"echo {enc} | base64 -d >/tmp/archive-scan.sh; bash /tmp/archive-scan.sh; rc=$?; echo {marker}:$rc\n"]))
          buf=''; deadline=time.time()+240
          try:
              while time.time()<deadline:
                  try: msg=ws.recv()
                  except Exception: continue
                  try: data=json.loads(msg)
                  except Exception: continue
                  if isinstance(data,list) and len(data)>=2 and data[0]=='stdout':
                      txt=data[1]; buf+=txt; sys.stdout.write(txt); sys.stdout.flush()
                      if marker in buf: break
          finally:
              ws.close()
              try:s.delete(base+f'/api/terminals/{name}',headers=headers,timeout=10)
              except Exception:pass
          PY

      - name: Save report
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          cp /tmp/ctn-voice-archive.txt infra/status/ctnetwork-narrator-archive-latest.txt 2>/dev/null || echo archive_scan_failed > infra/status/ctnetwork-narrator-archive-latest.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-narrator-archive-latest.txt
          git commit -m 'CTNETWORK: record narrator archive scan' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
