name: Deploy Card Clash to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - ".github/workflows/deploy-card-clash-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the game into one page
        run: python3 games/card-clash/build.py _site/index.html
      - name: Build Ringside Combo into /ring-combo/
        run: python3 games/ring-combo/build.py _site/ring-combo/index.html
      - name: Build Worst Roommates into /worst-roommates/
        run: python3 games/worst-roommates/build.py _site/worst-roommates/index.html
      - name: Publish Detective Duo into /detective-duo/
        run: |
          mkdir -p _site/detective-duo
          cp games/detective-duo/index.html games/detective-duo/cinematic.css games/detective-duo/audio.js games/detective-duo/sw.js _site/detective-duo/
          cp -R games/detective-duo/assets _site/detective-duo/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

