name: RunPod LTX Redeploy

on:
  push:
    paths:
      - '.github/workflows/runpod-redeploy-ltx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Install current runpodctl and deploy official CUDA 13 ComfyUI pod
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://cli.runpod.net | sudo bash
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          command -v runpodctl
          runpodctl version

          echo 'Verifying official template:'
          runpodctl template get 2lv7ev3wfp > /tmp/template.json
          cat /tmp/template.json | jq '{id,name,imageName,isRunpod,containerDiskInGb,ports}'

          echo 'Creating Blackwell pod:'
          runpodctl pod create \
            --name urban_silver_ape_v3 \
            --template-id 2lv7ev3wfp \
            --gpu-id "NVIDIA RTX PRO 4500 Blackwell" \
            --container-disk-in-gb 160 \
            --ports "8188/http,8080/http,8888/http,22/tcp" \
            > /tmp/pod.json
          cat /tmp/pod.json | jq .
          NEW_ID=$(jq -r '.id // empty' /tmp/pod.json)
          [[ -n "$NEW_ID" ]] || { echo 'No pod ID returned'; exit 2; }
          echo "NEW_POD_ID=$NEW_ID" >> "$GITHUB_ENV"
          echo "New pod: $NEW_ID"

          echo 'Polling ComfyUI proxy:'
          READY=0
          for N in $(seq 1 90); do
            CODE=$(curl -sS -o /tmp/stats -w '%{http_code}' --max-time 10 \
              "https://${NEW_ID}-8188.proxy.runpod.net/system_stats" || true)
            if [[ "$CODE" == "200" ]]; then
              echo "ready_poll=$N http=200"
              cat /tmp/stats | jq '{system,devices}'
              READY=1
              break
            fi
            echo "ready_poll=$N http=${CODE:-none}"
            sleep 5
          done
          [[ "$READY" == "1" ]] || { echo "ComfyUI proxy did not become ready for pod $NEW_ID"; exit 3; }
