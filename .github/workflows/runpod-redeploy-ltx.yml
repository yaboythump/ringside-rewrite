name: RunPod LTX Redeploy

on:
  push:
    paths:
      - '.github/workflows/runpod-redeploy-ltx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Discover and deploy current official CUDA 13 ComfyUI pod
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://cli.runpod.net | sudo bash
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          runpodctl version

          echo 'Discovering current ComfyUI templates:'
          runpodctl template search comfyui > /tmp/templates.json
          cat /tmp/templates.json | jq .
          TPL_ID=$(jq -r '.. | objects | select(((.name? // "") | test("ComfyUI.*CUDA 13";"i"))) | .id // empty' /tmp/templates.json | head -n1)
          if [[ -z "$TPL_ID" ]]; then
            TPL_ID=$(jq -r '.. | objects | select((((.name? // "") + " " + (.imageName? // "")) | test("comfyui";"i")) and (((.name? // "") + " " + (.imageName? // "")) | test("cuda13|cuda13.0";"i"))) | .id // empty' /tmp/templates.json | head -n1)
          fi
          [[ -n "$TPL_ID" ]] || { echo 'No live CUDA 13 ComfyUI template found'; exit 2; }
          echo "Selected template: $TPL_ID"
          runpodctl template get "$TPL_ID" > /tmp/template.json
          cat /tmp/template.json | jq .

          echo 'Creating Blackwell pod:'
          runpodctl pod create \
            --name urban_silver_ape_v3 \
            --template-id "$TPL_ID" \
            --gpu-id "NVIDIA RTX PRO 4500 Blackwell" \
            --container-disk-in-gb 160 \
            --ports "8188/http,8080/http,8888/http,22/tcp" \
            > /tmp/pod.json
          cat /tmp/pod.json | jq .
          NEW_ID=$(jq -r '.id // empty' /tmp/pod.json)
          [[ -n "$NEW_ID" ]] || { echo 'No pod ID returned'; exit 3; }
          echo "NEW_POD_ID=$NEW_ID" >> "$GITHUB_ENV"
          echo "New pod: $NEW_ID"

          echo 'Polling ComfyUI proxy:'
          READY=0
          for N in $(seq 1 90); do
            CODE=$(curl -sS -o /tmp/stats -w '%{http_code}' --max-time 10 \
              "https://${NEW_ID}-8188.proxy.runpod.net/system_stats" || true)
            if [[ "$CODE" == "200" ]]; then
              echo "ready_poll=$N http=200"
              cat /tmp/stats | jq '{system,devices}'
              READY=1
              break
            fi
            echo "ready_poll=$N http=${CODE:-none}"
            sleep 5
          done
          [[ "$READY" == "1" ]] || { echo "ComfyUI proxy did not become ready for pod $NEW_ID"; exit 4; }
