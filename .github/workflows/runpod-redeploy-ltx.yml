name: RunPod LTX Redeploy

on:
  push:
    paths:
      - '.github/workflows/runpod-redeploy-ltx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Deploy fresh RTX PRO 4500 Blackwell ComfyUI pod
        shell: bash
        run: |
          set -euo pipefail
          QUERY='mutation { podFindAndDeployOnDemand(input: { cloudType: SECURE, gpuCount: 1, volumeInGb: 0, containerDiskInGb: 40, minVcpuCount: 2, minMemoryInGb: 16, gpuTypeId: "NVIDIA RTX PRO 4500 Blackwell", name: "urban_silver_ape_v2", templateId: "runpod-comfy", ports: "8888/http,3000/http,22/tcp", volumeMountPath: "/workspace" }) { id imageName env machineId containerDiskInGb costPerHr desiredStatus machine { podHostId } } }'
          jq -nc --arg q "$QUERY" '{query:$q}' >/tmp/deploy.json
          curl -fsS -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H 'content-type: application/json' --data @/tmp/deploy.json >/tmp/result.json
          cat /tmp/result.json | jq '{errors,data}'
          ERR=$(jq -r '.errors[0].message // empty' /tmp/result.json)
          if [[ -n "$ERR" ]]; then
            echo "Deploy error: $ERR"
            exit 1
          fi
          NEW_ID=$(jq -r '.data.podFindAndDeployOnDemand.id // empty' /tmp/result.json)
          [[ -n "$NEW_ID" ]] || { echo 'No pod ID returned'; exit 2; }
          echo "NEW_POD_ID=$NEW_ID" >> "$GITHUB_ENV"
          echo "New pod: $NEW_ID"
          sleep 12
          curl -fsS "https://rest.runpod.io/v1/pods/${NEW_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            | jq '{id,name,desiredStatus,imageName,templateId,gpu,machineId,publicIp,portMappings,containerDiskInGb,volumeInGb,volumeMountPath,ports,costPerHr,lastStartedAt}'
