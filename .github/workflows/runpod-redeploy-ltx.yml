name: RunPod LTX Redeploy

on:
  push:
    paths:
      - '.github/workflows/runpod-redeploy-ltx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Deploy fresh RTX 5090 ComfyUI pod
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc '{
            name:"urban_silver_ape_v2",
            templateId:"runpod-comfy",
            cloudType:"SECURE",
            computeType:"GPU",
            gpuTypeIds:["NVIDIA GeForce RTX 5090"],
            gpuTypePriority:"availability",
            gpuCount:1,
            allowedCudaVersions:["13.0","12.9","12.8"],
            containerDiskInGb:20,
            ports:["8888/http","3000/http","22/tcp"]
          }')
          HTTP=$(curl -sS -o /tmp/new-pod.json -w '%{http_code}' -X POST \
            'https://rest.runpod.io/v1/pods' \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$BODY")
          echo "HTTP=$HTTP"
          cat /tmp/new-pod.json | jq '{id,name,desiredStatus,imageName,templateId,gpu,machineId,containerDiskInGb,volumeInGb,volumeMountPath,ports,costPerHr,lastStartedAt}'
          [[ "$HTTP" =~ ^2 ]] || exit 1
          NEW_ID=$(jq -r '.id // empty' /tmp/new-pod.json)
          [[ -n "$NEW_ID" ]] || exit 2
          echo "NEW_POD_ID=$NEW_ID" >> "$GITHUB_ENV"
          sleep 12
          curl -fsS "https://rest.runpod.io/v1/pods/${NEW_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            | jq '{id,name,desiredStatus,imageName,templateId,gpu,machineId,publicIp,portMappings,containerDiskInGb,volumeInGb,volumeMountPath,ports,costPerHr,lastStartedAt}'
