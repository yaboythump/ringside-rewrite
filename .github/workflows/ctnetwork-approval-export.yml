name: CTNETWORK Approval Package Export

on:
  push:
    paths:
      - 'ctnetwork-export-command.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctnetwork-approval-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Mount approval production volume
        id: pod
        shell: bash
        run: |
          set -Eeuo pipefail
          VOLUME=$(jq -r '.network_volume_id // "9wjb3sa5zm"' ctnetwork-export-command.json)
          DC=$(jq -r '.data_center_id // "EU-RO-1"' ctnetwork-export-command.json)
          AUTH=(-H "Authorization: Bearer ${RUNPOD_API_KEY}")
          JPASS=$(openssl rand -hex 24); echo "::add-mask::$JPASS"
          GPU_TYPES='["NVIDIA RTX PRO 4500 Blackwell","NVIDIA GeForce RTX 5090","NVIDIA RTX PRO 6000 Blackwell Server Edition","NVIDIA A100 80GB PCIe"]'
          BODY=$(jq -nc --arg name "ctnetwork-approval-export-$(date +%s)" --arg dc "$DC" --arg vol "$VOLUME" --arg jp "$JPASS" --argjson gpus "$GPU_TYPES" '{name:$name,imageName:"runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",cloudType:"SECURE",computeType:"GPU",gpuTypeIds:$gpus,gpuTypePriority:"availability",gpuCount:1,dataCenterIds:[$dc],dataCenterPriority:"availability",containerDiskInGb:40,networkVolumeId:$vol,volumeMountPath:"/workspace",ports:["8888/http","8000/http","22/tcp"],env:{JUPYTER_PASSWORD:$jp}}')
          HTTP=$(curl -sS -o /tmp/ctn-export-create.json -w '%{http_code}' -X POST https://rest.runpod.io/v1/pods "${AUTH[@]}" -H 'Content-Type: application/json' --data "$BODY" || true)
          [[ "$HTTP" =~ ^2 ]] || { cat /tmp/ctn-export-create.json; exit 4; }
          POD_ID=$(jq -r '.id // empty' /tmp/ctn-export-create.json); [[ -n "$POD_ID" ]] || exit 5
          for i in $(seq 1 90); do
            P=$(curl -sS "https://rest.runpod.io/v1/pods/$POD_ID" "${AUTH[@]}" 2>/dev/null || true)
            S=$(printf '%s' "$P" | jq -r '.desiredStatus // "unknown"' 2>/dev/null || echo unknown)
            echo "pod=$POD_ID attempt=$i/90 status=$S"
            [[ "$S" == RUNNING ]] && break
            sleep 5
          done
          [[ "$S" == RUNNING ]] || exit 6
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "APPROVAL_VOLUME_READY pod=$POD_ID volume=$VOLUME"

      - name: Wait for Jupyter
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${POD_ID}-8888.proxy.runpod.net/login" || true)
            echo "jupyter attempt=$i http=$code"
            [[ "$code" == 200 ]] && exit 0
            sleep 5
          done
          exit 8

      - name: Serve approval folder
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY'
          import json, os, re, time
          from pathlib import Path
          import requests, websocket

          pod=os.environ['POD_ID']
          password=Path(os.environ['JUPYTER_PASSWORD_FILE']).read_text().strip()
          folder=json.load(open('ctnetwork-export-command.json'))['folder']
          base=f'https://{pod}-8888.proxy.runpod.net'
          s=requests.Session()
          r=s.get(base+'/login',timeout=20); r.raise_for_status()
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
          if not m: raise RuntimeError('xsrf missing')
          rr=s.post(base+'/login',data={'_xsrf':m.group(1),'password':password,'next':'/'},timeout=20,allow_redirects=False)
          if rr.status_code not in (200,302,303): raise RuntimeError(f'login {rr.status_code}')
          xs=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xs} if xs else {}
          sr=s.get(base+'/api/status',headers=headers,timeout=20); sr.raise_for_status()
          tr=s.post(base+'/api/terminals',headers=headers,json={},timeout=30); tr.raise_for_status()
          name=tr.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pod}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=60)
          marker='__CTN_APPROVAL_HTTP_READY__'
          target=f'/workspace/ctnetwork-local/ready_for_approval/{folder}'
          cmd=f"test -f '{target}/master.mp4' && cd '{target}' && nohup python3 -m http.server 8000 --bind 0.0.0.0 >/tmp/ctn-approval-http.log 2>&1 & echo {marker}\n"
          ws.send(json.dumps(['stdin',cmd]))
          deadline=time.time()+60; seen=False
          while time.time()<deadline:
              msg=ws.recv()
              try: data=json.loads(msg)
              except Exception: continue
              if isinstance(data,list) and len(data)>=2 and data[0]=='stdout' and marker in data[1]:
                  seen=True; break
          ws.close()
          if not seen: raise RuntimeError('approval HTTP server did not start')
          print('APPROVAL_HTTP_SERVER_STARTED',target,flush=True)
          PY
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://${POD_ID}-8000.proxy.runpod.net/master.mp4" || true)
            echo "approval-http attempt=$i http=$code"
            [[ "$code" == 200 ]] && exit 0
            sleep 3
          done
          exit 9

      - name: Download ready-for-approval files
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p approval-export
          BASE="https://${POD_ID}-8000.proxy.runpod.net"
          for name in master.mp4 short_01_9x16.mp4 short_02_9x16.mp4 short_03_9x16.mp4 thumbnail.jpg qc.json approval.json; do
            curl -fL --retry 4 --retry-delay 2 --max-time 300 "$BASE/$name" -o "approval-export/$name"
            test -s "approval-export/$name"
            echo "EXPORTED $name $(stat -c%s "approval-export/$name")"
          done

      - name: Upload master
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-master
          path: approval-export/master.mp4
          compression-level: 0
          retention-days: 7
      - name: Upload short 1
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-short-01
          path: approval-export/short_01_9x16.mp4
          compression-level: 0
          retention-days: 7
      - name: Upload short 2
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-short-02
          path: approval-export/short_02_9x16.mp4
          compression-level: 0
          retention-days: 7
      - name: Upload short 3
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-short-03
          path: approval-export/short_03_9x16.mp4
          compression-level: 0
          retention-days: 7
      - name: Upload thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-thumbnail
          path: approval-export/thumbnail.jpg
          retention-days: 7
      - name: Upload QC gate
        uses: actions/upload-artifact@v4
        with:
          name: tcwt-e05-qc-approval
          path: |
            approval-export/qc.json
            approval-export/approval.json
          retention-days: 7

      - name: Stop export pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          set +e
          [[ -n "${POD_ID:-}" ]] || exit 0
          curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null
