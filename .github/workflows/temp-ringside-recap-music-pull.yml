name: TEMP Ringside Recap Music Pull

on:
  push:
    paths:
      - '.github/workflows/temp-ringside-recap-music-pull.yml'

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Download locked Ringside Recap music bed
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --max-time 300             'https://dnznrvs05pmza.cloudfront.net/lyria3-pro/a97bcf92-048f-40c0-afbf-c0c58908d4f7/Ringside_Recap_Arena_Rock_Bed.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjk1MWFjYTA0MTNhMGFkMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk0NDk5Mn0.Z7lqdqtMQ9RFILbiY-mnfmcJSjBzdWNsIToAwjis5Xo'             -o /tmp/Ringside_Recap_Arena_Rock_Bed.mp3
          test -s /tmp/Ringside_Recap_Arena_Rock_Bed.mp3
          ls -lh /tmp/Ringside_Recap_Arena_Rock_Bed.mp3
      - name: Upload locked bed
        uses: actions/upload-artifact@v4
        with:
          name: Ringside-Recap-Locked-Arena-Rock-Bed
          path: /tmp/Ringside_Recap_Arena_Rock_Bed.mp3
          if-no-files-found: error
          retention-days: 7
