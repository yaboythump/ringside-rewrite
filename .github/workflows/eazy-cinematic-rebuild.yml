name: Eazy-E cinematic rebuild QC

on:
  push:
    branches: [main]
    paths:
      - 'hiphop_whatif/eazy_rebuild/**'
      - '.github/workflows/eazy-cinematic-rebuild.yml'
  workflow_dispatch:

concurrency:
  group: eazy-cinematic-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet requests pillow numpy
      - name: Regression tests
        run: |
          python hiphop_whatif/eazy_rebuild/test_qc.py
          python hiphop_whatif/eazy_rebuild/test_publish.py
      - name: Build full-screen cinematic episode
        run: python hiphop_whatif/eazy_rebuild/build_v6.py
      - name: Hard QC
        shell: bash
        run: |
          set -euo pipefail
          python hiphop_whatif/eazy_rebuild/qc.py
      - name: Publish internal visual preview to repo for inspection
        shell: bash
        run: |
          set -euo pipefail
          DEST=published-assets/hiphop-what-if/eazy-cinematic-rebuild
          mkdir -p "$DEST"
          cp hiphop_whatif/eazy_rebuild/output/internal_preview.jpg "$DEST/internal_preview.jpg"
          cp hiphop_whatif/eazy_rebuild/output/thumbnail.jpg "$DEST/thumbnail.jpg"
          git config user.name 'CTNETWORK Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified Eazy-E cinematic rebuild preview'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save complete package artifact
        uses: actions/upload-artifact@v4
        with:
          name: eazy-e-cinematic-rebuild-package
          retention-days: 14
          path: |
            hiphop_whatif/eazy_rebuild/output/full.mp4
            hiphop_whatif/eazy_rebuild/output/short_*.mp4
            hiphop_whatif/eazy_rebuild/output/thumbnail.jpg
            hiphop_whatif/eazy_rebuild/output/internal_preview.jpg
            hiphop_whatif/eazy_rebuild/output/qc-report.json
            hiphop_whatif/eazy_rebuild/output/visual-credits.md
          if-no-files-found: error
