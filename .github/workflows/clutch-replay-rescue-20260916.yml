name: Clutch Replay Rescue 20260916

on:
  push:
    paths:
      - '.github/workflows/clutch-replay-rescue-20260916.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve current factory GPU pod
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.id // empty' infra/status/ctnetwork-factory-gpu.json)
          [[ -n "$POD_ID" ]] || { echo 'current factory pod id missing'; exit 2; }
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"
          POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
          JPASS=$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          echo "current pod=$POD_ID status=$STATUS"
          [[ "$STATUS" == RUNNING ]] || { echo "current pod not running: $STATUS"; exit 3; }
          [[ -n "$JPASS" ]] || { echo 'JUPYTER_PASSWORD missing'; exit 4; }
          echo "::add-mask::$JPASS"
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"

      - name: Pull finished Breaking Cap MP4 directly from persistent volume
        shell: bash
        run: |
          set -euo pipefail
          JPASS=$(cat "$RUNNER_TEMP/jupyter_password")
          for i in $(seq 1 120); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${POD_ID}-8888.proxy.runpod.net/login" || true)
            echo "jupyter attempt=$i http=$code"
            [[ "$code" == 200 ]] && break
            sleep 3
          done
          export POD_ID JPASS
          python3 -m pip install --quiet requests
          python3 - <<'PY'
          import base64, os, re, requests, sys
          pod=os.environ['POD_ID']; password=os.environ['JPASS']
          base=f'https://{pod}-8888.proxy.runpod.net'
          s=requests.Session()
          r=s.get(base+'/login',timeout=30); r.raise_for_status()
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
          if not m: raise RuntimeError('xsrf token missing')
          rr=s.post(base+'/login',data={'_xsrf':m.group(1),'password':password,'next':'/'},timeout=30,allow_redirects=False)
          if rr.status_code not in (200,302,303): raise RuntimeError(f'login failed {rr.status_code}')
          xs=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xs} if xs else {}
          candidates=[
            'workspace/breaking_cap_phx_parody_FINAL.mp4',
            'workspace/ctnetwork/breaking-cap/sports-parodies/2026-09-16-phx-postgame-interview-parody/breaking_cap_phx_parody_FINAL.mp4',
          ]
          last=[]
          for p in candidates:
            q=s.get(base+'/api/contents/'+p,headers=headers,params={'content':'1','format':'base64'},timeout=120)
            last.append((p,q.status_code,q.text[:200]))
            if q.status_code!=200: continue
            j=q.json(); data=j.get('content'); fmt=j.get('format')
            if fmt=='base64' and data:
              b=base64.b64decode(data)
              open('breaking_cap_phx_parody_FINAL.mp4','wb').write(b)
              print('DOWNLOADED',p,len(b))
              if len(b) < 1000000: raise RuntimeError('downloaded video too small')
              sys.exit(0)
          raise RuntimeError('video not found via contents API: '+repr(last))
          PY
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,codec_type,width,height -of json breaking_cap_phx_parody_FINAL.mp4

      - name: Upload rescued Breaking Cap artifact
        uses: actions/upload-artifact@v4
        with:
          name: breaking-cap-phx-parody-final
          path: breaking_cap_phx_parody_FINAL.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Stop current rescue GPU pod
        if: always()
        shell: bash
        run: |
          set +e
          [[ -n "${POD_ID:-}" ]] || exit 0
          echo "STOPPING_POD $POD_ID"
          curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
