name: Delete bad Eazy-E episode uploads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-bad-eazy-episode.yml'
      - 'hiphop_whatif/eazy-delete-trigger.txt'

concurrency:
  group: delete-bad-eazy-episode
  cancel-in-progress: false

jobs:
  delete-bad-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Unpublish bad full episodes through Upload-Post
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UPLOAD_POST_API_KEY:-}" || { echo "::error::UPLOAD_POST_API_KEY secret is missing"; exit 1; }

          unpublish () {
            local platform="$1"
            local post_id="$2"
            local body code
            body=$(jq -n --arg platform "$platform" --arg user "HipHopWhatIf" --arg post_id "$post_id" '{platform:$platform,user:$user,post_id:$post_id}')
            code=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST 'https://api.upload-post.com/api/uploadposts/posts/unpublish' \
              -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
              -H 'Content-Type: application/json' \
              --data "$body")
            echo "$platform $post_id HTTP $code"
            cat response.json || true
            echo

            if [ "$code" = "404" ]; then
              echo "Already absent: $platform $post_id"
              return 0
            fi

            test "$code" -ge 200 && test "$code" -lt 300 || {
              echo "::error::Unpublish failed for $platform $post_id (HTTP $code)"
              exit 1
            }
            jq -e '.success == true' response.json >/dev/null || {
              echo "::error::Upload-Post did not confirm deletion for $platform $post_id"
              exit 1
            }
            echo "Unpublished: $platform $post_id"
          }

          unpublish youtube FgXBwGWJ1dM
          unpublish youtube v8B_-AdJasw
          unpublish facebook 1451015490283579
          unpublish facebook 2241318056648038
