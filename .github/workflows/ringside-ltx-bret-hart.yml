name: Ringside LTX Bret Hart

on:
  push:
    paths:
      - 'ltx-jobs/ringside-bret-hart.json'
      - '.github/workflows/ringside-ltx-bret-hart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      SOURCE_COLLAGE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3FizZ6bh2NS9JMdxemkwXokQMsk/47836f11-bdee-45f3-a830-a9f2053672da.jpg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build uncropped collage-driven start frames
        shell: bash
        run: |
          set -euo pipefail
          JOB='ltx-jobs/ringside-bret-hart.json'
          mkdir -p rendered/inputs rendered/meta
          curl -L --fail --retry 5 --retry-delay 3 "$SOURCE_COLLAGE_URL" -o /tmp/bret_collage.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageFilter, ImageEnhance
          from pathlib import Path
          import json

          src=Image.open('/tmp/bret_collage.jpg').convert('RGB')
          W,H=832,480
          # Wider source boxes deliberately preserve heads, belts, hands, and top-of-frame details.
          boxes={
            '01':(0,540,500,864),
            '02':(0,0,370,330),
            '03':(220,0,650,325),
            '04':(0,175,355,535),
            '05':(235,175,690,525),
            '06':(815,0,1280,355),
            '07':(815,0,1280,355),
            '08':(1145,0,1536,385),
            '09':(860,190,1260,555),
            '10':(1130,220,1536,625),
            '11':(1000,405,1536,750),
            '12':(0,360,500,735),
            '13':(380,0,1160,750),
            '14':(1030,515,1536,864),
          }
          job=json.loads(Path('ltx-jobs/ringside-bret-hart.json').read_text())
          outdir=Path('rendered/inputs')
          for shot in job['shots']:
              sid=shot['id']
              crop=src.crop(boxes[sid])
              # Background fills 16:9, but the actual panel is contained in front. Nothing important is cropped.
              bg=ImageOps.fit(crop,(W,H),method=Image.Resampling.LANCZOS)
              bg=bg.filter(ImageFilter.GaussianBlur(24))
              bg=ImageEnhance.Brightness(bg).enhance(0.42)
              fg=ImageOps.contain(crop,(W-54,H-36),method=Image.Resampling.LANCZOS)
              canvas=bg.copy()
              x=(W-fg.width)//2
              y=(H-fg.height)//2
              canvas.paste(fg,(x,y))
              canvas=ImageEnhance.Contrast(canvas).enhance(1.04)
              canvas.save(outdir/f'bret_scene_{sid}.png',quality=95)
          Path('rendered/meta/source_collage.txt').write_text('Approved collage: '+str(src.size)+'\n')
          PY

      - name: Rent Blackwell, install LTX, image-condition every scene, render, and stop
        shell: bash
        run: |
          set -euo pipefail
          JOB='ltx-jobs/ringside-bret-hart.json'
          mkdir -p rendered/raw rendered/meta
          POD_ID=''

          cleanup() {
            if [[ -n "${POD_ID:-}" ]]; then
              echo "Stopping temporary Ringside render pod: $POD_ID"
              curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" \
                -H "Authorization: Bearer ${RUNPOD_API_KEY}" | jq . || true
            fi
          }
          trap cleanup EXIT

          wget -q https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -O /tmp/runpodctl
          chmod +x /tmp/runpodctl
          sudo install -m 0755 /tmp/runpodctl /usr/local/bin/runpodctl

          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -f "$HOME/.ssh/ringside_bret" -N ''
          PUBKEY=$(cat "$HOME/.ssh/ringside_bret.pub")
          ENV_JSON=$(jq -nc --arg k "$PUBKEY" '{PUBLIC_KEY:$k,SSH_PUBLIC_KEY:$k}')

          runpodctl template search comfyui > /tmp/templates.json
          TPL_ID=$(jq -r '.. | objects | select(((.name? // "") | test("ComfyUI.*CUDA 13";"i"))) | .id // empty' /tmp/templates.json | head -n1)
          [[ -n "$TPL_ID" ]] || { echo 'No CUDA 13 ComfyUI template found'; exit 2; }

          runpodctl pod create \
            --name ringside-bret-hart-ltx-i2v \
            --template-id "$TPL_ID" \
            --gpu-id "NVIDIA RTX PRO 4500 Blackwell" \
            --container-disk-in-gb 160 \
            --ports "8188/http,8080/http,8888/http,22/tcp" \
            --env "$ENV_JSON" \
            --wait --wait-timeout 8m > /tmp/pod.json
          POD_ID=$(jq -r '.id // empty' /tmp/pod.json)
          [[ -n "$POD_ID" ]] || { echo 'No pod ID returned'; exit 3; }
          BASE="https://${POD_ID}-8188.proxy.runpod.net"
          echo "$POD_ID" > rendered/meta/pod_id.txt

          runpodctl ssh info "$POD_ID" > /tmp/ssh.json
          IP=$(jq -r '.ip // empty' /tmp/ssh.json)
          PORT=$(jq -r '.port // empty' /tmp/ssh.json)
          [[ -n "$IP" && -n "$PORT" ]] || { echo 'No SSH endpoint'; exit 4; }
          SSH=(ssh -i "$HOME/.ssh/ringside_bret" -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$IP")
          "${SSH[@]}" 'echo SSH_READY && nvidia-smi --query-gpu=name,memory.total --format=csv,noheader'

          "${SSH[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          COMFY=''
          for D in /workspace/ComfyUI /ComfyUI /opt/ComfyUI /root/ComfyUI; do
            if [[ -d "$D/models" ]]; then COMFY="$D"; break; fi
          done
          if [[ -z "$COMFY" ]]; then
            COMFY=$(find /workspace /opt /root -maxdepth 4 -type d -name ComfyUI 2>/dev/null | head -n1 || true)
          fi
          [[ -n "$COMFY" && -d "$COMFY/models" ]] || { echo 'Could not locate ComfyUI root'; exit 31; }
          mkdir -p "$COMFY/models/checkpoints/LTXV" "$COMFY/models/text_encoders/t5"
          CKPT="$COMFY/models/checkpoints/LTXV/ltx-video-2b-v0.9.5.safetensors"
          T5="$COMFY/models/text_encoders/t5/t5xxl_fp8_e4m3fn_scaled.safetensors"
          curl -L --fail --retry 10 --retry-delay 5 --retry-all-errors --continue-at - -o "$CKPT" 'https://huggingface.co/Lightricks/LTX-Video/resolve/main/ltx-video-2b-v0.9.5.safetensors'
          curl -L --fail --retry 10 --retry-delay 5 --retry-all-errors --continue-at - -o "$T5" 'https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp8_e4m3fn_scaled.safetensors'
          test $(stat -c%s "$CKPT") -gt 1000000000
          test $(stat -c%s "$T5") -gt 1000000000
          sync
          REMOTE

          READY=0
          for N in $(seq 1 80); do
            CODE=$(curl -sS -o /tmp/object.json -w '%{http_code}' --max-time 20 "$BASE/object_info" || true)
            if [[ "$CODE" == "200" ]]; then
              HAS_CKPT=$(jq -r '[.CheckpointLoaderSimple.input.required.ckpt_name[0][] | select(test("ltx-video-2b-v0.9.5"))] | length' /tmp/object.json 2>/dev/null || echo 0)
              HAS_T5=$(jq -r '[.CLIPLoader.input.required.clip_name[0][] | select(test("t5xxl_fp8_e4m3fn_scaled"))] | length' /tmp/object.json 2>/dev/null || echo 0)
              HAS_I2V=$(jq -r 'if .LTXVImgToVideo and .LTXVPreprocess and .LoadImage then 1 else 0 end' /tmp/object.json 2>/dev/null || echo 0)
              if [[ "$HAS_CKPT" -ge 1 && "$HAS_T5" -ge 1 && "$HAS_I2V" -eq 1 ]]; then READY=1; break; fi
            fi
            sleep 3
          done
          [[ "$READY" == "1" ]] || { echo 'LTX image-to-video nodes or model assets missing'; exit 5; }
          cp /tmp/object.json rendered/meta/object_info.json

          NEGATIVE=$(jq -r '.negative_prompt' "$JOB")
          WIDTH=$(jq -r '.width' "$JOB")
          HEIGHT=$(jq -r '.height' "$JOB")
          FRAMES=$(jq -r '.frames' "$JOB")
          FPS=$(jq -r '.fps' "$JOB")
          STEPS=$(jq -r '.steps' "$JOB")
          CFG=$(jq -r '.cfg' "$JOB")
          COUNT=$(jq '.shots | length' "$JOB")
          echo "Rendering $COUNT collage-conditioned Ringside shot(s)"

          for IDX in $(seq 0 $((COUNT-1))); do
            ID=$(jq -r ".shots[$IDX].id" "$JOB")
            PROMPT=$(jq -r ".shots[$IDX].prompt" "$JOB")
            PREFIX=$(jq -r ".shots[$IDX].output_prefix" "$JOB")
            SEED=$(jq -r ".shots[$IDX].seed" "$JOB")
            INPUT=$(printf 'bret_scene_%02d.png' "$((10#$ID))")
            echo "=== Rendering shot $ID / $PREFIX from $INPUT ==="

            curl -fsS -X POST "$BASE/upload/image" \
              -F "image=@rendered/inputs/$INPUT" -F 'type=input' -F 'overwrite=true' > /tmp/upload.json
            UPLOADED=$(jq -r '.name // empty' /tmp/upload.json)
            [[ -n "$UPLOADED" ]] || { cat /tmp/upload.json; exit 18; }

            jq -n --arg prompt "$PROMPT" --arg negative "$NEGATIVE" --arg prefix "$PREFIX" --arg image "$UPLOADED" \
              --argjson seed "$SEED" --argjson width "$WIDTH" --argjson height "$HEIGHT" \
              --argjson frames "$FRAMES" --argjson fps "$FPS" --argjson steps "$STEPS" --argjson cfg "$CFG" \
              '{prompt:{
                "1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"LTXV/ltx-video-2b-v0.9.5.safetensors"}},
                "2":{"class_type":"CLIPLoader","inputs":{"clip_name":"t5/t5xxl_fp8_e4m3fn_scaled.safetensors","type":"ltxv"}},
                "3":{"class_type":"CLIPTextEncode","inputs":{"text":$prompt,"clip":["2",0]}},
                "4":{"class_type":"CLIPTextEncode","inputs":{"text":$negative,"clip":["2",0]}},
                "5":{"class_type":"LTXVConditioning","inputs":{"positive":["3",0],"negative":["4",0],"frame_rate":$fps}},
                "6":{"class_type":"LoadImage","inputs":{"image":$image}},
                "7":{"class_type":"LTXVPreprocess","inputs":{"image":["6",0],"img_compression":28}},
                "8":{"class_type":"LTXVImgToVideo","inputs":{"positive":["5",0],"negative":["5",1],"vae":["1",2],"image":["7",0],"width":$width,"height":$height,"length":$frames,"batch_size":1,"strength":0.88}},
                "9":{"class_type":"LTXVScheduler","inputs":{"steps":$steps,"max_shift":2.05,"base_shift":0.95,"stretch":true,"terminal":0.1,"latent":["8",2]}},
                "10":{"class_type":"KSamplerSelect","inputs":{"sampler_name":"euler"}},
                "11":{"class_type":"SamplerCustom","inputs":{"model":["1",0],"add_noise":true,"noise_seed":$seed,"cfg":$cfg,"positive":["8",0],"negative":["8",1],"sampler":["10",0],"sigmas":["9",0],"latent_image":["8",2]}},
                "12":{"class_type":"VAEDecode","inputs":{"samples":["11",0],"vae":["1",2]}},
                "13":{"class_type":"SaveAnimatedWEBP","inputs":{"images":["12",0],"filename_prefix":$prefix,"fps":$fps,"lossless":false,"quality":90,"method":"default"}}
              }}' > /tmp/request.json

            curl -fsS -X POST "$BASE/prompt" -H 'Content-Type: application/json' --data-binary @/tmp/request.json > /tmp/submit.json
            PROMPT_ID=$(jq -r '.prompt_id // empty' /tmp/submit.json)
            [[ -n "$PROMPT_ID" ]] || { cat /tmp/submit.json; exit 20; }

            RENDERED=0
            for N in $(seq 1 180); do
              curl -sS --max-time 30 "$BASE/history/$PROMPT_ID" > /tmp/history.json || true
              STATUS=$(jq -r --arg id "$PROMPT_ID" '.[$id].status.status_str // empty' /tmp/history.json 2>/dev/null || true)
              COMPLETED=$(jq -r --arg id "$PROMPT_ID" '.[$id].status.completed // false' /tmp/history.json 2>/dev/null || true)
              echo "shot=$ID poll=$N status=${STATUS:-pending} completed=$COMPLETED"
              if [[ "$STATUS" == "error" ]]; then cat /tmp/history.json | jq .; exit 21; fi
              if [[ "$COMPLETED" == "true" ]]; then RENDERED=1; break; fi
              sleep 5
            done
            [[ "$RENDERED" == "1" ]] || { echo "Timed out on shot $ID"; exit 22; }

            FILE=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["13"].images[0].filename // empty' /tmp/history.json)
            SUB=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["13"].images[0].subfolder // ""' /tmp/history.json)
            TYPE=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["13"].images[0].type // "output"' /tmp/history.json)
            [[ -n "$FILE" ]] || { echo "No output for shot $ID"; exit 23; }
            curl -fsS -G "$BASE/view" --data-urlencode "filename=$FILE" --data-urlencode "subfolder=$SUB" --data-urlencode "type=$TYPE" -o "rendered/raw/${PREFIX}.webp"
            cp /tmp/history.json "rendered/meta/${PREFIX}_history.json"
          done

      - name: Convert animations without cropping and create QC frames
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p rendered/mp4 rendered/qc
          python3 - <<'PY'
          from PIL import Image, ImageSequence
          from pathlib import Path
          import numpy as np, json, subprocess
          raw=Path('rendered/raw'); out=Path('rendered/mp4'); qc=Path('rendered/qc'); summaries=[]
          sources=sorted(raw.glob('*.webp'))
          if not sources: raise RuntimeError('No LTX WebP outputs found')
          for src in sources:
              frames=[]; arrs=[]; im=Image.open(src)
              for frame in ImageSequence.Iterator(im):
                  rgb=frame.convert('RGB'); frames.append(rgb.copy()); arrs.append(np.asarray(rgb.resize((192,112))).astype(np.float32))
              if len(frames)<2: raise RuntimeError(f'{src} not animated')
              tmp=qc/(src.stem+'_frames'); tmp.mkdir(exist_ok=True)
              for i,f in enumerate(frames): f.save(tmp/f'frame_{i:04d}.png')
              diffs=[float(np.mean(np.abs(arrs[i]-arrs[i-1]))) for i in range(1,len(arrs))]
              summaries.append({'shot':src.stem,'frames':len(frames),'mean_abs_frame_change':float(np.mean(diffs)),'max_abs_frame_change':max(diffs)})
              # No crop filter. Preserve the entire conditioned composition, then scale to 720p.
              subprocess.run(['ffmpeg','-y','-loglevel','error','-framerate','25','-i',str(tmp/'frame_%04d.png'),'-vf','scale=1280:720:flags=lanczos','-an','-c:v','libx264','-preset','medium','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart',str(out/(src.stem+'.mp4'))],check=True)
              frames[0].save(qc/(src.stem+'_first.png')); frames[len(frames)//2].save(qc/(src.stem+'_middle.png')); frames[-1].save(qc/(src.stem+'_last.png'))
          Path('rendered/qc/motion_metrics.json').write_text(json.dumps(summaries,indent=2))
          print(json.dumps(summaries,indent=2))
          PY

      - name: Upload Ringside Bret Hart LTX package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ringside-bret-hart-ltx-collage-i2v
          path: rendered/
          if-no-files-found: warn
          retention-days: 7
