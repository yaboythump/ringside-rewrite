name: Capsule Duo TestFlight
on:
  push:
    branches: [main, "feature/capsule-duo*"]
    paths:
      - "apps/capsule-duo/**"
      - ".github/workflows/capsule-duo-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload the tested build to App Store Connect
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CD_SOURCE: ${{ github.sha }}
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  CD_TEAM: J4Y8FY6JNZ
  CD_BUNDLE: com.ctnetworkstudios.capsuleduo
  CD_PROJECT: apps/capsule-duo/ios/CapsuleDuo.xcodeproj

concurrency:
  group: ringside-capsule-duo-testflight-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/capsule-duo')
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CD_SOURCE }}
          persist-credentials: false
      - name: Archive the iPhone build without signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CD_SOURCE"
          archive="$RUNNER_TEMP/cd-verify.xcarchive"
          set +e
          xcodebuild -project "$CD_PROJECT" -scheme CapsuleDuo \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/cd-verify" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/cd-build.log" 2>&1
          status=$?
          set -e
          grep -E "error:|warning: .*/CapsuleDuo/|\*\* (ARCHIVE|BUILD)" "$RUNNER_TEMP/cd-build.log" | sort -u | head -80 || true
          test "$status" = 0
          app="$archive/Products/Applications/CapsuleDuo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$CD_BUNDLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print ITSAppUsesNonExemptEncryption' "$app/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist")" = "Dear Tomorrow"
          /usr/libexec/PlistBuddy -c 'Print NSMicrophoneUsageDescription' "$app/Info.plist" | grep -q "future self"
      - name: Verify capsule protection and capture the actual simulator interface
        run: |
          set -euo pipefail
          sc() {
            python3 - "$@" <<'PYSC'
          import subprocess,sys
          try:
              result=subprocess.run(["xcrun","simctl",*sys.argv[1:]],timeout=(8 if sys.argv[1] == "io" else 240 if sys.argv[1] == "bootstatus" else 180 if sys.argv[1] in ("install", "launch") else 45))
              sys.exit(result.returncode)
          except subprocess.TimeoutExpired:
              print("Simulator command timed out: " + " ".join(sys.argv[1:]),file=sys.stderr)
              sys.exit(124)
          PYSC
          }
          mkdir -p "$RUNNER_TEMP/shots"
          ruby -c apps/capsule-duo/ios/verify-testflight.rb
          sc list devices available -j > "$RUNNER_TEMP/devices.json"
          cp "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/shots/devices.json"
          dev="$(sc list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          names=[x for r,l in d.items() if "iOS" in r for x in l]
          duo=[x for x in names if "Duo" in x["name"]]
          pick=(duo or [x for x in names if "Pro" in x["name"]] or names)[0]
          print(pick["udid"], pick["name"], file=sys.stderr)
          print(pick["udid"])')"
          xcodebuild -project "$CD_PROJECT" -scheme CapsuleDuo -configuration Debug \
            -sdk iphonesimulator -destination "id=$dev" -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/sim.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/sim.log" | head -40; exit 1; }
          app="$(find "$RUNNER_TEMP/sim/Build/Products" -name CapsuleDuo.app -maxdepth 2 | head -1)"
          # Create a disposable device rather than reuse stale simulator state.
          spec="$(python3 - "$RUNNER_TEMP/devices.json" "$dev" <<'PYSPEC'
          import json,sys
          for runtime,devices in json.load(open(sys.argv[1]))["devices"].items():
              for device in devices:
                  if device["udid"] == sys.argv[2]:
                      print(device["deviceTypeIdentifier"],runtime)
          PYSPEC
          )"
          read -r device_type runtime <<< "$spec"
          dev="$(sc create "DearTomorrow-QA-$GITHUB_RUN_ID" "$device_type" "$runtime")"
          echo "Cold booting disposable simulator: $dev"
          sc boot "$dev" || true
          sc bootstatus "$dev" -b
          echo "Installing isolated simulator build"
          echo "Fresh simulator has no previous app data"
          sc install "$dev" "$app"
          mkdir -p "$RUNNER_TEMP/shots"
          cp "$RUNNER_TEMP/devices.json" "$RUNNER_TEMP/shots/devices.json"
          bundle=com.ctnetworkstudios.capsuleduo
          run() {
            name="$1"; shift
            sc terminate "$dev" $bundle >/dev/null 2>&1 || true
            data="$(sc get_app_container "$dev" $bundle data)"
            rm -f "$data"/tmp/snapshot-*.png "$data/tmp/layout.txt"
            sc launch "$dev" $bundle -CapsuleSnapshot -dearTomorrowName Thump "$@"
            sleep 12
            sc io "$dev" screenshot "$RUNNER_TEMP/shots/$name-system.png" >/dev/null 2>&1 || true
            if [ "$name" = empty ]; then
              cp "$data/tmp/verification.json" "$RUNNER_TEMP/shots/verification.json"
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d,indent=2)); assert d["passed"], "Capsule protection verification failed"' "$data/tmp/verification.json"
            fi
            cat "$data/tmp/layout.txt" 2>/dev/null || true
            for f in "$data"/tmp/snapshot-*.png; do
              [ -s "$f" ] || continue
              out="$RUNNER_TEMP/shots/$name-$(basename "$f")"
              cp "$f" "$out"
              preview="$RUNNER_TEMP/preview.png"
              sips -Z 900 "$out" --out "$preview" >/dev/null
              echo "BEGIN_PNG $name-$(basename "$f" .png)"; base64 -i "$preview" | tr -d '\n'; echo; echo "END_PNG"
            done
          }
          run empty -CapsuleVerify
          run shelf -CapsuleDemo
          run write -CapsuleWrite -CapsuleWriteSnapshot
          run scheduled -CapsuleDemo -CapsuleScheduled
          run vault -CapsuleDemo -CapsuleVault
          run settings -CapsuleSettings
          run sealed -CapsuleDemo -CapsuleSealedDemo
          run opened -CapsuleDemo -CapsuleOpenedDemo
          run compose -CapsuleDemo -CapsuleCompose
          run spread -CapsuleDemo -CapsuleLandscape -CapsuleFakeFold
          run spread-opened -CapsuleDemo -CapsuleLandscape -CapsuleFakeFold -CapsuleOpenedDemo
          # A second real iPhone size catches narrow-screen overflow and large text regressions.
          other="$(python3 - "$RUNNER_TEMP/devices.json" "$dev" <<'PYDEVICE'
          import json,sys
          devices=json.load(open(sys.argv[1]))["devices"]
          phones=[x for runtime,items in devices.items() if "iOS" in runtime for x in items if "iPhone" in x["name"] and "Duo" not in x["name"] and x["udid"] != sys.argv[2]]
          small=[x for x in phones if "SE" in x["name"] or "mini" in x["name"] or ("Pro" not in x["name"] and "Max" not in x["name"] and "Plus" not in x["name"])]
          print((small or phones)[0]["udid"] if phones else "")
          PYDEVICE
          )"
          if [ -n "$other" ]; then
            spec="$(python3 - "$RUNNER_TEMP/devices.json" "$other" <<'PYOTHER'
          import json,sys
          for runtime,devices in json.load(open(sys.argv[1]))["devices"].items():
              for device in devices:
                  if device["udid"] == sys.argv[2]:
                      print(device["deviceTypeIdentifier"],runtime)
          PYOTHER
          )"
            read -r device_type runtime <<< "$spec"
            dev="$(sc create "DearTomorrow-Second-$GITHUB_RUN_ID" "$device_type" "$runtime")"
            sc boot "$dev" || true
            sc bootstatus "$dev" -b
            sc terminate "$dev" "$bundle" >/dev/null 2>&1 || true
            sc install "$dev" "$app"
            run second-iphone
            sc ui "$dev" content_size accessibility-extra-extra-extra-large
            run accessibility
            sc ui "$dev" content_size large
          fi
          xcrun simctl help 2>&1 | grep -iE "hinge|fold|posture|display|unfold" | head -20 || true
          xcrun simctl io help 2>&1 | grep -iE "hinge|fold|posture|display|unfold" | head -20 || true
          sc spawn "$dev" log show --last 3m --predicate 'process == "CapsuleDuo"' --style compact 2>/dev/null \
            | grep -iE "fault|crash|error" | head -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capsule-duo-simulator-screens
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: error
      - name: Keep build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-duo-build-log
          path: ${{ runner.temp }}/cd-build.log
          retention-days: 14

  upload:
    # Automatically ship verified Capsule Duo changes merged to main.
    # Feature branches only verify; manual dispatch can still opt out of upload.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload))
    needs: [verify]
    environment: ringside-testflight
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CD_SOURCE }}
          persist-credentials: false
      - name: Sign and upload the private beta build
        env:
          ASC_PRIVATE_KEY: ${{ secrets.RCC_ASC_PRIVATE_KEY }}
          DISTRIBUTION_PACKAGE: ${{ secrets.RCC_DISTRIBUTION_PACKAGE }}
          ASC_KEY_ID: ${{ secrets.RCC_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.RCC_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CD_SOURCE"
          for name in ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID DISTRIBUTION_PACKAGE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration for $name in ringside-testflight."
              exit 1
            fi
          done
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ || ! "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f-]+$ ]]; then
            echo "::error::Apple returned an unexpected key or issuer identifier format."
            exit 1
          fi
          umask 077
          signing="$(mktemp -d "$RUNNER_TEMP/cd-signing.XXXXXX")"
          keychain="$signing/distribution.keychain-db"
          installed_profile=""
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            if [[ -n "$installed_profile" ]]; then rm -f -- "$installed_profile"; fi
            rm -rf -- "$signing"
          }
          trap cleanup EXIT
          auth_key="$signing/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key"
          unset ASC_PRIVATE_KEY
          if ! openssl pkey -in "$auth_key" -noout >/dev/null 2>&1; then
            echo "::error::RCC_ASC_PRIVATE_KEY must contain the original Apple .p8 file text."
            exit 1
          fi
          python3 - "$signing" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          value = os.environ["DISTRIBUTION_PACKAGE"].strip()
          try:
              package = json.loads(value)
          except json.JSONDecodeError:
              # A mobile paste may stop after the first field in an earlier package.
              match = re.match(r'\{\s*"certificate"\s*:\s*"([A-Za-z0-9+/=]+)"', value)
              package = {"certificate": match[1] if match else value}
          if not isinstance(package, dict):
              sys.exit("::error::The signing secret must contain the certificate package.")
          try:
              certificate = base64.b64decode(package["certificate"], validate=True)
              if not certificate:
                  raise ValueError("empty certificate")
          except (ValueError, KeyError, TypeError):
              sys.exit(f"::error::The signing secret has no complete certificate ({len(value)} characters received).")
          (output / "distribution.p12").write_bytes(certificate)


          PY
          unset DISTRIBUTION_PACKAGE
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -noout > /dev/null 2>&1 || {
            echo "::error::The signing secret does not contain a complete PKCS#12 file."
            exit 1
          }
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -clcerts -nokeys |
            openssl x509 -outform DER -out "$signing/distribution.der"
          token="$(ruby -ropenssl -rbase64 -rjson - "$auth_key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'RUBY'
          key_path, key_id, issuer = ARGV
          encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
          now = Time.now.to_i
          header = encode.call(JSON.generate(alg: "ES256", kid: key_id, typ: "JWT"))
          claims = encode.call(JSON.generate(iss: issuer, iat: now, exp: now + 300, aud: "appstoreconnect-v1"))
          input = "#{header}.#{claims}"
          key = OpenSSL::PKey.read(File.binread(key_path))
          der = key.sign("SHA256", input)
          raw = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\x00") }.join
          puts "#{input}.#{encode.call(raw)}"
          RUBY
          )"
          echo "::add-mask::$token"
          CD_ASC_TOKEN="$token" python3 - "$signing" <<'PY' 
          import base64
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          directory = Path(sys.argv[1])
          identifier = os.environ["CD_BUNDLE"]
          profile_name = "Capsule Duo App Store"
          headers = {"Authorization": f"Bearer {os.environ['CD_ASC_TOKEN']}",
                     "Content-Type": "application/json"}


          def apple(path, *, filters=None, data=None):
              url = "https://api.appstoreconnect.apple.com/v1/" + path
              if filters:
                  url += "?" + urlencode(filters)
              payload = json.dumps({"data": data}).encode() if data else None
              try:
                  with urlopen(Request(url, data=payload, headers=headers), timeout=30) as response:
                      return json.load(response)["data"]
              except HTTPError as error:
                  method = "POST" if payload else "GET"
                  try:
                      errors = json.load(error).get("errors", [])
                  except Exception:
                      errors = []
                  for issue in errors:
                      print("Apple authorization detail:", issue.get("code", ""), issue.get("title", ""), issue.get("detail", ""), flush=True)
                  sys.exit(f"::error::Apple rejected {method} {path} (HTTP {error.code}).")


          bundle_ids = apple("bundleIds", filters={"filter[identifier]": identifier})
          if bundle_ids:
              bundle = bundle_ids[0]
          else:
              bundle = apple("bundleIds", data={
                  "type": "bundleIds",
                  "attributes": {"identifier": identifier, "name": "Capsule Duo", "platform": "IOS"},
              })
          print(f"Registered app ID is available for {identifier}.", flush=True)

          profiles = apple(f"bundleIds/{bundle['id']}/profiles", filters={"limit": 200})
          matching = [p for p in profiles
                      if p["attributes"]["name"] == profile_name
                      and p["attributes"]["profileState"] == "ACTIVE"
                      and p["attributes"]["profileType"] == "IOS_APP_STORE"]
          if len(matching) > 1:
              sys.exit("::error::Multiple active Capsule Duo App Store profiles have the same name.")
          if matching:
              profile = matching[0]
          else:
              local_certificate = (directory / "distribution.der").read_bytes()
              certificates = apple("certificates", filters={"limit": 200})
              matches = [c for c in certificates
                         if base64.b64decode(c["attributes"].get("certificateContent") or "") == local_certificate]
              if len(matches) != 1:
                  sys.exit("::error::Apple could not match the configured distribution certificate.")
              profile = apple("profiles", data={
                  "type": "profiles",
                  "attributes": {"name": profile_name, "profileType": "IOS_APP_STORE"},
                  "relationships": {
                      "bundleId": {"data": {"type": "bundleIds", "id": bundle["id"]}},
                      "certificates": {"data": [{"type": "certificates", "id": matches[0]["id"]}]},
                  },
              })
          (directory / "ringside.mobileprovision").write_bytes(
              base64.b64decode(profile["attributes"]["profileContent"], validate=True)
          )
          print("Capsule Duo App Store provisioning profile is ready.", flush=True)
          if not apple("apps", filters={"filter[bundleId]": identifier, "fields[apps]": "bundleId"}):
              sys.exit("::error::Apple requires a Capsule Duo app record in App Store Connect before uploading. Ask the Account Holder or App Manager to create one.")
          PY
          unset token
          security cms -D -i "$signing/ringside.mobileprovision" > "$signing/profile.plist"
          profile_id="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$signing/profile.plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$signing/profile.plist")"
          [[ "$profile_id" =~ ^[0-9A-Fa-f-]{36}$ && "$app_id" == "$CD_TEAM.$CD_BUNDLE" ]]
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          installed_profile="$profile_dir/$profile_id.mobileprovision"
          cp "$signing/ringside.mobileprovision" "$installed_profile"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security list-keychains -d user -s "$keychain"
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -nodes -out "$signing/identity.pem"
          openssl rand -hex 24 > "$signing/import-password"
          openssl pkcs12 -export -in "$signing/identity.pem" -out "$signing/apple-import.p12" \
            -passout "file:$signing/import-password" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security import "$signing/apple-import.p12" -f pkcs12 -k "$keychain" \
            -P "$(cat "$signing/import-password")" -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$signing/identity.pem" "$signing/apple-import.p12" "$signing/import-password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          unset keychain_password
          auth=(-authenticationKeyPath "$auth_key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          archive="$RUNNER_TEMP/cd-upload.xcarchive"
          xcodebuild -project "$CD_PROJECT" -scheme CapsuleDuo \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/cd-upload" \
            DEVELOPMENT_TEAM="$CD_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive
          app="$archive/Products/Applications/CapsuleDuo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$CD_BUNDLE"
          codesign --verify --strict "$app"
          export_options="$signing/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate -string "Apple Distribution" "$export_options"
          plutil -insert provisioningProfiles -xml '<dict/>' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$CD_BUNDLE string $profile_id" "$export_options"
          plutil -insert teamID -string "$CD_TEAM" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          xcodebuild -exportArchive -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/cd-testflight-export" -exportOptionsPlist "$export_options" "${auth[@]}"

          ruby apps/capsule-duo/ios/verify-testflight.rb "$auth_key"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capsule-duo-testflight-status
          path: ${{ runner.temp }}/capsule-duo-testflight-status.json
