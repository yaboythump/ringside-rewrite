name: HHWI Memphis Bleek Epic Thumbnail

on:
  push:
    paths:
      - '.github/workflows/hhwi-memphis-bleek-epic-thumbnail.yml'
  workflow_dispatch:

jobs:
  build-attach-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VIDEO_ID: ls_VISFemYs
      PROFILE: HipHopWhatIf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install thumbnail stack
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          python3 -m pip install --quiet pillow requests

      - name: Download approved episode archive anchors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p epic-thumb
          curl -L --fail --retry 5 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Memphis-Bleek-mika.jpg' -o epic-thumb/bleek.jpg
          curl -L --fail --retry 5 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Jay-Z-01-mika.jpg' -o epic-thumb/jay.jpg
          curl -L --fail --retry 5 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Marcy_Houses_Park_Av_rainy_jeh.jpg' -o epic-thumb/marcy.jpg
          curl -L --fail --retry 5 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Brooklyn_Bridge_in_2000_01.jpg' -o epic-thumb/bridge.jpg
          for f in epic-thumb/*.jpg; do test -s "$f"; done

      - name: Build EPIC Hip Hop What If thumbnail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageEnhance, ImageOps
          from pathlib import Path
          import math

          W,H=1280,720
          GOLD=(232,188,64,255)
          GOLD2=(255,220,105,255)
          RED=(178,20,35,255)
          WHITE=(248,248,248,255)
          BLACK=(0,0,0,255)
          fb='/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf'
          fr='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def cover(path,size,center=(0.5,0.5)):
              im=Image.open(path).convert('RGB')
              return ImageOps.fit(im,size,method=Image.Resampling.LANCZOS,centering=center)

          # Brooklyn/Marcy cinematic background blend
          marcy=cover('epic-thumb/marcy.jpg',(W,H),(0.5,0.52))
          bridge=cover('epic-thumb/bridge.jpg',(W,H),(0.5,0.5))
          bg=Image.blend(marcy,bridge,0.38)
          bg=ImageEnhance.Color(bg).enhance(0.48)
          bg=ImageEnhance.Contrast(bg).enhance(1.35)
          bg=ImageEnhance.Brightness(bg).enhance(0.64).convert('RGBA')
          bg=bg.filter(ImageFilter.GaussianBlur(1.4))

          # dramatic gold + red atmospheric glows
          gl=Image.new('RGBA',(W,H),(0,0,0,0)); gd=ImageDraw.Draw(gl)
          for r in range(520,20,-18):
              a=int(75*(1-r/540))
              gd.ellipse((80-r//2,80-r//2,80+r//2,80+r//2),fill=(218,165,45,a))
          for r in range(620,20,-20):
              a=int(65*(1-r/640))
              gd.ellipse((1140-r//2,580-r//2,1140+r//2,580+r//2),fill=(160,0,20,a))
          gl=gl.filter(ImageFilter.GaussianBlur(35))
          base=Image.alpha_composite(bg,gl)

          # Left/right hero portraits using real archive imagery
          bleek=cover('epic-thumb/bleek.jpg',(660,720),(0.43,0.38)).convert('RGBA')
          jay=cover('epic-thumb/jay.jpg',(660,720),(0.55,0.36)).convert('RGBA')
          bleek=ImageEnhance.Contrast(bleek).enhance(1.18)
          jay=ImageEnhance.Contrast(jay).enhance(1.18)

          # fade portrait edges into center/background for poster feel
          def side_mask(left=True):
              m=Image.new('L',(660,720),0); d=ImageDraw.Draw(m)
              for x in range(660):
                  if left:
                      a=255 if x<420 else max(0,int(255*(1-(x-420)/240)))
                  else:
                      a=255 if x>240 else max(0,int(255*(x/240)))
                  d.line((x,0,x,720),fill=a)
              return m.filter(ImageFilter.GaussianBlur(10))

          bleek.putalpha(side_mask(True)); jay.putalpha(side_mask(False))
          base.alpha_composite(bleek,(-10,0))
          base.alpha_composite(jay,(630,0))

          # film-grade overlay: vignette, top/bottom bars, contrast shelf
          fx=Image.new('RGBA',(W,H),(0,0,0,0)); d=ImageDraw.Draw(fx)
          d.rectangle((0,0,W,32),fill=(0,0,0,180))
          d.rectangle((0,655,W,H),fill=(0,0,0,205))
          d.rectangle((0,390,W,H),fill=(0,0,0,70))
          for i in range(120):
              a=int(1.6*i)
              d.rectangle((i,0,W-i,H),outline=(0,0,0,min(a,120)),width=1)
          base=Image.alpha_composite(base,fx)

          # glowing fracture at timeline split
          crack=Image.new('RGBA',(W,H),(0,0,0,0)); c=ImageDraw.Draw(crack)
          pts=[(646,-20),(624,105),(672,190),(638,283),(690,362),(650,455),(704,548),(672,745)]
          c.line(pts,fill=(255,214,80,230),width=8)
          c.line([(x+4,y) for x,y in pts],fill=(169,17,31,215),width=4)
          for x,y in pts[1:-1]:
              c.line((x,y,x-62,y+38),fill=(210,34,44,175),width=4)
              c.line((x,y,x+52,y+50),fill=(255,195,65,150),width=3)
          glow=crack.filter(ImageFilter.GaussianBlur(14))
          base=Image.alpha_composite(base,glow)
          base=Image.alpha_composite(base,crack)

          draw=ImageDraw.Draw(base)
          badge=ImageFont.truetype(fb,34)
          hook1=ImageFont.truetype(fb,74)
          hook2=ImageFont.truetype(fb,88)
          small=ImageFont.truetype(fr,25)

          # premium show badge
          draw.rounded_rectangle((44,38,386,104),radius=14,fill=(0,0,0,190),outline=GOLD,width=3)
          draw.text((64,51),'HIP HOP WHAT IF',font=badge,fill=GOLD2,stroke_width=2,stroke_fill=BLACK)

          # punchy, thumbnail-first hook instead of repeating full title
          draw.text((72,440),'BLEEK WITHOUT',font=hook1,fill=WHITE,stroke_width=7,stroke_fill=BLACK)
          draw.text((70,516),'JAY-Z?',font=hook2,fill=GOLD2,stroke_width=8,stroke_fill=BLACK)
          draw.line((72,615,550,598),fill=RED,width=12)
          draw.text((76,625),'ONE MEETING CHANGED EVERYTHING.',font=small,fill=WHITE,stroke_width=2,stroke_fill=BLACK)

          # tiny CTNETWORK signature, not competing with headline
          draw.text((1085,47),'CTNETWORK',font=ImageFont.truetype(fb,24),fill=WHITE,stroke_width=2,stroke_fill=BLACK)

          out=base.convert('RGB')
          out.save('epic-thumb/memphis_bleek_epic.jpg',quality=93,optimize=True)
          if Path('epic-thumb/memphis_bleek_epic.jpg').stat().st_size>1_900_000:
              out.save('epic-thumb/memphis_bleek_epic.jpg',quality=86,optimize=True)
          PY
          test -s epic-thumb/memphis_bleek_epic.jpg

      - name: Attach epic thumbnail through patched YouTube route
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${UPLOAD_POST_API_KEY:-}" || { echo 'UPLOAD_POST_API_KEY missing'; exit 1; }
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
            -F "user=$PROFILE" \
            -F "video_id=$VIDEO_ID" \
            -F "thumbnail=@epic-thumb/memphis_bleek_epic.jpg;type=image/jpeg" \
            'https://api.upload-post.com/api/uploadposts/youtube/thumbnail' | tee epic-thumb/attach.json
          python3 - <<'PY'
          import json
          p=json.load(open('epic-thumb/attach.json'))
          assert p.get('success') is True, p
          assert p.get('video_id')=='ls_VISFemYs', p
          PY

      - name: Verify YouTube is visibly serving the epic thumbnail
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_youtube_thumbnail.py "$VIDEO_ID" epic-thumb/memphis_bleek_epic.jpg

      - name: Keep epic thumbnail proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: hhwi-memphis-bleek-epic-thumbnail
          path: epic-thumb/
