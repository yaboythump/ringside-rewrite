name: CTNETWORK Production Runner Tar Patch

on:
  push:
    paths:
      - '.github/workflows/ctnetwork-factory-qc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make RunPod payload extraction ownership-safe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ctnetwork_run_production.py')
          s = p.read_text()
          old = "tar -xzf /tmp/ctnetwork-production-payload.tar.gz -C \"$ROOT\""
          new = "tar --no-same-owner -xzf /tmp/ctnetwork-production-payload.tar.gz -C \"$ROOT\""
          if old not in s:
              raise SystemExit('expected unsafe tar extraction command not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -Fq 'tar --no-same-owner -xzf /tmp/ctnetwork-production-payload.tar.gz' tools/ctnetwork_run_production.py
          python3 -m py_compile tools/ctnetwork_run_production.py
          git config user.name ctnetwork-bot
          git config user.email ctnetwork-bot@users.noreply.github.com
          git add tools/ctnetwork_run_production.py
          git commit -m 'CTNETWORK: make RunPod payload extraction ownership-safe'
          git pull --rebase origin main
          git push origin HEAD:main
