name: CTNETWORK Production Runner Newline Patch

on:
  push:
    paths:
      - '.github/workflows/ctnetwork-factory-qc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve remote Python newline escapes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ctnetwork_run_production.py')
          s = p.read_text()
          replacements = [
              ("json.dumps(j,indent=2)+'\\n')", "json.dumps(j,indent=2)+'\\\\n')"),
              ("f'NEEDS_QWEN={{int(needs_qwen)}}\\nNEEDS_LTX={{int(needs_ltx)}}\\nNEEDS_DFR={{int(needs_dfr)}}\\n'", "f'NEEDS_QWEN={{int(needs_qwen)}}\\\\nNEEDS_LTX={{int(needs_ltx)}}\\\\nNEEDS_DFR={{int(needs_dfr)}}\\\\n'"),
              ("json.dumps(summary,indent=2)+'\\n'", "json.dumps(summary,indent=2)+'\\\\n'"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python3 -m py_compile tools/ctnetwork_run_production.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path('tools/ctnetwork_run_production.py').read_text()
          checks = [
              "json.dumps(j,indent=2)+'\\\\n')",
              "NEEDS_QWEN={{int(needs_qwen)}}\\\\nNEEDS_LTX={{int(needs_ltx)}}\\\\nNEEDS_DFR={{int(needs_dfr)}}\\\\n",
              "json.dumps(summary,indent=2)+'\\\\n'",
          ]
          for x in checks:
              assert x in s, x
          print('REMOTE_NEWLINE_ESCAPES_VERIFIED')
          PY
          git config user.name ctnetwork-bot
          git config user.email ctnetwork-bot@users.noreply.github.com
          git add tools/ctnetwork_run_production.py
          git commit -m 'CTNETWORK: preserve remote heredoc newline escapes'
          git pull --rebase origin main
          git push origin HEAD:main
