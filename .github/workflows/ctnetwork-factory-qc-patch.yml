name: CTNETWORK Production Runner Patch

on:
  push:
    paths:
      - '.github/workflows/ctnetwork-factory-qc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Escape embedded User-Agent dictionary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ctnetwork_run_production.py')
          s = p.read_text()
          old = "req=urllib.request.Request(url,headers={'User-Agent':'CTNETWORK-Production/1.0'})"
          new = "req=urllib.request.Request(url,headers={{'User-Agent':'CTNETWORK-Production/1.0'}})"
          if old not in s:
              raise SystemExit('expected unescaped User-Agent dictionary not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -Fq "headers={{'User-Agent':'CTNETWORK-Production/1.0'}}" tools/ctnetwork_run_production.py
          python3 -m py_compile tools/ctnetwork_run_production.py
          git config user.name ctnetwork-bot
          git config user.email ctnetwork-bot@users.noreply.github.com
          git add tools/ctnetwork_run_production.py
          git commit -m 'CTNETWORK: escape production runner embedded dictionary'
          git pull --rebase origin main
          git push origin HEAD:main
