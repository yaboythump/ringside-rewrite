name: CTNETWORK Production Runner Brace Patch

on:
  push:
    paths:
      - '.github/workflows/ctnetwork-factory-qc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Escape remaining remote f-string variable
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/ctnetwork_run_production.py')
          s = p.read_text()
          old = "raise RuntimeError(f'downloaded asset empty: {url}')"
          new = "raise RuntimeError(f'downloaded asset empty: {{url}}')"
          if old not in s:
              raise SystemExit('expected unescaped remote url expression not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -Fq "downloaded asset empty: {{url}}" tools/ctnetwork_run_production.py
          python3 -m py_compile tools/ctnetwork_run_production.py
          git config user.name ctnetwork-bot
          git config user.email ctnetwork-bot@users.noreply.github.com
          git add tools/ctnetwork_run_production.py
          git commit -m 'CTNETWORK: escape remaining remote runner variable'
          git pull --rebase origin main
          git push origin HEAD:main
