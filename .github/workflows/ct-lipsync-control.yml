name: CT LipSync RunPod Control

on:
  push:
    paths:
      - 'ct-lipsync-command.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      POD_NAME: ct-lipsync-musetalk-v1
    steps:
      - uses: actions/checkout@v4

      - name: Validate request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNPOD_API_KEY:-}" ]]; then
            echo 'RUNPOD_API_KEY is missing'
            exit 2
          fi
          ACTION=$(jq -r '.action // "status"' ct-lipsync-command.json | tr '[:upper:]' '[:lower:]')
          case "$ACTION" in deploy|start|stop|status) ;; *) echo "Unsupported action: $ACTION"; exit 3;; esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Resolve existing CT LipSync pod
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED=$(jq -r '.pod_id // empty' ct-lipsync-command.json)
          PODS=$(curl -fsS 'https://rest.runpod.io/v1/pods' -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          if [[ -n "$REQUESTED" ]]; then
            POD_ID="$REQUESTED"
          else
            POD_ID=$(printf '%s' "$PODS" | jq -r --arg name "$POD_NAME" '[.[] | select(.name==$name and .desiredStatus!="TERMINATED")] | sort_by(.lastStartedAt // "") | reverse | .[0].id // empty')
          fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          if [[ -n "$POD_ID" ]]; then
            STATUS=$(printf '%s' "$PODS" | jq -r --arg id "$POD_ID" '.[] | select(.id==$id) | .desiredStatus // "unknown"')
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "Found existing pod $POD_ID ($STATUS)"
          else
            echo 'status=missing' >> "$GITHUB_OUTPUT"
            echo 'No existing CT LipSync pod found.'
          fi

      - name: Deploy fresh MuseTalk pod
        if: steps.req.outputs.action == 'deploy' && steps.resolve.outputs.pod_id == ''
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "${RUNPOD_API_KEY}:ct-lipsync:v1" | sha256sum | awk '{print $1}')
          BOOTSTRAP='python3 -c "import urllib.request; urllib.request.urlretrieve(\"https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/runpod/ct-lipsync-bootstrap.sh\", \"/tmp/ct-lipsync-bootstrap.sh\")" && chmod +x /tmp/ct-lipsync-bootstrap.sh && exec /tmp/ct-lipsync-bootstrap.sh'

          # Ask RunPod what is actually rentable right now instead of guessing.
          QUERY='query { gpuTypes { id displayName memoryInGb secureCloud communityCloud secure: lowestPrice(input: { gpuCount: 1, secureCloud: true }) { stockStatus uninterruptablePrice availableGpuCounts } community: lowestPrice(input: { gpuCount: 1, secureCloud: false }) { stockStatus uninterruptablePrice availableGpuCounts } } }'
          jq -nc --arg q "$QUERY" '{query:$q}' > /tmp/gpu-query.json
          curl -fsS -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H 'content-type: application/json' --data-binary @/tmp/gpu-query.json > /tmp/gpus.json || true

          SAFE_IDS='["NVIDIA RTX A4000","NVIDIA RTX A4500","NVIDIA RTX 4000 Ada Generation","NVIDIA GeForce RTX 4080","NVIDIA GeForce RTX 4080 SUPER","NVIDIA RTX A5000","NVIDIA A5000 Ada","NVIDIA L4","NVIDIA A30","NVIDIA GeForce RTX 3090","NVIDIA GeForce RTX 3090 Ti","NVIDIA GeForce RTX 4090","NVIDIA RTX 5000 Ada Generation","NVIDIA RTX A6000","NVIDIA A40","NVIDIA L40","NVIDIA L40S","NVIDIA RTX 6000 Ada Generation"]'

          if jq -e '.data.gpuTypes | type == "array"' /tmp/gpus.json >/dev/null 2>&1; then
            jq --argjson safe "$SAFE_IDS" '
              [ .data.gpuTypes[]
                | select(.memoryInGb >= 16 and (.id as $id | $safe | index($id)))
                | . as $g
                | [
                    (if ($g.secure.stockStatus // "None") != "None" and (($g.secure.availableGpuCounts // []) | index(1)) != null and (($g.secure.uninterruptablePrice // 99) <= 1.25)
                     then {cloud:"SECURE", gpu:$g.id, display:$g.displayName, memory:$g.memoryInGb, stock:$g.secure.stockStatus, price:$g.secure.uninterruptablePrice} else empty end),
                    (if ($g.community.stockStatus // "None") != "None" and (($g.community.availableGpuCounts // []) | index(1)) != null and (($g.community.uninterruptablePrice // 99) <= 1.25)
                     then {cloud:"COMMUNITY", gpu:$g.id, display:$g.displayName, memory:$g.memoryInGb, stock:$g.community.stockStatus, price:$g.community.uninterruptablePrice} else empty end)
                  ][]
              ]
              | sort_by((if .stock=="High" then 0 elif .stock=="Medium" then 1 else 2 end), .price)
            ' /tmp/gpus.json > /tmp/candidates.json
          else
            echo 'RunPod stock query did not return usable data; using broad fallback candidates.'
            echo '[]' > /tmp/candidates.json
          fi

          echo 'Live CT LipSync GPU candidates:'
          jq '[.[] | {cloud,gpu,display,memory,stock,price}] | .[:20]' /tmp/candidates.json

          # If stock query has no candidate, still try a broad availability list in both clouds.
          if [[ $(jq 'length' /tmp/candidates.json) -eq 0 ]]; then
            jq -n --argjson ids "$SAFE_IDS" '["SECURE","COMMUNITY"] as $clouds | [$clouds[] as $c | $ids[] | {cloud:$c,gpu:.,display:.,memory:16,stock:"unknown",price:0}]' > /tmp/candidates.json
          fi

          create_one() {
            local cloud="$1"
            local gpu="$2"
            jq -n \
              --arg cloud "$cloud" \
              --arg gpu "$gpu" \
              --arg token "$TOKEN" \
              --arg cmd "$BOOTSTRAP" \
              --arg name "$POD_NAME" \
              '{
                name:$name,
                cloudType:$cloud,
                computeType:"GPU",
                gpuCount:1,
                gpuTypeIds:[$gpu],
                gpuTypePriority:"availability",
                imageName:"runpod/pytorch:2.0.1-py3.10-cuda11.8.0-devel-ubuntu22.04",
                interruptible:false,
                locked:false,
                containerDiskInGb:25,
                volumeInGb:30,
                volumeMountPath:"/workspace",
                ports:["8000/http","8888/http"],
                dockerEntrypoint:["/bin/bash","-lc"],
                dockerStartCmd:[$cmd],
                env:{CT_LIPSYNC_TOKEN:$token,PYTHONUNBUFFERED:"1"}
              }' > /tmp/pod-create.json

            HTTP=$(curl -sS -o /tmp/pod-response.json -w '%{http_code}' \
              -X POST 'https://rest.runpod.io/v1/pods' \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/pod-create.json) || HTTP=000
            echo "Attempt cloud=${cloud} gpu=${gpu} HTTP=${HTTP}"
            if [[ "$HTTP" == '201' ]]; then
              return 0
            fi
            jq -r '.error // .message // "unknown create error"' /tmp/pod-response.json 2>/dev/null || true
            return 1
          }

          CREATED=0
          while IFS=$'\t' read -r CLOUD GPU; do
            [[ -n "$CLOUD" && -n "$GPU" ]] || continue
            if create_one "$CLOUD" "$GPU"; then
              CREATED=1
              break
            fi
          done < <(jq -r '.[] | [.cloud,.gpu] | @tsv' /tmp/candidates.json)

          if [[ "$CREATED" -ne 1 ]]; then
            echo 'No suitable RunPod GPU could be rented from the currently available pool.'
            exit 4
          fi

          POD_ID=$(jq -r '.id // empty' /tmp/pod-response.json)
          if [[ -z "$POD_ID" ]]; then
            echo 'RunPod did not return a pod ID.'
            exit 5
          fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Created CT LipSync pod: $POD_ID"
          jq '{id,name,desiredStatus,gpu,costPerHr,adjustedCostPerHr,volumeInGb,containerDiskInGb,ports}' /tmp/pod-response.json

      - name: Start existing pod
        if: (steps.req.outputs.action == 'start' || steps.req.outputs.action == 'deploy') && steps.resolve.outputs.pod_id != '' && steps.resolve.outputs.status != 'RUNNING'
        id: start
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.resolve.outputs.pod_id }}'
          HTTP=$(curl -sS -o /tmp/start.json -w '%{http_code}' -X POST \
            "https://rest.runpod.io/v1/pods/${POD_ID}/start" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}") || HTTP=000
          echo "Start HTTP=$HTTP"
          cat /tmp/start.json 2>/dev/null || true
          if [[ ! "$HTTP" =~ ^2 ]]; then exit 5; fi

      - name: Stop pod
        if: steps.req.outputs.action == 'stop' && steps.resolve.outputs.pod_id != ''
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.resolve.outputs.pod_id }}'
          curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}"
          echo "Stopped $POD_ID"

      - name: Resolve active pod ID
        id: active
        if: steps.req.outputs.action != 'stop'
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.deploy.outputs.pod_id }}'
          if [[ -z "$POD_ID" ]]; then POD_ID='${{ steps.resolve.outputs.pod_id }}'; fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Active pod: ${POD_ID:-none}"

      - name: Wait for CT LipSync API
        if: (steps.req.outputs.action == 'deploy' || steps.req.outputs.action == 'start') && steps.active.outputs.pod_id != ''
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.active.outputs.pod_id }}'
          TOKEN=$(printf '%s' "${RUNPOD_API_KEY}:ct-lipsync:v1" | sha256sum | awk '{print $1}')
          API="https://${POD_ID}-8000.proxy.runpod.net"
          STATUS="https://${POD_ID}-8888.proxy.runpod.net"

          echo "Waiting for CT LipSync on $POD_ID..."
          for i in $(seq 1 70); do
            POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
            STATE=$(echo "$POD" | jq -r '.desiredStatus // "unknown"')
            echo "[$i/70] pod=$STATE"

            if [[ "$STATE" == 'EXITED' || "$STATE" == 'TERMINATED' ]]; then
              echo 'Pod exited before the API became healthy.'
              exit 6
            fi

            PHASE=$(curl -fsS --max-time 5 "$STATUS/phase.txt" 2>/dev/null || true)
            if [[ -n "$PHASE" ]]; then echo "phase=$PHASE"; fi
            if [[ "$PHASE" == 'FAILED' ]]; then
              echo 'Bootstrap reported failure. Last log lines:'
              curl -fsS --max-time 10 "$STATUS/bootstrap.log" 2>/dev/null | tail -n 220 || true
              curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
              exit 7
            fi

            HEALTH=$(curl -sS --max-time 10 -H "Authorization: Bearer ${TOKEN}" "$API/health" 2>/dev/null || true)
            if echo "$HEALTH" | jq -e '.status == "healthy" and .gpu_available == true and .models_loaded == true' >/dev/null 2>&1; then
              echo "$HEALTH" | jq .
              echo 'CT LipSync API is healthy.'
              POD_NOW=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
              {
                echo '## CT LipSync is online'
                echo "- Pod: $POD_ID"
                echo "- API: $API"
                echo "- Status: healthy"
                echo "- GPU: $(echo "$HEALTH" | jq -r '.gpu_name // "unknown"')"
                echo "- VRAM: $(echo "$HEALTH" | jq -r '.gpu_memory_gb // "unknown"') GB"
                echo "- Cost/hr: $(echo "$POD_NOW" | jq -r '.adjustedCostPerHr // .costPerHr // "unknown"')"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done

          echo 'Timed out waiting for CT LipSync. Last bootstrap log lines:'
          curl -fsS --max-time 10 "$STATUS/bootstrap.log" 2>/dev/null | tail -n 260 || true
          curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
          exit 8

      - name: Report status
        if: steps.req.outputs.action == 'status' && steps.active.outputs.pod_id != ''
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.active.outputs.pod_id }}'
          TOKEN=$(printf '%s' "${RUNPOD_API_KEY}:ct-lipsync:v1" | sha256sum | awk '{print $1}')
          POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          echo "$POD" | jq '{id,name,desiredStatus,gpu,costPerHr,adjustedCostPerHr,publicIp,portMappings,volumeInGb,containerDiskInGb,lastStartedAt,lastStatusChange}'
          if [[ $(echo "$POD" | jq -r '.desiredStatus') == 'RUNNING' ]]; then
            curl -fsS --max-time 10 -H "Authorization: Bearer ${TOKEN}" "https://${POD_ID}-8000.proxy.runpod.net/health" | jq . || true
          fi
