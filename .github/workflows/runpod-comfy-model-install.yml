name: RunPod Comfy LTX Model Install

on:
  push:
    paths:
      - '.github/workflows/runpod-comfy-model-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Start queued LTX model installs and verify completion
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"

          echo 'manager_status_before:'
          curl -fsS --max-time 20 "$BASE/manager/queue/status" | jq .

          echo 'start_queue_legacy_get:'
          CODE=$(curl -sS -o /tmp/start.out -w '%{http_code}' --max-time 30 "$BASE/manager/queue/start" || true)
          echo "http=$CODE"
          cat /tmp/start.out || true
          echo
          [[ "$CODE" == "200" || "$CODE" == "201" ]] || exit 3

          for N in $(seq 1 60); do
            STATUS=$(curl -fsS --max-time 20 "$BASE/manager/queue/status")
            echo "poll=$N $(echo "$STATUS" | jq -c .)"
            TOTAL=$(echo "$STATUS" | jq -r '.total_count // 0')
            DONE=$(echo "$STATUS" | jq -r '.done_count // 0')
            PROCESSING=$(echo "$STATUS" | jq -r '.is_processing // false')
            if [[ "$TOTAL" -gt 0 && "$DONE" -ge "$TOTAL" && "$PROCESSING" == "false" ]]; then
              echo 'MODEL_QUEUE_COMPLETE'
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for model queue completion'
          exit 4
