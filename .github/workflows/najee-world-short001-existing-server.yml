name: Najee World Short 001 Existing Server Render

on:
  push:
    paths:
      - 'najee-server-render-command.json'
      - '.github/workflows/najee-world-short001-existing-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: najee-world-short001-render
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "NAJEE_RENDER_STOPPED"
