name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect final LTX sampler and video output nodes
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"
          curl -fsS --max-time 60 "$BASE/object_info" >/tmp/object.json
          echo '=== CORE ==='
          jq '{
            ModelSamplingLTXV: .ModelSamplingLTXV,
            KSampler: .KSampler,
            RandomNoise: .RandomNoise,
            BasicGuider: .BasicGuider,
            BasicScheduler: .BasicScheduler,
            SamplerCustomAdvanced: .SamplerCustomAdvanced
          }' /tmp/object.json
          echo '=== VIDEO-LIKE NODES ==='
          jq '[keys[] | select(test("video|vhs|webm|mp4|animated|combine";"i"))] | sort' /tmp/object.json
