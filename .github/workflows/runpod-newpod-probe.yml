name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ComfyUI GPU and LTX readiness
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"
          echo '=== SYSTEM STATS ==='
          curl -fsS --max-time 30 "$BASE/system_stats" | jq '{system,devices}'
          echo '=== LTX NODES ==='
          curl -fsS --max-time 60 "$BASE/object_info" >/tmp/object.json
          jq '{
            ltx_nodes: ([keys[] | select(test("LTX";"i"))] | sort),
            checkpoint_loader: (.CheckpointLoaderSimple.input.required.ckpt_name[0] // []),
            clip_loader: (.CLIPLoader.input.required.clip_name[0] // [])
          }' /tmp/object.json
