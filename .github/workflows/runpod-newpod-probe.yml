name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe legacy ComfyUI Manager update route methods
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"
          URL="$BASE/manager/queue/update_comfyui"
          for METHOD in OPTIONS GET POST PUT PATCH; do
            echo "=== $METHOD ==="
            if [[ "$METHOD" == "POST" || "$METHOD" == "PUT" || "$METHOD" == "PATCH" ]]; then
              curl -sS -i --max-time 20 -X "$METHOD" "$URL" \
                -H 'Content-Type: application/json' -H "Origin: $BASE" --data '{}' | head -n 30 || true
            else
              curl -sS -i --max-time 20 -X "$METHOD" "$URL" -H "Origin: $BASE" | head -n 30 || true
            fi
            echo
          done
          echo '=== legacy candidates ==='
          for PATH in /manager/update_comfyui /manager/update_comfyui_status /manager/queue/update_all /manager/queue/update-main /manager/queue/update_main; do
            CODE=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 20 "$BASE$PATH" || true)
            echo "$PATH http=$CODE body=$(head -c 200 /tmp/out | tr '\n' ' ')"
          done
