name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current CUDA13 LTX model install status
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='k7j666wk9rzw9e'
          BASE="https://${POD_ID}-8188.proxy.runpod.net"
          echo 'system:'
          curl -fsS --max-time 20 "$BASE/system_stats" | jq '{version:.system.comfyui_version,torch:.system.pytorch_version,device:.devices[0].name}'
          echo 'manager_queue:'
          curl -sS --max-time 20 "$BASE/manager/queue/status" | jq . || true
          echo 'loader_visibility:'
          curl -fsS --max-time 60 "$BASE/object_info" >/tmp/object.json
          jq '{
            checkpoint: (.CheckpointLoaderSimple.input.required.ckpt_name[0] | map(select(test("ltx-video-2b-v0.9.5")))),
            clip: (.CLIPLoader.input.required.clip_name[0] | map(select(test("t5xxl_fp8_e4m3fn_scaled")))),
            ltx_nodes: ([keys[] | select(test("LTX";"i"))] | sort)
          }' /tmp/object.json
