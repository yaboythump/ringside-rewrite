name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact LTX API node schemas
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"
          curl -fsS --max-time 60 "$BASE/object_info" >/tmp/object.json
          jq '{
            CheckpointLoaderSimple: .CheckpointLoaderSimple.input,
            CLIPLoader: .CLIPLoader.input,
            CLIPTextEncode: .CLIPTextEncode.input,
            LTXVConditioning: .LTXVConditioning.input,
            EmptyLTXVLatentVideo: .EmptyLTXVLatentVideo.input,
            LTXVScheduler: .LTXVScheduler.input,
            KSamplerSelect: .KSamplerSelect.input,
            SamplerCustom: .SamplerCustom.input,
            VAEDecode: .VAEDecode.input,
            SaveWEBM: .SaveWEBM.input,
            SaveAnimatedWEBP: .SaveAnimatedWEBP.input
          }' /tmp/object.json
