name: RunPod New LTX Pod Probe

on:
  push:
    paths:
      - '.github/workflows/runpod-newpod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ComfyUI upgrade queue status
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='w5sin5d1mz24km'
          BASE="https://${POD_ID}-3000.proxy.runpod.net"
          echo 'system_stats:'
          curl -sS --max-time 20 "$BASE/system_stats" | jq '{version:.system.comfyui_version,device:.devices[0].name}' || true
          echo 'manager_queue:'
          curl -sS --max-time 20 "$BASE/manager/queue/status" | jq . || true
