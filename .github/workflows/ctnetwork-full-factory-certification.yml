name: CTNETWORK Full Local Factory Certification

on:
  workflow_run:
    workflows:
      - CTNETWORK Migrate Factory To Norway
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctnetwork-full-local-factory-certification
  cancel-in-progress: true

jobs:
  certify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      SOURCE_VIDEO_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3FizZ6bh2NS9JMdxemkwXokQMsk/hf_20260911_215620_6c19d3c4-4e5c-464e-bc57-1c363a6e1812.mp4
      SOURCE_AUDIO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3FizZ6bh2NS9JMdxemkwXokQMsk/2c289697-6d4b-495e-a2a1-52c00fa4a942.mp3

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify migration certificate and resolve Norway pod
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          REPORT="infra/status/ctnetwork-factory-migration-latest.txt"
          test -f "$REPORT" || { echo "MIGRATION_REPORT_MISSING"; exit 2; }
          grep -q '^migration_outcome=success$' "$REPORT" || { echo "MIGRATION_NOT_SUCCESS"; exit 3; }
          grep -q 'CTNETWORK_FACTORY_MIGRATION_PASS' "$REPORT" || { echo "MIGRATION_CHECKSUM_PASS_MISSING"; exit 4; }

          POD_ID=""
          if test -f ctnetwork-full-certification-command.json; then
            POD_ID="$(jq -r '.pod_id // empty' ctnetwork-full-certification-command.json)"
          fi

          if test -z "$POD_ID"; then
            DEST_NAME="$(jq -r '.destination_name' ctnetwork-migrate-factory-command.json)"
            DEST_VOLUME="$(jq -r '.destination_volume_id' ctnetwork-migrate-factory-command.json)"
            PODS="$(curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
            POD_ID="$(printf '%s' "$PODS" | jq -r --arg n "$DEST_NAME" --arg v "$DEST_VOLUME" '[.[] | select(.name == $n and ((.networkVolumeId // .networkVolume.id // "") == $v))] | first | .id // empty')"
          fi

          test -n "$POD_ID" || { echo "POD_ID_MISSING"; exit 5; }
          API="https://rest.runpod.io/v1/pods/${POD_ID}"

          refresh() {
            POD="$(curl -fsS "$API" -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
            STATUS="$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')"
          }

          refresh
          if test "$STATUS" != "RUNNING"; then
            curl -fsS -X POST "${API}/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null
            for i in $(seq 1 120); do
              sleep 5
              refresh
              test "$STATUS" = "RUNNING" && break
            done
          fi
          test "$STATUS" = "RUNNING" || { echo "POD_START_BLOCKED:${STATUS}"; exit 6; }

          code="000"
          for i in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${POD_ID}-8888.proxy.runpod.net/login" || true)"
            echo "jupyter attempt=${i} http=${code}"
            if test "$code" = "200" || test "$code" = "302"; then
              break
            fi
            sleep 5
          done
          if test "$code" != "200" && test "$code" != "302"; then
            echo "JUPYTER_NOT_READY"
            exit 7
          fi

          refresh
          JPASS="$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')"
          test -n "$JPASS" || { echo "JUPYTER_PASSWORD_MISSING"; exit 8; }
          echo "::add-mask::${JPASS}"
          printf '%s' "$JPASS" > "${RUNNER_TEMP}/jupyter_password"
          echo "pod_id=${POD_ID}" >> "$GITHUB_OUTPUT"

      - name: Install certification client
        run: python3 -m pip install --quiet requests websocket-client

      - name: Certify LatentSync demo
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        run: python3 tools/ctnetwork_lipsync_smoke.py | tee /tmp/01-latentsync.txt

      - name: Certify real CTNETWORK face sync
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
          SOURCE_VIDEO_URL: ${{ env.SOURCE_VIDEO_URL }}
          SOURCE_AUDIO_URL: ${{ env.SOURCE_AUDIO_URL }}
        run: python3 tools/ctnetwork_lipsync_realface.py | tee /tmp/02-realface.txt

      - name: Certify Qwen3-TTS narration
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        run: python3 tools/ctnetwork_qwen_smoke.py | tee /tmp/03-qwen.txt

      - name: Certify LTX 2.5 base video
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        run: python3 tools/ctnetwork_ltx25_smoke.py | tee /tmp/04-ltx25.txt

      - name: Certify LTX 2.5 premium DFR
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        run: python3 tools/ctnetwork_ltx25_dfr_smoke.py | tee /tmp/05-ltx25-dfr.txt

      - name: Run complete factory acceptance
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        run: python3 tools/ctnetwork_factory_acceptance.py | tee /tmp/06-acceptance.txt

      - name: Save full certification report
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          {
            echo "CTNETWORK FULL LOCAL FACTORY CERTIFICATION"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "pod_id=${{ steps.resolve.outputs.pod_id }}"
            echo "job_status=${{ job.status }}"
            for f in /tmp/0*.txt; do
              test -f "$f" || continue
              echo
              echo "===== $f ====="
              tail -120 "$f"
            done
          } > infra/status/ctnetwork-full-certification-latest.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-full-certification-latest.txt
          git commit -m 'CTNETWORK: record full local factory certification' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Shut down certified factory compute
        if: success()
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
        shell: bash
        run: |
          curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null
