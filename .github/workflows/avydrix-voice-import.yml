name: AVYDRIX local female voice asset
on:
  push:
    branches:
      - feature/retro-duo-female-whisper-aurora
    paths:
      - .github/workflows/avydrix-voice-import.yml
permissions:
  contents: write

jobs:
  bundle-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/retro-duo-female-whisper-aurora
          persist-credentials: true
      - name: Download generated female tagline recording for offline app use
        run: |
          set -euo pipefail
          target=games/retro-duo/ios/RetroDuo/Resources/AvydrixFemaleTagline.mp3
          curl --proto '=https' --tlsv1.2 -fL --retry 3 --max-time 45 \
            'https://cdn.creativeclaw.co/u/6d1d5f99/audio/7e217956-2d64-4d95-b720-514c8f8c039f.mp3' \
            -o "$target"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          assert 2_000 <= len(data) <= 1_500_000, "Unexpected tagline audio length"
          assert data.startswith(b"ID3") or (data[0] == 0xff and data[1] & 0xe0 == 0xe0), "Not an MP3"
          print(f"Validated original female voice file: {len(data)} bytes")
          PY
          sha256sum "$target"
      - name: Commit voice asset to the feature branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/retro-duo/ios/RetroDuo/Resources/AvydrixFemaleTagline.mp3
          if git diff --cached --quiet; then
            echo "Female voice asset already exists; nothing to commit."
            exit 0
          fi
          git commit -m "asset(avydrix): bundle offline female tagline recording [skip ci]"
          git push origin HEAD:feature/retro-duo-female-whisper-aurora
