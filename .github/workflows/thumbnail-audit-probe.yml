name: CTNETWORK thumbnail audit probe

on:
  push:
    paths:
      - '.github/workflows/thumbnail-audit-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Compare current live thumbnails with YouTube auto-frame candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow requests
          python3 - <<'PY'
          import io, requests
          from PIL import Image, ImageChops, ImageStat
          videos = {
            'johnny_animals':'R-Qy4p5EIrc',
            'hhwi_memphis_bleek':'ls_VISFemYs',
            'true_crime_phone_ping':'XZFadc4MfaU',
            'gta_latest':'_2w-h6e8YqE',
            'bigger_conversations_latest':'UmCqVrKCvIY',
            'ringside_cody':'D6U6h3a9flQ',
            'myspace_full':'AFVt5BaebFY',
            'case_lebron':'42ALSvtFJG8',
          }
          def img(url):
            r=requests.get(url,timeout=20); r.raise_for_status()
            return Image.open(io.BytesIO(r.content)).convert('RGB')
          def mae(a,b):
            b=b.resize(a.size,Image.Resampling.LANCZOS)
            return sum(ImageStat.Stat(ImageChops.difference(a,b)).mean)/3
          def ahash(im):
            p=list(im.convert('L').resize((16,16),Image.Resampling.LANCZOS).getdata()); a=sum(p)/len(p)
            return [1 if x>=a else 0 for x in p]
          def ham(a,b): return sum(x!=y for x,y in zip(a,b))
          for label,vid in videos.items():
            try:
              hq=img(f'https://i.ytimg.com/vi/{vid}/hqdefault.jpg?progress=3')
              hh=ahash(hq); scores=[]
              for n in ('1','2','3'):
                frame=img(f'https://i.ytimg.com/vi/{vid}/{n}.jpg?progress=3')
                scores.append((n,round(mae(hq,frame),2),ham(hh,ahash(frame))))
              best=min(scores,key=lambda x:(x[2],x[1])); auto=best[2] <= 12 and best[1] <= 25
              print(label,vid,'AUTO' if auto else 'CUSTOM','best',best)
            except Exception as e:
              print(label,vid,'ERROR',repr(e))
          PY
