name: CTNETWORK Recover Narrators From Iceland Volume

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ctnetwork-recover-narrators-iceland.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      CTN_VOLUME: xs4k4zrvn4
      CTN_DC: EUR-IS-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create recovery pod on original volume
        id: pod
        shell: bash
        run: |
          set -euo pipefail
          JPASS=$(openssl rand -hex 24)
          echo "::add-mask::$JPASS"
          GPU_TYPES='["NVIDIA L4","NVIDIA RTX 4000 Ada Generation","NVIDIA GeForce RTX 4090","NVIDIA RTX A5000","NVIDIA A40"]'
          BODY=$(jq -nc --arg name "ctn-voice-recovery-is-$(date +%s)" --arg dc "$CTN_DC" --arg vol "$CTN_VOLUME" --arg jp "$JPASS" --argjson gpus "$GPU_TYPES" '{name:$name,imageName:"runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",cloudType:"SECURE",computeType:"GPU",gpuTypeIds:$gpus,gpuTypePriority:"availability",gpuCount:1,dataCenterIds:[$dc],dataCenterPriority:"availability",containerDiskInGb:20,networkVolumeId:$vol,volumeMountPath:"/workspace",ports:["8888/http","22/tcp"],env:{JUPYTER_PASSWORD:$jp}}')
          HTTP=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST https://rest.runpod.io/v1/pods -H "Authorization: Bearer $RUNPOD_API_KEY" -H 'Content-Type: application/json' --data "$BODY" || true)
          echo "create http=$HTTP"
          cat /tmp/create.json
          [[ "$HTTP" =~ ^2 ]] || exit 2
          POD_ID=$(jq -r '.id // empty' /tmp/create.json)
          [[ -n "$POD_ID" ]] || exit 3
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Jupyter
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          for i in $(seq 1 150); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "https://${POD_ID}-8888.proxy.runpod.net/login" || true)
            echo "jupyter attempt=$i http=$code"
            [[ "$code" == "200" ]] && exit 0
            sleep 4
          done
          exit 4

      - name: Find and export narrator audio
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY'
          import base64, json, os, re, sys, time, pathlib
          import requests, websocket
          pid=os.environ['POD_ID']; pw=pathlib.Path(os.environ['JUPYTER_PASSWORD_FILE']).read_text().strip()
          base=f'https://{pid}-8888.proxy.runpod.net'
          s=None; headers=None
          for attempt in range(1,41):
              try:
                  s=requests.Session()
                  r=s.get(base+'/login',timeout=20)
                  if not r.ok:
                      raise RuntimeError(f'login page {r.status_code}')
                  m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
                  if not m:
                      raise RuntimeError('xsrf missing')
                  rr=s.post(base+'/login',data={'_xsrf':m.group(1),'password':pw,'next':'/'},timeout=20,allow_redirects=False)
                  if rr.status_code not in (200,302,303):
                      raise RuntimeError(f'login post {rr.status_code}')
                  xc=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xc} if xc else {}
                  st=s.get(base+'/api/status',headers=headers,timeout=20)
                  if st.status_code == 200:
                      print(f'JUPYTER_API_READY attempt={attempt}', flush=True)
                      break
                  print(f'api status attempt={attempt} http={st.status_code}', flush=True)
              except Exception as e:
                  print(f'auth retry {attempt}: {e!r}', flush=True)
              time.sleep(3)
          else:
              raise SystemExit('Jupyter API did not become ready')
          t=s.post(base+'/api/terminals',headers=headers,json={},timeout=30); t.raise_for_status(); name=t.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pid}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=60)
          shell=r'''set +e
          OUT=/workspace/ctn-voice-recovery-export
          rm -rf "$OUT"; mkdir -p "$OUT/files"
          REPORT="$OUT/report.txt"
          {
            echo "CTNETWORK ORIGINAL VOLUME VOICE RECOVERY"
            echo "UTC=$(date -u +%FT%TZ)"
            echo "VOLUME=xs4k4zrvn4"
            echo
            echo "=== ROOT CONTENTS ==="
            find /workspace -maxdepth 4 -type d 2>/dev/null | sort | head -1200
            echo
            echo "=== VOICE-LIKE AUDIO FILES ==="
            timeout 180 find /workspace -maxdepth 12 \
              \( -path '*/models/*' -o -path '*/envs/*' -o -path '*/node_modules/*' -o -path '*/.cache/*' -o -path '*/ComfyUI/models/*' \) -prune -o \
              -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.flac' \) -print 2>/dev/null \
              | grep -Ei 'F0[1-9]|F10|female|voice|narr|casting|audition|reel|sample|speaker|ref' \
              | sort -u | head -1600 || true
            echo
            echo "=== ALL RECENT AUDIO SEP 17-18 ==="
            timeout 180 find /workspace -maxdepth 12 \
              \( -path '*/models/*' -o -path '*/envs/*' -o -path '*/node_modules/*' -o -path '*/.cache/*' -o -path '*/ComfyUI/models/*' \) -prune -o \
              -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.flac' \) \
              -newermt '2026-09-17 00:00:00 UTC' ! -newermt '2026-09-19 00:00:00 UTC' -print 2>/dev/null \
              | sort -u | head -2000 || true
            echo
            echo "=== TEXT REGISTRY MATCHES ==="
            timeout 180 grep -RInE --exclude-dir=models --exclude-dir=envs --exclude-dir=node_modules --exclude-dir=.cache \
              'F0[1-9]|F10|M0[1-9]|M10|female.?voice|male.?voice|casting.?reel|narrator.?bank' /workspace 2>/dev/null \
              | head -1600 || true
          } | tee "$REPORT"

          CAND=/tmp/candidates.txt
          : > "$CAND"
          timeout 180 find /workspace -maxdepth 12 \
            \( -path '*/models/*' -o -path '*/envs/*' -o -path '*/node_modules/*' -o -path '*/.cache/*' -o -path '*/ComfyUI/models/*' \) -prune -o \
            -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.flac' \) -print 2>/dev/null \
            | grep -Ei 'F0[1-9]|F10|female|voice|narr|casting|audition|reel|sample|speaker|ref' >> "$CAND" || true
          timeout 180 find /workspace -maxdepth 12 \
            \( -path '*/models/*' -o -path '*/envs/*' -o -path '*/node_modules/*' -o -path '*/.cache/*' -o -path '*/ComfyUI/models/*' \) -prune -o \
            -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.flac' \) \
            -newermt '2026-09-17 00:00:00 UTC' ! -newermt '2026-09-19 00:00:00 UTC' -print 2>/dev/null >> "$CAND" || true
          sort -u "$CAND" -o "$CAND"

          i=0
          while IFS= read -r f; do
            [ -s "$f" ] || continue
            i=$((i+1)); [ "$i" -le 180 ] || break
            safe=$(basename "$f" | tr ' /' '__')
            cp -f "$f" "$OUT/files/$(printf '%03d' "$i")_$safe"
          done < "$CAND"
          echo "EXPORTED_AUDIO_FILES=$i" | tee -a "$REPORT"
          tar -C /workspace -czf /workspace/ctn-voice-recovery-export.tar.gz ctn-voice-recovery-export
          echo "__VOICE_RECOVERY_DONE__"
          exit 0
          '''
          enc=base64.b64encode(shell.encode()).decode()
          marker='__RECOVER_RC__'+str(int(time.time()*1000))
          ws.send(json.dumps(['stdin',f"echo {enc} | base64 -d >/tmp/voice-recovery.sh; bash /tmp/voice-recovery.sh; rc=$?; echo {marker}:$rc\n"]))
          buf=''; deadline=time.time()+1200; rc=None
          try:
              while time.time()<deadline:
                  try: msg=ws.recv()
                  except Exception: continue
                  try: data=json.loads(msg)
                  except Exception: continue
                  if isinstance(data,list) and len(data)>=2 and data[0]=='stdout':
                      txt=data[1]; buf+=txt; sys.stdout.write(txt); sys.stdout.flush()
                      mm=re.search(re.escape(marker)+r':(\d+)',buf)
                      if mm:
                          rc=int(mm.group(1)); break
          finally:
              ws.close()
              try:s.delete(base+f'/api/terminals/{name}',headers=headers,timeout=10)
              except Exception:pass
          if rc != 0: raise SystemExit(f'remote rc={rc}')
          for rel, local in [
              ('ctn-voice-recovery-export.tar.gz','/tmp/ctn-voice-recovery-export.tar.gz'),
              ('ctn-voice-recovery-export/report.txt','/tmp/ctn-voice-recovery-report.txt')
          ]:
              got=False
              for url in (base+'/files/'+rel, base+'/files/workspace/'+rel):
                  try:
                      q=s.get(url,headers=headers,timeout=300)
                      if q.ok and len(q.content)>0:
                          pathlib.Path(local).write_bytes(q.content); got=True; break
                  except Exception: pass
              if not got: raise SystemExit('download failed '+rel)
          PY

      - name: Upload recovered voice files
        uses: actions/upload-artifact@v4
        with:
          name: ctnetwork-original-volume-voices
          path: /tmp/ctn-voice-recovery-export.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Save voice recovery report
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          cp /tmp/ctn-voice-recovery-report.txt infra/status/ctnetwork-original-volume-voice-recovery.txt 2>/dev/null || echo report_unavailable > infra/status/ctnetwork-original-volume-voice-recovery.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-original-volume-voice-recovery.txt
          git commit -m 'CTNETWORK: record original volume voice recovery' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Stop recovery pod
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          [[ -n "${POD_ID:-}" ]] || exit 0
          curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer $RUNPOD_API_KEY" >/dev/null || true
