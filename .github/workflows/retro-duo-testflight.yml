name: Retro Duo TestFlight
on:
  push:
    branches: [main, "feature/retro-duo*"]
    paths:
      - "games/retro-duo/**"
      - ".github/workflows/retro-duo-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload the tested build to App Store Connect
        required: true
        type: boolean
        default: true
      ui_tests:
        description: Run optional simulator UI checks (requires a working simulator service)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  RD_SOURCE: ${{ github.sha }}
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  RD_TEAM: J4Y8FY6JNZ
  RD_BUNDLE: com.ctnetworkstudios.retroduo
  RD_PROJECT: games/retro-duo/ios/RetroDuo.xcodeproj

concurrency:
  group: ringside-retro-duo-testflight-${{ github.ref }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/retro-duo')
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 18 Pro Max", "iPhone Duo"]
    runs-on: xcode-27
    env:
      RD_SIMULATOR_NAME: ${{ matrix.device }}
    # Two builds (archive + simulator) each compile BlastEm's ~56 MB generated 68000 core.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RD_SOURCE }}
          persist-credentials: false
      - name: Generate BlastEm's CPU cores (too big to keep in git)
        run: python3 games/retro-duo/tools/generate_blastem.py
      - name: Archive the iPhone build without signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RD_SOURCE"
          archive="$RUNNER_TEMP/rd-verify.xcarchive"
          set +e
          xcodebuild -project "$RD_PROJECT" -scheme RetroDuo \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/rd-verify" \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/rd-build.log" 2>&1
          status=$?
          set -e
          grep -E "error:|\*\* (ARCHIVE|BUILD)" "$RUNNER_TEMP/rd-build.log" | head -60 || true
          test "$status" = 0
          app="$archive/Products/Applications/RetroDuo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$RD_BUNDLE"
          test "$(/usr/libexec/PlistBuddy -c 'Print ITSAppUsesNonExemptEncryption' "$app/Info.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print UIFileSharingEnabled' "$app/Info.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$app/Info.plist")" = "AVYDRIX Play"
          cmp "$app/PrivacyInfo.xcprivacy" games/retro-duo/ios/RetroDuo/PrivacyInfo.xcprivacy
          cmp "$app/cgb_boot.bin" games/retro-duo/ios/RetroDuo/Resources/cgb_boot.bin
          cmp "$app/RetroDuoTestCart.gbc" games/retro-duo/ios/RetroDuo/Resources/RetroDuoTestCart.gbc
          cmp "$app/RetroDuoDSTestCart.nds" games/retro-duo/ios/RetroDuo/Resources/RetroDuoDSTestCart.nds
          cmp "$app/GraveMistakes.nds" games/retro-duo/ios/RetroDuo/Resources/GraveMistakes.nds
          cmp "$app/GraveMistakesPremiumCover.jpg" games/retro-duo/ios/RetroDuo/Resources/GraveMistakesPremiumCover.jpg
          cmp "$app/AvydrixWhisper.mp3" games/retro-duo/ios/RetroDuo/Resources/AvydrixWhisper.mp3
          cmp "$app/AvydrixFemaleTagline.mp3" games/retro-duo/ios/RetroDuo/Resources/AvydrixFemaleTagline.mp3
          grep -qF "GNU GENERAL PUBLIC LICENSE" "$app/melonDS-LICENSE.txt"
          cmp "$app/RetroDuoNESTestCart.nes" games/retro-duo/ios/RetroDuo/Resources/RetroDuoNESTestCart.nes
          grep -qF "GNU GENERAL PUBLIC LICENSE" "$app/Nestopia-LICENSE.txt"
          cmp "$app/RetroDuoGBATestCart.gba" games/retro-duo/ios/RetroDuo/Resources/RetroDuoGBATestCart.gba
          grep -qF "Mozilla Public License" "$app/mGBA-LICENSE.txt"
          cmp "$app/RetroDuoSNESTestCart.sfc" games/retro-duo/ios/RetroDuo/Resources/RetroDuoSNESTestCart.sfc
          grep -qF "bsnes - Super Nintendo emulator" "$app/bsnes-LICENSE.txt"
          grep -qF "GNU GENERAL PUBLIC LICENSE" "$app/bsnes-LICENSE.txt"
          for cart in RetroDuoGenesisTestCart.md RetroDuoMasterSystemTestCart.sms RetroDuoGameGearTestCart.gg; do
            cmp "$app/$cart" "games/retro-duo/ios/RetroDuo/Resources/$cart"
          done
          grep -qF "Michael Pavone" "$app/BlastEm-LICENSE.txt"
          grep -qF "GNU GENERAL PUBLIC LICENSE" "$app/BlastEm-LICENSE.txt"
          grep -qF "Lior Halphon" "$app/SameBoy-LICENSE.txt"
          xcodebuild -help 2>&1 | grep -E 'app-store-connect|authenticationKeyPath' > "$RUNNER_TEMP/rd-xcode-help.txt"
          grep -F 'app-store-connect' "$RUNNER_TEMP/rd-xcode-help.txt" >/dev/null
          grep -F 'authenticationKeyPath' "$RUNNER_TEMP/rd-xcode-help.txt" >/dev/null
      - name: Verify public branding and production icon
        run: python3 games/retro-duo/tests/verify_store_branding.py
      - name: Test TestFlight processing and tester assignment verification
        run: ruby games/retro-duo/tests/test_release_verification.rb
      - name: Verify short taps and simultaneous inputs
        run: |
          cp games/retro-duo/tests/input-main.swift "$RUNNER_TEMP/main.swift"
          swiftc games/retro-duo/ios/RetroDuo/InputState.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/input-tests"
          "$RUNNER_TEMP/input-tests"
      - name: Test native touches, audio engine and portrait / landscape
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ui_tests)
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; devices=[v for k,items in d.items() if "iOS" in k for v in items]; pick=next(v for v in devices if v["name"] == __import__("os").environ["RD_SIMULATOR_NAME"]); print(pick["udid"])')
          xcrun simctl list devices available
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project "$RD_PROJECT" -scheme RetroDuo -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/rd-ui" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build-for-testing \
            > "$RUNNER_TEMP/rd-ui.log" 2>&1 || { tail -100 "$RUNNER_TEMP/rd-ui.log"; exit 1; }
          xcrun simctl install "$device" "$RUNNER_TEMP/rd-ui/Build/Products/Debug-iphonesimulator/RetroDuo.app"
          xcrun simctl launch "$device" com.ctnetworkstudios.retroduo -RetroDuoDemo
          sleep 4
          # The Duo has two displays; simctl refuses an ambiguous screenshot.
          xcrun simctl io "$device" screenshot --display=3 "$RUNNER_TEMP/rd-portrait.png" || \
            xcrun simctl io "$device" screenshot --display=1 "$RUNNER_TEMP/rd-portrait.png"
          xcrun simctl terminate "$device" com.ctnetworkstudios.retroduo
          python3 - "$device" <<'PYTEST'
          import os, subprocess, sys
          command = ["xcodebuild", "-project", os.environ["RD_PROJECT"], "-scheme", "RetroDuo",
                     "-configuration", "Debug", "-destination", "platform=iOS Simulator,id=" + sys.argv[1],
                     "-derivedDataPath", os.environ["RUNNER_TEMP"] + "/rd-ui",
                     "-resultBundlePath", os.environ["RUNNER_TEMP"] + "/rd-ui.xcresult",
                     "-parallel-testing-enabled", "NO", "-test-timeouts-enabled", "YES",
                     "-maximum-test-execution-time-allowance", "300", "test-without-building"]
          if os.environ["RD_SIMULATOR_NAME"] == "iPhone Duo":
              # The Duo primary display does not rotate like a single-screen iPhone.
              # Check its supported library/DS layouts; landscape GBA is checked on Pro Max.
              for test in ["testAppStoreScreenshots", "testCommandCenterRetainsResumeAndSaveActions",
                           "testDSPictureSurvivesRepeatedRotation", "testFoldedLibraryHasPersistentAddGamesButton"]:
                  command.append("-only-testing:RetroDuoUITests/ControlsTests/" + test)
          with open(os.environ["RUNNER_TEMP"] + "/rd-ui.log", "a") as log:
              try:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=1200)
                  status = result.returncode
              except subprocess.TimeoutExpired:
                  print("Simulator test service timed out after 20 minutes.")
                  status = 1
          subprocess.run(["tail", "-100", os.environ["RUNNER_TEMP"] + "/rd-ui.log"])
          subprocess.run(["xcrun", "xcresulttool", "export", "attachments", "--path",
                          os.environ["RUNNER_TEMP"] + "/rd-ui.xcresult", "--output-path",
                          os.environ["RUNNER_TEMP"] + "/rd-ui-attachments"])
          sys.exit(status)
          PYTEST
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/rd-ui.xcresult" --output-path "$RUNNER_TEMP/rd-ui-attachments"
      - name: Keep simulator test evidence
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ui_tests))
        uses: actions/upload-artifact@v4
        with:
          name: retro-duo-ui-results-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/rd-ui.xcresult
            ${{ runner.temp }}/rd-ui.log
            ${{ runner.temp }}/rd-portrait.png
            ${{ runner.temp }}/rd-ui-attachments
          retention-days: 14
      - name: Keep build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-duo-build-log-${{ matrix.device }}
          path: ${{ runner.temp }}/rd-build.log
          retention-days: 14

  core:
    # Builds the same SameBoy + RDCore C code on Linux and plays the test cart headlessly.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/retro-duo')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RD_SOURCE }}
          persist-credentials: false
      - name: Boot the console and check video, controls, sound and saves
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RD_SOURCE"
          CC=clang games/retro-duo/tests/run_core_test.sh "$RUNNER_TEMP/rd-core"
      - name: Boot the DS core and check both screens, buttons, touch, sound and saves
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ games/retro-duo/tests/run_ds_core_test.sh "$RUNNER_TEMP/rd-core"
      - name: Boot the NES core and check the picture, buttons, sound and saves
        run: |
          set -euo pipefail
          CXX=clang++ games/retro-duo/tests/run_nes_core_test.sh "$RUNNER_TEMP/rd-core"
      - name: Boot the GBA core and check the picture, buttons, sound and saves
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ games/retro-duo/tests/run_gba_core_test.sh "$RUNNER_TEMP/rd-core"
      - name: Boot the SNES core and check the picture, buttons, audio and saves
        run: |
          set -euo pipefail
          python3 games/retro-duo/testcart-snes/make_cart.py "$RUNNER_TEMP/snes-check.sfc"
          cmp "$RUNNER_TEMP/snes-check.sfc" games/retro-duo/ios/RetroDuo/Resources/RetroDuoSNESTestCart.sfc
          CC=clang CXX=clang++ games/retro-duo/tests/run_snes_core_test.sh "$RUNNER_TEMP/rd-core"
      - name: Boot the Sega core (Genesis, Master System, Game Gear) and check picture, buttons, audio and saves
        run: |
          set -euo pipefail
          res=games/retro-duo/ios/RetroDuo/Resources
          python3 games/retro-duo/testcart-sega/make_genesis.py "$RUNNER_TEMP/check.md"
          python3 games/retro-duo/testcart-sega/make_sms.py "$RUNNER_TEMP/check.sms"
          python3 games/retro-duo/testcart-sega/make_sms.py --gg "$RUNNER_TEMP/check.gg"
          cmp "$RUNNER_TEMP/check.md" "$res/RetroDuoGenesisTestCart.md"
          cmp "$RUNNER_TEMP/check.sms" "$res/RetroDuoMasterSystemTestCart.sms"
          cmp "$RUNNER_TEMP/check.gg" "$res/RetroDuoGameGearTestCart.gg"
          CC=clang CXX=clang++ games/retro-duo/tests/run_sega_core_test.sh "$RUNNER_TEMP/rd-core"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-duo-core-screens
          path: ${{ runner.temp }}/rd-core/*.ppm
          retention-days: 14

  upload:
    # Automatically ship verified Retro Duo changes merged to main.
    # Feature branches only verify; manual dispatch can still opt out of upload.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload))
    needs: [verify, core]
    environment: ringside-testflight
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RD_SOURCE }}
          persist-credentials: false
      - name: Generate BlastEm's CPU cores (too big to keep in git)
        run: python3 games/retro-duo/tools/generate_blastem.py
      - name: Sign and upload the private beta build
        env:
          ASC_PRIVATE_KEY: ${{ secrets.RCC_ASC_PRIVATE_KEY }}
          DISTRIBUTION_PACKAGE: ${{ secrets.RCC_DISTRIBUTION_PACKAGE }}
          ASC_KEY_ID: ${{ secrets.RCC_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.RCC_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RD_SOURCE"
          for name in ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID DISTRIBUTION_PACKAGE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing configuration for $name in ringside-testflight."
              exit 1
            fi
          done
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ || ! "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f-]+$ ]]; then
            echo "::error::Apple returned an unexpected key or issuer identifier format."
            exit 1
          fi
          umask 077
          signing="$(mktemp -d "$RUNNER_TEMP/rd-signing.XXXXXX")"
          keychain="$signing/distribution.keychain-db"
          installed_profile=""
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            if [[ -n "$installed_profile" ]]; then rm -f -- "$installed_profile"; fi
            rm -rf -- "$signing"
          }
          trap cleanup EXIT
          auth_key="$signing/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key"
          unset ASC_PRIVATE_KEY
          if ! openssl pkey -in "$auth_key" -noout >/dev/null 2>&1; then
            echo "::error::RCC_ASC_PRIVATE_KEY must contain the original Apple .p8 file text."
            exit 1
          fi
          python3 - "$signing" <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          value = os.environ["DISTRIBUTION_PACKAGE"].strip()
          try:
              package = json.loads(value)
          except json.JSONDecodeError:
              # A mobile paste may stop after the first field in an earlier package.
              match = re.match(r'\{\s*"certificate"\s*:\s*"([A-Za-z0-9+/=]+)"', value)
              package = {"certificate": match[1] if match else value}
          if not isinstance(package, dict):
              sys.exit("::error::The signing secret must contain the certificate package.")
          try:
              certificate = base64.b64decode(package["certificate"], validate=True)
              if not certificate:
                  raise ValueError("empty certificate")
          except (ValueError, KeyError, TypeError):
              sys.exit(f"::error::The signing secret has no complete certificate ({len(value)} characters received).")
          (output / "distribution.p12").write_bytes(certificate)


          PY
          unset DISTRIBUTION_PACKAGE
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -noout > /dev/null 2>&1 || {
            echo "::error::The signing secret does not contain a complete PKCS#12 file."
            exit 1
          }
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -clcerts -nokeys |
            openssl x509 -outform DER -out "$signing/distribution.der"
          token="$(ruby -ropenssl -rbase64 -rjson - "$auth_key" "$ASC_KEY_ID" "$ASC_ISSUER_ID" <<'RUBY'
          key_path, key_id, issuer = ARGV
          encode = ->(value) { Base64.urlsafe_encode64(value, padding: false) }
          now = Time.now.to_i
          header = encode.call(JSON.generate(alg: "ES256", kid: key_id, typ: "JWT"))
          claims = encode.call(JSON.generate(iss: issuer, iat: now, exp: now + 300, aud: "appstoreconnect-v1"))
          input = "#{header}.#{claims}"
          key = OpenSSL::PKey.read(File.binread(key_path))
          der = key.sign("SHA256", input)
          raw = OpenSSL::ASN1.decode(der).value.map { |part| part.value.to_s(2).rjust(32, "\x00") }.join
          puts "#{input}.#{encode.call(raw)}"
          RUBY
          )"
          echo "::add-mask::$token"
          RD_ASC_TOKEN="$token" python3 - "$signing" <<'PY' 
          import base64
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          directory = Path(sys.argv[1])
          identifier = os.environ["RD_BUNDLE"]
          profile_name = "Retro Duo App Store"
          headers = {"Authorization": f"Bearer {os.environ['RD_ASC_TOKEN']}",
                     "Content-Type": "application/json"}


          def apple(path, *, filters=None, data=None):
              url = "https://api.appstoreconnect.apple.com/v1/" + path
              if filters:
                  url += "?" + urlencode(filters)
              payload = json.dumps({"data": data}).encode() if data else None
              try:
                  with urlopen(Request(url, data=payload, headers=headers), timeout=30) as response:
                      return json.load(response)["data"]
              except HTTPError as error:
                  method = "POST" if payload else "GET"
                  try:
                      errors = json.load(error).get("errors", [])
                  except Exception:
                      errors = []
                  for issue in errors:
                      print("Apple authorization detail:", issue.get("code", ""), issue.get("title", ""), issue.get("detail", ""), flush=True)
                  sys.exit(f"::error::Apple rejected {method} {path} (HTTP {error.code}).")


          bundle_ids = apple("bundleIds", filters={"filter[identifier]": identifier})
          if bundle_ids:
              bundle = bundle_ids[0]
          else:
              bundle = apple("bundleIds", data={
                  "type": "bundleIds",
                  "attributes": {"identifier": identifier, "name": "Retro Duo", "platform": "IOS"},
              })
          print(f"Registered app ID is available for {identifier}.", flush=True)

          profiles = apple(f"bundleIds/{bundle['id']}/profiles", filters={"limit": 200})
          matching = [p for p in profiles
                      if p["attributes"]["name"] == profile_name
                      and p["attributes"]["profileState"] == "ACTIVE"
                      and p["attributes"]["profileType"] == "IOS_APP_STORE"]
          if len(matching) > 1:
              sys.exit("::error::Multiple active Retro Duo App Store profiles have the same name.")
          if matching:
              profile = matching[0]
          else:
              local_certificate = (directory / "distribution.der").read_bytes()
              certificates = apple("certificates", filters={"limit": 200})
              matches = [c for c in certificates
                         if base64.b64decode(c["attributes"].get("certificateContent") or "") == local_certificate]
              if len(matches) != 1:
                  sys.exit("::error::Apple could not match the configured distribution certificate.")
              profile = apple("profiles", data={
                  "type": "profiles",
                  "attributes": {"name": profile_name, "profileType": "IOS_APP_STORE"},
                  "relationships": {
                      "bundleId": {"data": {"type": "bundleIds", "id": bundle["id"]}},
                      "certificates": {"data": [{"type": "certificates", "id": matches[0]["id"]}]},
                  },
              })
          (directory / "ringside.mobileprovision").write_bytes(
              base64.b64decode(profile["attributes"]["profileContent"], validate=True)
          )
          print("Retro Duo App Store provisioning profile is ready.", flush=True)
          if not apple("apps", filters={"filter[bundleId]": identifier, "fields[apps]": "bundleId"}):
              sys.exit("::error::Apple requires a Retro Duo app record in App Store Connect before uploading. Ask the Account Holder or App Manager to create one.")
          PY
          unset token
          security cms -D -i "$signing/ringside.mobileprovision" > "$signing/profile.plist"
          profile_id="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$signing/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$signing/profile.plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$signing/profile.plist")"
          [[ "$profile_id" =~ ^[0-9A-Fa-f-]{36}$ && "$app_id" == "$RD_TEAM.$RD_BUNDLE" ]]
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          installed_profile="$profile_dir/$profile_id.mobileprovision"
          cp "$signing/ringside.mobileprovision" "$installed_profile"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security list-keychains -d user -s "$keychain"
          openssl pkcs12 -in "$signing/distribution.p12" -passin pass: -nodes -out "$signing/identity.pem"
          openssl rand -hex 24 > "$signing/import-password"
          openssl pkcs12 -export -in "$signing/identity.pem" -out "$signing/apple-import.p12" \
            -passout "file:$signing/import-password" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security import "$signing/apple-import.p12" -f pkcs12 -k "$keychain" \
            -P "$(cat "$signing/import-password")" -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$signing/identity.pem" "$signing/apple-import.p12" "$signing/import-password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          unset keychain_password
          auth=(-authenticationKeyPath "$auth_key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          archive="$RUNNER_TEMP/rd-upload.xcarchive"
          xcodebuild -project "$RD_PROJECT" -scheme RetroDuo \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" -derivedDataPath "$RUNNER_TEMP/rd-upload" \
            DEVELOPMENT_TEAM="$RD_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive
          app="$archive/Products/Applications/RetroDuo.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "$RD_BUNDLE"
          test -s "$app/cgb_boot.bin"
          test -s "$app/RetroDuoTestCart.gbc"
          codesign --verify --strict "$app"
          export_options="$signing/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert signingCertificate -string "Apple Distribution" "$export_options"
          plutil -insert provisioningProfiles -xml '<dict/>' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$RD_BUNDLE string $profile_id" "$export_options"
          plutil -insert teamID -string "$RD_TEAM" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          xcodebuild -exportArchive -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/rd-testflight-export" -exportOptionsPlist "$export_options" "${auth[@]}"

          ruby games/retro-duo/ios/verify-testflight.rb "$auth_key"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retro-duo-testflight-status
          path: ${{ runner.temp }}/retro-duo-testflight-status.json
