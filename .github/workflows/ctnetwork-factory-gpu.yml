name: CTNETWORK Factory GPU

on:
  push:
    paths:
      - 'ctnetwork-factory-gpu-command.json'
      - '.github/workflows/ctnetwork-factory-gpu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Control CTNETWORK factory GPU
        shell: bash
        run: |
          set -euo pipefail
          ACTION=$(jq -r '.action // "provision"' ctnetwork-factory-gpu-command.json | tr '[:upper:]' '[:lower:]')
          NAME=$(jq -r '.name // "ctnetwork-factory-gpu"' ctnetwork-factory-gpu-command.json)
          VOLUME_ID=$(jq -r '.network_volume_id' ctnetwork-factory-gpu-command.json)
          DC=$(jq -r '.data_center_id // "EU-RO-1"' ctnetwork-factory-gpu-command.json)
          IMAGE=$(jq -r '.image_name // "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"' ctnetwork-factory-gpu-command.json)
          GPU_TYPES=$(jq -c '.gpu_types // [(.gpu_type // "NVIDIA GeForce RTX 5090")]' ctnetwork-factory-gpu-command.json)
          mkdir -p infra/status

          case "$ACTION" in provision|start|status|stop|delete|recycle) ;; *) echo "Unsupported action: $ACTION"; exit 2;; esac

          find_factory() {
            curl -fsS https://rest.runpod.io/v1/pods -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              | jq -c --arg n "$NAME" --arg v "$VOLUME_ID" '[.[] | select(.name==$n and ((.networkVolumeId // .networkVolume.id // "") == $v))] | first // empty'
          }

          save_pod() {
            printf '%s' "$1" | jq '{id,name,desiredStatus,imageName,networkVolumeId:(.networkVolumeId // .networkVolume.id),containerDiskInGb,volumeMountPath,ports,publicIp,portMappings,costPerHr,adjustedCostPerHr,machineId,gpu:(.gpu // null),machine:{dataCenterId:(.machine.dataCenterId // null),location:(.machine.location // null),gpuDisplayName:(.machine.gpuDisplayName // null)}}' \
              | tee infra/status/ctnetwork-factory-gpu.json
          }

          delete_pod() {
            local pod_id="$1"
            echo "Deleting disposable factory compute pod $pod_id; network volume $VOLUME_ID is independent and preserved."
            code=$(curl -sS -o /tmp/ctn-delete.txt -w '%{http_code}' -X DELETE "https://rest.runpod.io/v1/pods/${pod_id}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" || true)
            [[ "$code" == "204" || "$code" == "404" ]] || { echo "RunPod delete failed HTTP=$code"; cat /tmp/ctn-delete.txt; return 1; }
            for i in $(seq 1 30); do
              sleep 2
              [[ -z "$(find_factory)" ]] && return 0
            done
            echo 'Deleted pod still appears in list after timeout'; return 1
          }

          EXISTING=$(find_factory)

          if [[ "$ACTION" == "stop" ]]; then
            if [[ -z "$EXISTING" ]]; then
              jq -nc --arg n "$NAME" --arg v "$VOLUME_ID" '{name:$n,networkVolumeId:$v,desiredStatus:"NOT_FOUND"}' | tee infra/status/ctnetwork-factory-gpu.json
              exit 0
            fi
            POD_ID=$(printf '%s' "$EXISTING" | jq -r '.id')
            curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null
            for i in $(seq 1 30); do
              sleep 2
              POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
              STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
              [[ "$STATUS" == "EXITED" || "$STATUS" == "STOPPED" ]] && break
            done
            save_pod "$POD"
            exit 0
          fi

          if [[ "$ACTION" == "status" ]]; then
            if [[ -n "$EXISTING" ]]; then save_pod "$EXISTING"; else jq -nc --arg n "$NAME" --arg v "$VOLUME_ID" '{name:$n,networkVolumeId:$v,desiredStatus:"NOT_FOUND"}' | tee infra/status/ctnetwork-factory-gpu.json; fi
            exit 0
          fi

          if [[ "$ACTION" == "delete" ]]; then
            if [[ -n "$EXISTING" ]]; then delete_pod "$(printf '%s' "$EXISTING" | jq -r '.id')"; fi
            jq -nc --arg n "$NAME" --arg v "$VOLUME_ID" '{name:$n,networkVolumeId:$v,desiredStatus:"DELETED",persistentVolumePreserved:true}' | tee infra/status/ctnetwork-factory-gpu.json
            exit 0
          fi

          if [[ "$ACTION" == "recycle" && -n "$EXISTING" ]]; then
            delete_pod "$(printf '%s' "$EXISTING" | jq -r '.id')"
            EXISTING=""
          fi

          if [[ -n "$EXISTING" ]]; then
            POD_ID=$(printf '%s' "$EXISTING" | jq -r '.id')
            STATUS=$(printf '%s' "$EXISTING" | jq -r '.desiredStatus // "unknown"')
            echo "Reusing factory pod $POD_ID status=$STATUS"
            if [[ "$STATUS" != "RUNNING" ]]; then
              curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
            fi
          else
            JUPYTER_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$JUPYTER_PASSWORD"
            BODY=$(jq -nc \
              --arg name "$NAME" --arg image "$IMAGE" --arg dc "$DC" --arg vol "$VOLUME_ID" --arg jp "$JUPYTER_PASSWORD" --argjson gpus "$GPU_TYPES" \
              '{name:$name,imageName:$image,cloudType:"SECURE",computeType:"GPU",gpuTypeIds:$gpus,gpuTypePriority:"availability",gpuCount:1,dataCenterIds:[$dc],dataCenterPriority:"availability",containerDiskInGb:40,networkVolumeId:$vol,volumeMountPath:"/workspace",ports:["8888/http","22/tcp"],env:{JUPYTER_PASSWORD:$jp}}')
            HTTP=$(curl -sS -o /tmp/ctn-create.json -w '%{http_code}' -X POST https://rest.runpod.io/v1/pods \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" -H 'Content-Type: application/json' --data "$BODY" || true)
            echo "RunPod secure create HTTP=$HTTP gpuTypes=$GPU_TYPES"
            if [[ "$HTTP" =~ ^2 ]]; then
              POD_ID=$(jq -r '.id // empty' /tmp/ctn-create.json)
            else
              jq '{error,message,errors,statusCode}' /tmp/ctn-create.json 2>/dev/null || cat /tmp/ctn-create.json
              sleep 2
              EXISTING=$(find_factory)
              [[ -n "$EXISTING" ]] && POD_ID=$(printf '%s' "$EXISTING" | jq -r '.id') || POD_ID=""
            fi
            if [[ -z "${POD_ID:-}" || "$POD_ID" == "null" ]]; then
              jq -nc --arg n "$NAME" --arg v "$VOLUME_ID" --arg dc "$DC" --argjson g "$GPU_TYPES" '{name:$n,networkVolumeId:$v,dataCenterId:$dc,gpuTypes:$g,desiredStatus:"CREATE_FAILED"}' | tee infra/status/ctnetwork-factory-gpu.json
              exit 3
            fi
          fi

          STATUS=unknown
          for i in $(seq 1 120); do
            POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
            STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
            [[ "$STATUS" == "RUNNING" ]] && break
            [[ "$STATUS" == "EXITED" ]] && break
            sleep 5
          done
          save_pod "$POD"
          [[ "$STATUS" == "RUNNING" ]] || { echo "Factory pod failed to reach RUNNING: $STATUS"; exit 4; }

      - name: Save factory GPU state
        if: always()
        shell: bash
        run: |
          if [[ ! -f infra/status/ctnetwork-factory-gpu.json ]]; then
            echo '{"desiredStatus":"WORKFLOW_FAILED_BEFORE_STATUS"}' > infra/status/ctnetwork-factory-gpu.json
          fi
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-factory-gpu.json
          git commit -m 'CTNETWORK: record factory GPU state' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
