name: Attach Raw 1005 Recap Thumbnail

on:
  push:
    paths:
      - '.github/workflows/attach-raw-1005-recap-thumbnail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Attach approved Raw recap thumbnail
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          THUMB_URL: 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FizZ6bh2NS9JMdxemkwXokQMsk/5a96f07f-2ca1-4e8b-be4e-fd0b5d4b0268.jpg'
        run: |
          set -euo pipefail
          test -n "$UPLOAD_POST_API_KEY"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          body=json.dumps({
              "user":"Ringsiderewrite",
              "video_id":"rwJJ27munhk",
              "thumbnail_url":os.environ["THUMB_URL"],
          }).encode("utf-8")
          req=urllib.request.Request(
              "https://api.upload-post.com/api/uploadposts/youtube/thumbnail",
              data=body,
              headers={
                  "Authorization":"Apikey "+os.environ["UPLOAD_POST_API_KEY"],
                  "Content-Type":"application/json",
                  "Accept":"application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req,timeout=180) as r:
                  raw=r.read().decode("utf-8")
                  print("HTTP",r.status)
                  print(raw[:4000])
                  data=json.loads(raw)
                  if data.get("success") is False:
                      raise SystemExit(2)
          except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              print("HTTP",e.code)
              print(raw[:4000])
              raise
          PY
