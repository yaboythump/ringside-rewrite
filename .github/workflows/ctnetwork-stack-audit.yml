name: CTNETWORK Local Stack Audit

on:
  push:
    paths:
      - 'ctnetwork-stack-audit-command.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve and start LTX pod
        id: pod
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id // empty' ctnetwork-stack-audit-command.json)
          [[ -n "$POD_ID" ]] || { echo 'pod_id missing'; exit 2; }
          POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          STATUS=$(echo "$POD" | jq -r '.desiredStatus // "unknown"')
          if [[ "$STATUS" != "RUNNING" ]]; then
            curl -fsS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
            for i in $(seq 1 60); do
              sleep 5
              POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
              STATUS=$(echo "$POD" | jq -r '.desiredStatus // "unknown"')
              [[ "$STATUS" == "RUNNING" ]] && break
            done
          fi
          [[ "$STATUS" == "RUNNING" ]] || { echo "pod failed to start: $STATUS"; exit 3; }
          JPASS=$(echo "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          [[ -n "$JPASS" ]] || { echo 'JUPYTER_PASSWORD missing'; exit 4; }
          echo "::add-mask::$JPASS"
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Audit machine through Jupyter terminal
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY' | tee /tmp/ctnetwork-audit.txt
          import base64, json, os, re, sys, time
          import requests, websocket
          pod_id=os.environ['POD_ID']; password=open(os.environ['JUPYTER_PASSWORD_FILE']).read().strip()
          base=f'https://{pod_id}-8888.proxy.runpod.net'
          script=r'''set -u
          echo '=== CTNETWORK LOCAL STACK AUDIT ==='
          date -u
          echo '--- GPU ---'; nvidia-smi --query-gpu=name,memory.total,memory.free,driver_version --format=csv,noheader || true
          echo '--- NVIDIA-SMI ---'; nvidia-smi || true
          echo '--- DISK ---'; df -h / /workspace 2>/dev/null || true
          echo '--- MEMORY ---'; free -h || true
          echo '--- OS ---'; cat /etc/os-release 2>/dev/null || true
          echo '--- PYTHON ---'; python3 --version || true; /usr/bin/python --version || true
          echo '--- CUDA ---'; nvcc --version 2>/dev/null || true
          echo '--- COMFY PATHS ---'; ls -ld /ComfyUI /workspace/comfyui /workspace/ComfyUI 2>/dev/null || true
          echo '--- WORKSPACE TOP ---'; du -sh /workspace/* 2>/dev/null | sort -h | tail -n 40 || true
          echo '--- LTX MODELS ---'; find /workspace /ComfyUI -maxdepth 5 -type f \( -iname '*ltx*.safetensors' -o -iname '*ltx*.ckpt' \) -printf '%p %s bytes\n' 2>/dev/null | head -n 100 || true
          echo '--- CONDA/VENVS ---'; command -v conda || true; find /workspace -maxdepth 3 -type d \( -name '.venv' -o -name 'venv' -o -name 'env' \) -print 2>/dev/null | head -n 60 || true
          echo '--- TOOLS ---'; for x in ffmpeg ffprobe git curl uv; do printf '%s: ' "$x"; command -v "$x" || true; done
          echo '--- ACTIVE SERVICES ---'; ps aux | egrep 'ComfyUI|jupyter|uvicorn|gradio|musetalk|latentsync|qwen|chatterbox' | grep -v grep || true
          echo '--- PYTORCH ---'; python3 - <<'PYC'
          try:
            import torch
            print('torch', torch.__version__, 'cuda', torch.version.cuda, 'available', torch.cuda.is_available())
            if torch.cuda.is_available(): print('device', torch.cuda.get_device_name(0), 'cap', torch.cuda.get_device_capability(0))
          except Exception as e: print('torch_error', repr(e))
          PYC
          echo '=== AUDIT COMPLETE ==='
          '''
          payload=base64.b64encode(script.encode()).decode(); cmd=f"echo {payload} | base64 -d >/tmp/ctn_audit.sh && bash /tmp/ctn_audit.sh; rc=$?; echo __REMOTE_DONE__:$rc\n"
          s=requests.Session()
          for attempt in range(40):
            try:
              r=s.get(base+'/login',timeout=15)
              if r.ok: break
            except Exception: pass
            time.sleep(5)
          else: raise SystemExit('Jupyter did not become reachable')
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text); xsrf=m.group(1)
          r=s.post(base+'/login',data={'_xsrf':xsrf,'password':password,'next':'/lab'},timeout=30,allow_redirects=True); r.raise_for_status()
          xc=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xc} if xc else {}
          r=s.post(base+'/api/terminals',headers=headers,json={},timeout=30); r.raise_for_status(); name=r.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pod_id}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=60)
          ws.send(json.dumps(['stdin',cmd])); rc=None; deadline=time.time()+600
          try:
            while time.time()<deadline:
              msg=ws.recv()
              if not msg: continue
              try: data=json.loads(msg)
              except Exception: continue
              if isinstance(data,list) and len(data)>=2 and data[0]=='stdout':
                text=data[1]; sys.stdout.write(text); sys.stdout.flush()
                mm=re.search(r'__REMOTE_DONE__:(\d+)',text)
                if mm: rc=int(mm.group(1)); break
          finally:
            ws.close()
            try: s.delete(base+f'/api/terminals/{name}',headers=headers,timeout=10)
            except Exception: pass
          if rc is None: raise SystemExit('remote audit timed out')
          raise SystemExit(rc)
          PY

      - name: Save audit report in repository
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          cp /tmp/ctnetwork-audit.txt infra/status/ltx-audit.txt 2>/dev/null || echo 'audit did not produce output' > infra/status/ltx-audit.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ltx-audit.txt
          git commit -m 'CTNETWORK: refresh LTX server audit' || exit 0
          git push origin HEAD:main
