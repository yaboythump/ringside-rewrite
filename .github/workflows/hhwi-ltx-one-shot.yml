name: HHWI LTX One Shot

on:
  push:
    paths:
      - 'ltx-jobs/hhwi-one-shot.json'
      - '.github/workflows/hhwi-ltx-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rent current CUDA 13 Blackwell, install LTX, render, and stop
        shell: bash
        run: |
          set -euo pipefail
          JOB='ltx-jobs/hhwi-one-shot.json'
          mkdir -p rendered
          POD_ID=''

          cleanup() {
            if [[ -n "${POD_ID:-}" ]]; then
              echo "Stopping temporary render pod: $POD_ID"
              curl -sS -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/stop" \
                -H "Authorization: Bearer ${RUNPOD_API_KEY}" | jq . || true
            fi
          }
          trap cleanup EXIT

          echo 'Installing current runpodctl...'
          curl -sSL https://cli.runpod.net | sudo bash
          export PATH="$HOME/.local/bin:$HOME/bin:/usr/local/bin:$PATH"
          runpodctl version

          echo 'Discovering current CUDA 13 ComfyUI template...'
          runpodctl template search comfyui > /tmp/templates.json
          TPL_ID=$(jq -r '.. | objects | select(((.name? // "") | test("ComfyUI.*CUDA 13";"i"))) | .id // empty' /tmp/templates.json | head -n1)
          [[ -n "$TPL_ID" ]] || { echo 'No CUDA 13 ComfyUI template found'; exit 2; }
          echo "Selected template: $TPL_ID"

          echo 'Renting RTX PRO 4500 Blackwell...'
          runpodctl pod create \
            --name hhwi-memphis-bleek-shot01 \
            --template-id "$TPL_ID" \
            --gpu-id "NVIDIA RTX PRO 4500 Blackwell" \
            --container-disk-in-gb 160 \
            --ports "8188/http,8080/http,8888/http,22/tcp" \
            > /tmp/pod.json
          cat /tmp/pod.json | jq .
          POD_ID=$(jq -r '.id // empty' /tmp/pod.json)
          [[ -n "$POD_ID" ]] || { echo 'No pod ID returned'; exit 3; }
          BASE="https://${POD_ID}-8188.proxy.runpod.net"
          echo "POD_ID=$POD_ID" >> "$GITHUB_ENV"

          echo 'Waiting for ComfyUI...'
          READY=0
          for N in $(seq 1 120); do
            CODE=$(curl -sS -o /tmp/stats -w '%{http_code}' --max-time 15 "$BASE/system_stats" || true)
            echo "boot_poll=$N http=$CODE"
            if [[ "$CODE" == "200" ]]; then
              READY=1
              cat /tmp/stats | jq '{version:.system.comfyui_version,torch:.system.pytorch_version,device:.devices[0].name}'
              break
            fi
            sleep 5
          done
          [[ "$READY" == "1" ]] || { echo 'ComfyUI did not become ready'; exit 4; }

          ORIGIN="$BASE"
          cat >/tmp/ltx.json <<'JSON'
          {
            "name":"LTX-Video 2B v0.9.5 Checkpoint",
            "type":"checkpoint",
            "base":"LTX-Video",
            "save_path":"checkpoints/LTXV",
            "url":"https://huggingface.co/Lightricks/LTX-Video/resolve/main/ltx-video-2b-v0.9.5.safetensors",
            "filename":"ltx-video-2b-v0.9.5.safetensors",
            "ui_id":"hhwi-ltx-2b-095"
          }
          JSON
          cat >/tmp/t5.json <<'JSON'
          {
            "name":"comfyanonymous/flux_text_encoders - t5xxl (fp8_e4m3fn_scaled)",
            "type":"clip",
            "base":"t5",
            "save_path":"text_encoders/t5",
            "url":"https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp8_e4m3fn_scaled.safetensors",
            "filename":"t5xxl_fp8_e4m3fn_scaled.safetensors",
            "ui_id":"hhwi-t5-fp8-scaled"
          }
          JSON

          echo 'Queueing LTX assets...'
          for F in ltx t5; do
            CODE=$(curl -sS -o "/tmp/${F}.out" -w '%{http_code}' --max-time 30 \
              -X POST "$BASE/manager/queue/install_model" \
              -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
              --data @"/tmp/${F}.json" || true)
            echo "queue_${F} http=$CODE body=$(cat /tmp/${F}.out 2>/dev/null || true)"
            [[ "$CODE" == "200" || "$CODE" == "201" ]] || exit 5
          done

          CODE=$(curl -sS -o /tmp/start.out -w '%{http_code}' --max-time 30 \
            -X POST "$BASE/manager/queue/start" \
            -H 'Content-Type: application/json' -H "Origin: $ORIGIN" --data '{}' || true)
          if [[ "$CODE" != "200" && "$CODE" != "201" ]]; then
            CODE=$(curl -sS -o /tmp/start2.out -w '%{http_code}' --max-time 30 "$BASE/manager/queue/start" -H "Origin: $ORIGIN" || true)
          fi
          [[ "$CODE" == "200" || "$CODE" == "201" ]] || { echo 'Could not start model queue'; exit 6; }

          echo 'Waiting for LTX assets...'
          COMPLETE=0
          for N in $(seq 1 120); do
            STATUS=$(curl -sS --max-time 20 "$BASE/manager/queue/status" || true)
            echo "model_poll=$N $(echo "$STATUS" | jq -c . 2>/dev/null || echo "$STATUS")"
            TOTAL=$(echo "$STATUS" | jq -r '.total_count // 0' 2>/dev/null || echo 0)
            DONE=$(echo "$STATUS" | jq -r '.done_count // 0' 2>/dev/null || echo 0)
            PROCESSING=$(echo "$STATUS" | jq -r '.is_processing // false' 2>/dev/null || echo false)
            if [[ "$TOTAL" -ge 2 && "$DONE" -ge "$TOTAL" && "$PROCESSING" == "false" ]]; then
              COMPLETE=1
              break
            fi
            sleep 10
          done
          [[ "$COMPLETE" == "1" ]] || { echo 'Timed out waiting for models'; exit 7; }

          echo 'Verifying loaders...'
          curl -fsS --max-time 60 "$BASE/object_info" >/tmp/object.json
          HAS_CKPT=$(jq -r '[.CheckpointLoaderSimple.input.required.ckpt_name[0][] | select(test("ltx-video-2b-v0.9.5"))] | length' /tmp/object.json)
          HAS_T5=$(jq -r '[.CLIPLoader.input.required.clip_name[0][] | select(test("t5xxl_fp8_e4m3fn_scaled"))] | length' /tmp/object.json)
          [[ "$HAS_CKPT" -ge 1 && "$HAS_T5" -ge 1 ]] || { echo 'LTX assets missing from loaders'; exit 8; }

          PROMPT=$(jq -r '.prompt' "$JOB")
          NEGATIVE=$(jq -r '.negative_prompt' "$JOB")
          PREFIX=$(jq -r '.output_prefix' "$JOB")
          SEED=$(jq -r '.seed' "$JOB")
          WIDTH=$(jq -r '.width // 768' "$JOB")
          HEIGHT=$(jq -r '.height // 448' "$JOB")
          FRAMES=$(jq -r '.frames // 97' "$JOB")
          FPS=$(jq -r '.fps // 25' "$JOB")
          STEPS=$(jq -r '.steps // 30' "$JOB")
          CFG=$(jq -r '.cfg // 3' "$JOB")

          echo 'Building and submitting Shot 1 graph...'
          jq -n \
            --arg prompt "$PROMPT" \
            --arg negative "$NEGATIVE" \
            --arg prefix "$PREFIX" \
            --argjson seed "$SEED" \
            --argjson width "$WIDTH" \
            --argjson height "$HEIGHT" \
            --argjson frames "$FRAMES" \
            --argjson fps "$FPS" \
            --argjson steps "$STEPS" \
            --argjson cfg "$CFG" \
            '{prompt:{
              "1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"LTXV/ltx-video-2b-v0.9.5.safetensors"}},
              "2":{"class_type":"CLIPLoader","inputs":{"clip_name":"t5/t5xxl_fp8_e4m3fn_scaled.safetensors","type":"ltxv"}},
              "3":{"class_type":"CLIPTextEncode","inputs":{"text":$prompt,"clip":["2",0]}},
              "4":{"class_type":"CLIPTextEncode","inputs":{"text":$negative,"clip":["2",0]}},
              "5":{"class_type":"LTXVConditioning","inputs":{"positive":["3",0],"negative":["4",0],"frame_rate":$fps}},
              "6":{"class_type":"EmptyLTXVLatentVideo","inputs":{"width":$width,"height":$height,"length":$frames,"batch_size":1}},
              "7":{"class_type":"LTXVScheduler","inputs":{"steps":$steps,"max_shift":2.05,"base_shift":0.95,"stretch":true,"terminal":0.1,"latent":["6",0]}},
              "8":{"class_type":"KSamplerSelect","inputs":{"sampler_name":"euler"}},
              "9":{"class_type":"SamplerCustom","inputs":{"model":["1",0],"add_noise":true,"noise_seed":$seed,"cfg":$cfg,"positive":["5",0],"negative":["5",1],"sampler":["8",0],"sigmas":["7",0],"latent_image":["6",0]}},
              "10":{"class_type":"VAEDecode","inputs":{"samples":["9",0],"vae":["1",2]}},
              "11":{"class_type":"SaveAnimatedWEBP","inputs":{"images":["10",0],"filename_prefix":$prefix,"fps":$fps,"lossless":false,"quality":90,"method":"default"}}
            }}' > /tmp/request.json

          curl -sS -X POST "$BASE/prompt" -H 'Content-Type: application/json' --data-binary @/tmp/request.json > /tmp/submit.json
          cat /tmp/submit.json | jq .
          PROMPT_ID=$(jq -r '.prompt_id // empty' /tmp/submit.json)
          [[ -n "$PROMPT_ID" ]] || { echo 'ComfyUI rejected graph'; exit 9; }

          echo 'Rendering Shot 1...'
          RENDERED=0
          for N in $(seq 1 180); do
            curl -sS --max-time 30 "$BASE/history/$PROMPT_ID" > /tmp/history.json || true
            STATUS=$(jq -r --arg id "$PROMPT_ID" '.[$id].status.status_str // empty' /tmp/history.json 2>/dev/null || true)
            COMPLETED=$(jq -r --arg id "$PROMPT_ID" '.[$id].status.completed // false' /tmp/history.json 2>/dev/null || true)
            echo "render_poll=$N status=${STATUS:-pending} completed=$COMPLETED"
            if [[ "$STATUS" == "error" ]]; then
              cat /tmp/history.json | jq .
              exit 10
            fi
            if [[ "$COMPLETED" == "true" ]]; then
              RENDERED=1
              break
            fi
            sleep 10
          done
          [[ "$RENDERED" == "1" ]] || { echo 'Timed out waiting for render'; exit 11; }

          FILE=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["11"].images[0].filename // empty' /tmp/history.json)
          SUB=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["11"].images[0].subfolder // ""' /tmp/history.json)
          TYPE=$(jq -r --arg id "$PROMPT_ID" '.[$id].outputs["11"].images[0].type // "output"' /tmp/history.json)
          [[ -n "$FILE" ]] || { cat /tmp/history.json | jq .; echo 'No WEBP output'; exit 12; }

          curl -fsS -G "$BASE/view" \
            --data-urlencode "filename=$FILE" \
            --data-urlencode "subfolder=$SUB" \
            --data-urlencode "type=$TYPE" \
            -o rendered/source.webp
          cp /tmp/history.json rendered/history.json
          echo "$PROMPT_ID" > rendered/prompt_id.txt
          cp "$JOB" rendered/job.json
          file rendered/source.webp
          ls -lh rendered/source.webp

      - name: Preserve raw LTX render
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhwi-shot01-raw-ltx
          path: |
            rendered/source.webp
            rendered/history.json
            rendered/prompt_id.txt
            rendered/job.json
          if-no-files-found: warn
          retention-days: 7

      - name: Extract animated WebP frames safely and encode MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s rendered/source.webp
          python3 -m pip install --quiet pillow
          mkdir -p rendered/frames
          python3 - <<'PY'
          from PIL import Image, ImageSequence
          from pathlib import Path
          im = Image.open('rendered/source.webp')
          count = 0
          durations = []
          for i, frame in enumerate(ImageSequence.Iterator(im)):
              frame.convert('RGB').save(f'rendered/frames/frame_{i:04d}.png')
              durations.append(frame.info.get('duration', im.info.get('duration', 40)))
              count += 1
          if count < 2:
              raise RuntimeError(f'Expected animated WebP; extracted {count} frame(s)')
          Path('rendered/frame_count.txt').write_text(str(count))
          Path('rendered/frame_durations_ms.txt').write_text('\n'.join(map(str, durations)))
          print(f'frames={count} size={im.size} durations_ms_sample={durations[:8]}')
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          PREFIX=$(jq -r '.output_prefix' ltx-jobs/hhwi-one-shot.json)
          FPS=$(jq -r '.fps // 25' ltx-jobs/hhwi-one-shot.json)
          ffmpeg -y -framerate "$FPS" -i rendered/frames/frame_%04d.png \
            -vf "crop=iw:trunc(iw*9/16/2)*2:0:(ih-oh)/2,scale=1280:720:flags=lanczos" \
            -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart \
            "rendered/${PREFIX}.mp4"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of json "rendered/${PREFIX}.mp4" | tee rendered/ffprobe.json
          cp rendered/frames/frame_0000.png "rendered/${PREFIX}_first_frame.png"

      - name: Upload finished Shot 1
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhwi-memphis-bleek-shot01-final
          path: |
            rendered/HHWI_MB_TEST01_SHOT01.mp4
            rendered/HHWI_MB_TEST01_SHOT01_first_frame.png
            rendered/ffprobe.json
            rendered/frame_count.txt
            rendered/frame_durations_ms.txt
          if-no-files-found: warn
          retention-days: 7
