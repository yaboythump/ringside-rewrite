name: GTA Simone Voice Auditions

on:
  push:
    branches: [main]
    paths:
      - 'gta/simone_audition.py'
      - '.github/workflows/gta-simone-audition.yml'
  workflow_dispatch:

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install --upgrade kokoro-onnx soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download voice model
        run: |
          mkdir -p gta/models gta/auditions
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx -O gta/models/kokoro-v1.0.int8.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin -O gta/models/voices-v1.0.bin
      - name: Generate stronger Simone auditions
        run: python gta/simone_audition.py
      - name: Validate auditions
        run: |
          set -euo pipefail
          for f in gta/auditions/*_MASTERED.mp3; do
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
            ffmpeg -v error -i "$f" -f null -
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gta-simone-stronger-auditions
          path: gta/auditions/*_MASTERED.mp3
          if-no-files-found: error
          retention-days: 7
