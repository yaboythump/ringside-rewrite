name: The Case Against narrator audition

on:
  push:
    branches: [main]
    paths:
      - 'the_case_against/narrator-audition-trigger.txt'
      - 'the_case_against/narrator_sample.py'
      - '.github/workflows/the-case-against-narrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kokoro-onnx soundfile numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download Kokoro model
        run: |
          curl -L --fail --retry 3 -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl -L --fail --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Generate Malik audition
        run: python the_case_against/narrator_sample.py
      - name: Master audition
        run: |
          IN='published-assets/the-case-against/narrator-audition/malik_am_onyx_raw.wav'
          OUT='published-assets/the-case-against/narrator-audition/malik_am_onyx_mastered.mp3'
          ffmpeg -y -i "$IN" -af "highpass=f=70,equalizer=f=3200:t=q:w=1:g=2,acompressor=threshold=-18dB:ratio=2.5:attack=12:release=120,loudnorm=I=-16:TP=-1.5:LRA=8,alimiter=limit=0.94" -b:a 192k "$OUT"
      - name: Commit audition audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published-assets/the-case-against/narrator-audition/
          git commit -m 'Publish Malik narrator audition' || exit 0
          git pull --rebase origin main
          git push origin main
