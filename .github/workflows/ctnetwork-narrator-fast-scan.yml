name: CTNETWORK Narrator Fast Scan

on:
  push:
    paths:
      - 'ctnetwork-narrator-fast-command.json'
      - '.github/workflows/ctnetwork-narrator-fast-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve and start narrator pod
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id' ctnetwork-narrator-fast-command.json)
          API="https://rest.runpod.io/v1/pods/${POD_ID}"
          POD=$(curl -fsS "$API" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
          if [[ "$STATUS" != "RUNNING" ]]; then
            curl -fsS -X POST "$API/start" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
            for i in $(seq 1 90); do
              sleep 4
              POD=$(curl -fsS "$API" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
              STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
              [[ "$STATUS" == "RUNNING" ]] && break
            done
          fi
          [[ "$STATUS" == "RUNNING" ]] || { echo "Pod failed to start: $STATUS"; exit 2; }
          JPASS=$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          [[ -n "$JPASS" ]] || { echo "JUPYTER_PASSWORD missing"; exit 3; }
          echo "::add-mask::$JPASS"
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Fast narrator scan
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY' | tee /tmp/ctnetwork-narrator-fast.txt
          import base64, json, os, re, sys, time
          import requests, websocket
          pid=os.environ['POD_ID']; pw=open(os.environ['JUPYTER_PASSWORD_FILE']).read().strip()
          base=f'https://{pid}-8888.proxy.runpod.net'; s=requests.Session()
          for _ in range(70):
              try:
                  r=s.get(base+'/login',timeout=12)
                  if r.ok: break
              except Exception: pass
              time.sleep(3)
          else: raise SystemExit('Jupyter not reachable')
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
          if not m: raise SystemExit('No XSRF')
          rr=s.post(base+'/login',data={'_xsrf':m.group(1),'password':pw,'next':'/'},timeout=20,allow_redirects=False)
          if rr.status_code not in (200,302,303): rr.raise_for_status()
          xc=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xc} if xc else {}
          s.get(base+'/api/status',headers=headers,timeout=20).raise_for_status()
          t=s.post(base+'/api/terminals',headers=headers,json={},timeout=20); t.raise_for_status(); name=t.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pid}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=45)
          script=r'''set +e
          echo "=== TOP DIRS ==="
          find /workspace -maxdepth 3 -type d 2>/dev/null | grep -Ev '/models($|/)|/envs($|/)|/node_modules($|/)' | sort | head -500
          echo "=== LIKELY NARRATOR FILES ==="
          for root in /workspace/ctnetwork-local /workspace/ctnetwork-production /workspace/voices /workspace/narrators; do
            [ -e "$root" ] || continue
            find "$root" -maxdepth 6 \
              \( -path '*/models' -o -path '*/envs' -o -path '*/node_modules' -o -path '*/.cache' \) -prune -o \
              -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' -o -iname '*.json' -o -iname '*.txt' \) -print 2>/dev/null
          done | grep -Ei 'voice|narr|speaker|audition|sample|ref|female|male|/f[0-9]{1,2}|/m[0-9]{1,2}|f0[0-9]|m0[0-9]' | sort -u | head -800
          echo "=== ROOT-LEVEL AUDIO ==="
          find /workspace -maxdepth 4 -type f \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' -o -iname '*.m4a' \) 2>/dev/null \
            | grep -Ei 'voice|narr|speaker|audition|sample|ref|female|male|f0?[0-9]|m0?[0-9]' | sort -u | head -400
          echo "__CTN_FAST_SCAN_DONE__"
          '''
          enc=base64.b64encode(script.encode()).decode()
          marker='__FAST_DONE__'+str(int(time.time()*1000))
          ws.send(json.dumps(['stdin',f"echo {enc} | base64 -d >/tmp/fast.sh; bash /tmp/fast.sh; rc=$?; echo {marker}:$rc\n"]))
          buf=''; deadline=time.time()+360
          try:
              while time.time()<deadline:
                  try: msg=ws.recv()
                  except Exception: continue
                  try: data=json.loads(msg)
                  except Exception: continue
                  if isinstance(data,list) and len(data)>=2 and data[0]=='stdout':
                      txt=data[1]; buf+=txt; sys.stdout.write(txt); sys.stdout.flush()
                      if marker in buf: break
          finally:
              ws.close()
              try:s.delete(base+f'/api/terminals/{name}',headers=headers,timeout=10)
              except Exception:pass
          PY

      - name: Save fast scan report
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          cp /tmp/ctnetwork-narrator-fast.txt infra/status/ctnetwork-narrator-fast-latest.txt 2>/dev/null || echo fast_scan_failed > infra/status/ctnetwork-narrator-fast-latest.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-narrator-fast-latest.txt
          git commit -m 'CTNETWORK: record fast narrator scan' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
