name: CTNETWORK Higgsfield Secret Check

on:
  push:
    paths:
      - 'ctnetwork-higgsfield-secret-check-command.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_KEY: ${{ secrets.HF_KEY }}
      HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
      HIGGSFIELD_KEY: ${{ secrets.HIGGSFIELD_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      HF_API_SECRET: ${{ secrets.HF_API_SECRET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          check(){ if [[ -n "${!1:-}" ]]; then echo "$1=present"; else echo "$1=missing"; fi; }
          check HF_KEY
          check HIGGSFIELD_API_KEY
          check HIGGSFIELD_KEY
          check HF_API_KEY
          check HF_API_SECRET
