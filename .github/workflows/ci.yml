name: RINGSIDE REWRITE code safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e .
      - run: python -m compileall -q src scripts
      - run: python -m unittest discover -s tests

      - name: Verify Facebook publishing configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$UPLOAD_POST_API_KEY" ]]; then
            echo "::error::UPLOAD_POST_API_KEY is missing from GitHub Actions secrets."
            exit 1
          fi
          bash -n scripts/publish_facebook.sh
          grep -Fq 'PROFILE="${UPLOAD_POST_PROFILE:-YouTube}"' scripts/publish_facebook.sh
          grep -Fq 'PAGE_ID="${RINGSIDE_FACEBOOK_PAGE_ID:-363068784190156}"' scripts/publish_facebook.sh
          if ! curl --silent --show-error --fail-with-body \
            -H "Authorization: Apikey $UPLOAD_POST_API_KEY" \
            https://api.upload-post.com/api/uploadposts/me >/dev/null; then
            echo "::error::UPLOAD_POST_API_KEY is invalid or expired. Generate a fresh Upload-Post API key and replace this GitHub Actions secret."
            exit 1
          fi
          echo "Facebook automation credentials validated successfully."

# credential recheck trigger
