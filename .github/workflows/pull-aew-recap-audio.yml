name: Pull AEW Recap Narration Only

on:
  push:
    paths:
      - 'pull-aew-recap-audio-command.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Pull narration WAV and immediately stop GPU pod
        run: python tools/ringside_recap_aew_0916_pull_audio.py
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: ringside-recap-aew-0916-narration-wav
          path: aew0916-audio-pull/narration.wav
          retention-days: 7
          if-no-files-found: error
