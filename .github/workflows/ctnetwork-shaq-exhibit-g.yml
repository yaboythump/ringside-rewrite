name: CTNETWORK Shaq Exhibit G M01

on:
  push:
    paths:
      - 'production/case-against/shaq-2026-09-19/exhibit-g-script.txt'
      - '.github/workflows/ctnetwork-shaq-exhibit-g.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      CTN_VOLUME: 9wjb3sa5zm
      CTN_DC: EU-RO-1
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary narration compute
        id: pod
        shell: bash
        run: |
          set -Eeuo pipefail
          REF_TEXT=$(cat production/case-against/shaq-2026-09-19/M01-reference-transcript.txt)
          START_CMD=$(cat <<'BASH'
          set -Eeuo pipefail
          ROOT=/workspace/ctnetwork-local
          OUT=/workspace/shaq-exhibit-g
          mkdir -p "$OUT"
          cd /workspace
          python3 -m http.server 8000 --bind 0.0.0.0 >/tmp/exhibit-g-http.log 2>&1 &
          HPID=$!
          {
            curl -L --fail --retry 5 "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/production/narrators/M01_reference.wav" -o "$OUT/M01_reference.wav"
            curl -L --fail --retry 5 "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/production/case-against/shaq-2026-09-19/M01-reference-transcript.txt" -o "$OUT/M01-reference-transcript.txt"
            curl -L --fail --retry 5 "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/production/case-against/shaq-2026-09-19/exhibit-g-script.txt" -o "$OUT/script.txt"
            curl -L --fail --retry 5 "https://raw.githubusercontent.com/yaboythump/ringside-rewrite/main/runpod/ctnetwork_qwen_narrate.py" -o "$OUT/narrate.py"
            "$ROOT/envs/qwen3-tts/bin/python" "$OUT/narrate.py"               --text-file "$OUT/script.txt"               --ref-audio "$OUT/M01_reference.wav"               --ref-text-file "$OUT/M01-reference-transcript.txt"               --output "$OUT/exhibit-g.wav"               --language English
            ffmpeg -y -loglevel error -i "$OUT/exhibit-g.wav"               -af "highpass=f=65,acompressor=threshold=-18dB:ratio=2.2:attack=12:release=100,loudnorm=I=-16:TP=-1.5:LRA=8,alimiter=limit=0.95"               -ar 48000 -ac 1 -b:a 192k "$OUT/exhibit-g.mp3"
            ffprobe -v error -show_entries format=duration,size -of json "$OUT/exhibit-g.mp3" > "$OUT/qc.json"
            echo 0 > "$OUT/status.txt"
          } >/workspace/shaq-exhibit-g.log 2>&1 || {
            rc=$?
            echo "$rc" > "$OUT/status.txt"
            cat /workspace/shaq-exhibit-g.log
            wait "$HPID"
            exit "$rc"
          }
          wait "$HPID"
          BASH
          )
          GPU_TYPES='["NVIDIA GeForce RTX 4090","NVIDIA RTX PRO 4500 Blackwell","NVIDIA GeForce RTX 5090","NVIDIA L4"]'
          BODY=$(jq -nc             --arg name "ctn-shaq-exhibit-g-$(date +%s)"             --arg dc "$CTN_DC"             --arg vol "$CTN_VOLUME"             --arg cmd "$START_CMD"             --argjson gpus "$GPU_TYPES"             '{name:$name,imageName:"runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",cloudType:"SECURE",computeType:"GPU",gpuTypeIds:$gpus,gpuTypePriority:"availability",gpuCount:1,dataCenterIds:[$dc],dataCenterPriority:"availability",containerDiskInGb:30,networkVolumeId:$vol,volumeMountPath:"/workspace",ports:["8000/http"],dockerStartCmd:["bash","-lc",$cmd]}')
          HTTP=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST https://rest.runpod.io/v1/pods             -H "Authorization: Bearer $RUNPOD_API_KEY"             -H 'Content-Type: application/json'             --data "$BODY" || true)
          cat /tmp/create.json
          [[ "$HTTP" =~ ^2 ]] || exit 2
          POD_ID=$(jq -r '.id // empty' /tmp/create.json)
          [[ -n "$POD_ID" ]] || exit 3
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${POD_ID}-8000.proxy.runpod.net" >> "$GITHUB_OUTPUT"

      - name: Retrieve Exhibit G narration
        env:
          BASE_URL: ${{ steps.pod.outputs.base_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 720); do
            status=$(curl -fsS --max-time 10 "$BASE_URL/shaq-exhibit-g/status.txt" 2>/dev/null || true)
            if [[ -n "$status" ]]; then
              curl -fsS --max-time 20 "$BASE_URL/shaq-exhibit-g.log" 2>/dev/null | tail -100 || true
              [[ "$status" == 0 ]] || exit "$status"
              curl -fL --retry 5 --max-time 600 "$BASE_URL/shaq-exhibit-g/exhibit-g.mp3" -o exhibit-g.mp3
              curl -fL --retry 5 --max-time 300 "$BASE_URL/shaq-exhibit-g/qc.json" -o exhibit-g-qc.json
              test -s exhibit-g.mp3
              exit 0
            fi
            sleep 5
          done
          exit 5

      - name: Upload Exhibit G artifact
        uses: actions/upload-artifact@v4
        with:
          name: shaq-exhibit-g-m01
          path: |
            exhibit-g.mp3
            exhibit-g-qc.json
          retention-days: 7

      - name: Terminate narration compute
        if: always()
        env:
          POD_ID: ${{ steps.pod.outputs.pod_id }}
        shell: bash
        run: |
          [[ -n "${POD_ID:-}" ]] || exit 0
          curl -sS -X DELETE "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}" >/dev/null || true
