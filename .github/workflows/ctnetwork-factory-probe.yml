# CTNETWORK read-only factory health probe — Norway migration heartbeat
name: CTNETWORK Factory Health Probe

on:
  push:
    paths:
      - 'ctnetwork-factory-probe-command.json'
      - '.github/workflows/ctnetwork-factory-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve pod credentials
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          POD_ID=$(jq -r '.pod_id' ctnetwork-factory-probe-command.json)
          [[ -n "$POD_ID" && "$POD_ID" != "null" ]] || exit 2
          POD=$(curl -fsS "https://rest.runpod.io/v1/pods/${POD_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}")
          STATUS=$(printf '%s' "$POD" | jq -r '.desiredStatus // "unknown"')
          [[ "$STATUS" == "RUNNING" ]] || { echo "Pod is not running: $STATUS"; exit 3; }
          JPASS=$(printf '%s' "$POD" | jq -r '.env.JUPYTER_PASSWORD // empty')
          [[ -n "$JPASS" ]] || { echo 'JUPYTER_PASSWORD missing'; exit 4; }
          echo "::add-mask::$JPASS"
          printf '%s' "$JPASS" > "$RUNNER_TEMP/jupyter_password"
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"

      - name: Probe factory read-only
        env:
          POD_ID: ${{ steps.resolve.outputs.pod_id }}
          JUPYTER_PASSWORD_FILE: ${{ runner.temp }}/jupyter_password
        shell: bash
        run: |
          python3 -m pip install --quiet requests websocket-client
          python3 - <<'PY' | tee /tmp/ctnetwork-factory-probe.txt
          import base64, json, os, re, sys, time
          import requests, websocket
          pod_id=os.environ['POD_ID']; password=open(os.environ['JUPYTER_PASSWORD_FILE']).read().strip()
          base=f'https://{pod_id}-8888.proxy.runpod.net'; s=requests.Session()
          for _ in range(60):
              try:
                  r=s.get(base+'/login',timeout=15)
                  if r.ok: break
              except Exception: pass
              time.sleep(3)
          else: raise SystemExit('Jupyter not reachable')
          m=re.search(r'name="_xsrf" value="([^"]+)"',r.text)
          if not m: raise SystemExit('No XSRF token')
          xsrf=m.group(1)
          r=s.post(base+'/login',data={'_xsrf':xsrf,'password':password,'next':'/'},timeout=30,allow_redirects=False)
          if r.status_code not in (200,302,303): r.raise_for_status()
          xc=s.cookies.get('_xsrf'); headers={'X-XSRFToken':xc} if xc else {}
          s.get(base+'/api/status',headers=headers,timeout=30).raise_for_status()
          r=s.post(base+'/api/terminals',headers=headers,json={},timeout=30); r.raise_for_status(); name=r.json()['name']
          cookie='; '.join(f'{c.name}={c.value}' for c in s.cookies)
          ws=websocket.create_connection(f'wss://{pod_id}-8888.proxy.runpod.net/terminals/websocket/{name}',cookie=cookie,origin=base,timeout=30)
          script=r'''set +e
          echo "=== CTNETWORK FACTORY PROBE START ==="
          date -u
          echo "--- GPU ---"; nvidia-smi --query-gpu=name,memory.total,memory.used,utilization.gpu --format=csv,noheader 2>/dev/null || true
          echo "--- STORAGE ---"; df -h /workspace 2>/dev/null || true
          echo "--- FACTORY SIZE ---"; du -sh /workspace/ctnetwork-local 2>/dev/null || true
          echo "--- FACTORY FILE COUNT ---"; find /workspace/ctnetwork-local -type f 2>/dev/null | wc -l || true
          echo "--- STATUS FILES ---"; find /workspace/ctnetwork-local/status -maxdepth 2 -type f -print 2>/dev/null | sort
          echo "--- ACTIVE TRANSFER/FACTORY PROCESSES ---"; pgrep -af "rsync|sshd|ctnetwork|scripts.inference|LatentSync|latentsync|uv |pip install|snapshot_download" 2>/dev/null | grep -v "pgrep -af" || true
          printf '__CTN_PROBE_DONE__\n'
          '''
          enc=base64.b64encode(script.encode()).decode()
          ws.send(json.dumps(['stdin',f"echo {enc} | base64 -d | bash\n"]))
          deadline=time.time()+180; output=''; done=False
          try:
              while time.time()<deadline:
                  try: msg=ws.recv()
                  except Exception: continue
                  if not msg: continue
                  try: data=json.loads(msg)
                  except Exception: continue
                  if isinstance(data,list) and len(data)>=2 and data[0]=='stdout':
                      text=data[1]; output+=text; sys.stdout.write(text); sys.stdout.flush()
                      if '=== CTNETWORK FACTORY PROBE START ===' in output and '__CTN_PROBE_DONE__' in output:
                          done=True; break
          finally:
              ws.close()
              try: s.delete(base+f'/api/terminals/{name}',headers=headers,timeout=10)
              except Exception: pass
          if not done: raise SystemExit('Probe did not finish')
          PY

      - name: Save probe report
        if: always()
        shell: bash
        run: |
          mkdir -p infra/status
          cp /tmp/ctnetwork-factory-probe.txt infra/status/ctnetwork-factory-probe-latest.txt 2>/dev/null || echo 'probe output unavailable' > infra/status/ctnetwork-factory-probe-latest.txt
          git config user.name 'ctnetwork-bot'
          git config user.email 'ctnetwork-bot@users.noreply.github.com'
          git add infra/status/ctnetwork-factory-probe-latest.txt
          git commit -m 'CTNETWORK: update factory health probe' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
