name: RunPod GPU Availability

on:
  push:
    paths:
      - '.github/workflows/runpod-5090-availability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Check live 24GB plus GPU stock
        shell: bash
        run: |
          set -euo pipefail
          QUERY='query { gpuTypes { id displayName memoryInGb secureCloud communityCloud secure: lowestPrice(input: { gpuCount: 1, secureCloud: true }) { stockStatus uninterruptablePrice availableGpuCounts } community: lowestPrice(input: { gpuCount: 1, secureCloud: false }) { stockStatus uninterruptablePrice availableGpuCounts } } }'
          jq -nc --arg q "$QUERY" '{query:$q}' >/tmp/q.json
          curl -fsS -X POST "https://api.runpod.io/graphql?api_key=${RUNPOD_API_KEY}" \
            -H 'content-type: application/json' --data @/tmp/q.json >/tmp/result.json
          jq '{errors, options: ([.data.gpuTypes[] | select(.memoryInGb >= 24) | . as $g | ([{cloud:"SECURE", stock:$g.secure.stockStatus, price:$g.secure.uninterruptablePrice},{cloud:"COMMUNITY", stock:$g.community.stockStatus, price:$g.community.uninterruptablePrice}][]) | select(.stock != null and .price != null) | {id:$g.id,name:$g.displayName,vram:$g.memoryInGb,cloud,stock,price}] | sort_by(.price))}' /tmp/result.json
