<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ringside Combo</title>
<style>
:root{
  --bg:#0d0b14; --panel:#1a1626; --panel2:#241e35; --ink:#f4f0ff; --dim:#a69cc2;
  --red:#e2364f; --gold:#f2b33d; --blue:#3d8bf2; --green:#3ec97a; --purple:#9b5cf2;
  --S:48px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% -10%,#3a1d4a 0,var(--bg) 60%);color:var(--ink);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{width:100%;max-width:520px;height:100%;padding:8px 16px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
h1{margin:0;font-size:22px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
h1 span{color:var(--gold)}
.top{position:relative}
.mute{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--panel);border:0;border-radius:10px;font-size:18px;width:38px;height:34px;cursor:pointer}
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fighter{background:var(--panel);border-radius:12px;padding:6px;display:flex;gap:6px;align-items:center;position:relative;transition:transform .15s}
.fighter.opp{flex-direction:row-reverse;text-align:right}
.fighter img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel2)}
.fighter .meta{flex:1;min-width:0}
.fighter .name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:#000a;border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
.opp .bar>i{background:var(--red);margin-left:auto}
.hpnum{font-size:11px;color:var(--dim)}
.vs{font-weight:900;color:var(--gold)}
.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:11px;margin-top:3px;min-height:16px}
.fighter:not(.opp) .status{justify-content:flex-start}
.chip{background:var(--panel2);border-radius:6px;padding:1px 6px}
.chip.guard{background:#2a4a7a}
.chip.next{background:#5a2a3a}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.clock{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
.clock .bar{flex:1;height:10px;margin:0}
.clock .bar>i{background:var(--blue);transition:width .1s linear}
.clock.low{color:var(--red);animation:hit .3s}
.clock.low .bar>i{background:var(--red)}
.clock.theirs{color:var(--red)}
.clock.theirs .bar>i{background:#5a2a3a}
#clockN{white-space:nowrap}
.crowd{background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px}
.crowd .bar{height:10px}
.crowd .bar>i{background:linear-gradient(90deg,var(--purple),var(--gold))}
.crowd.hot .bar>i{animation:glow 0.6s infinite alternate}
@keyframes glow{to{filter:brightness(1.6)}}
.crowdrow{display:flex;justify-content:space-between}
#boardWrap{flex:1 1 0;min-height:0;min-width:0;display:flex;justify-content:center;align-items:center}
#board{position:relative;width:calc(var(--S)*7 + 6px);height:calc(var(--S)*7 + 6px);flex:none;background:#120f1c;border-radius:12px;
  border:3px solid #6a3a2a;box-shadow:inset 0 0 0 3px #2b2340, 0 0 0 4px #c23a3a55;overflow:hidden;touch-action:none}
.tile{position:absolute;left:0;top:0;width:var(--S);height:var(--S);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--S)*.55);transition:transform .2s ease, opacity .2s;cursor:pointer;will-change:transform}
.tile .face img.art{width:84%;height:84%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.belt{width:100%;max-width:280px;border-radius:12px;margin:0 auto 8px;display:block}
.has-arena body{background:linear-gradient(#0d0b14cc,#0d0b14ee),var(--arena) center/cover no-repeat fixed,var(--bg)}
.has-mat #board{background:linear-gradient(#120f1c99,#120f1c99),var(--mat) center/cover}
.logo{display:block;height:34px;margin:0 auto;max-width:70%;object-fit:contain}
.tile .face{width:86%;height:86%;border-radius:22%;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:inset 0 -3px 0 #0005, inset 0 2px 0 #fff3}
.t-strike .face{background:#c8364a}
.t-grapple .face{background:#3d7bd8}
.t-kick .face{background:#2fa36a}
.t-show .face{background:#d79a1e}
.t-heal .face{background:#8a52d8}
.t-fin .face{background:conic-gradient(var(--red),var(--gold),var(--blue),var(--green),var(--purple),var(--red));animation:spin 2s linear infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.t-chair .face{background:#555b66;font-size:.9em}
.t-knux .face{background:#2a2a2a;outline:2px solid var(--red)}
.tile .cd{position:absolute;right:-2px;bottom:-4px;font-size:12px;font-weight:900;background:var(--red);border-radius:8px;padding:0 4px;color:#fff}
.tile.line-h .face::after,.tile.line-v .face::after{content:"";position:absolute;background:#fffb;border-radius:2px}
.tile.line-h .face::after{left:8%;right:8%;height:3px;top:calc(50% - 1.5px)}
.tile.line-v .face::after{top:8%;bottom:8%;width:3px;left:calc(50% - 1.5px)}
.tile.sel .face{outline:3px solid #fff;outline-offset:-1px}
.tile.own-p .face{outline:3px solid var(--gold);outline-offset:-1px}
.tile.own-o .face{outline:3px solid var(--red);outline-offset:-1px;filter:saturate(.7) brightness(.85)}
.tile.ai .face{outline:3px solid var(--red);outline-offset:-1px;transform:scale(1.1);box-shadow:0 0 14px var(--red)}
.fighter.active{box-shadow:0 0 0 2px var(--gold),0 0 16px #f2b33d55}
.fighter.opp.active{box-shadow:0 0 0 2px var(--red),0 0 16px #e2364f55}
.tile.pop{opacity:0}
.tile.pop .face{transform:scale(.2);transition:transform .2s}
.tile.hint .face{animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(.85)}}
#ticker{background:var(--panel);border-radius:10px;padding:6px 10px;min-height:36px;font-size:13px;font-style:italic;text-align:center}
#ticker b{color:var(--gold);font-style:normal}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10px;color:var(--dim);text-align:center}
.legend div span{display:block;font-size:16px}
@media (max-height:700px){.legend{display:none}h1{font-size:18px}.fighter img{width:36px;height:36px}}
/* Wide and short (phone on its side, unfolded duo): info on the left, board on the right */
@media (orientation:landscape) and (max-height:620px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto auto auto 1fr;column-gap:16px}
  #app>*{grid-column:1}
  #boardWrap{grid-column:2;grid-row:1 / -1}
  #ticker{align-self:start}
  .meters{grid-template-columns:1fr}
}
#float{position:absolute;inset:0;pointer-events:none}
.fx{position:absolute;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000;animation:up 0.9s forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:10;overflow-y:auto;overscroll-behavior:contain}
.overlay[hidden]{display:none}
.card{background:var(--panel);border-radius:16px;padding:18px;max-width:400px;width:100%;margin:auto;text-align:center;box-shadow:0 10px 40px #000a}
.card h2{margin:0 0 6px;font-size:22px}
.card p{color:var(--dim);margin:6px 0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pick button{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.pick button:hover,.pick button:focus-visible{border-color:var(--gold);outline:none}
.pick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000}
.pick b{display:block;font-size:13px;margin-top:4px}
.pick small{color:var(--dim);font-size:11px;display:block}
.btn{background:var(--gold);color:#1a1020;border:0;border-radius:10px;padding:10px 18px;font:700 15px system-ui;cursor:pointer;margin:4px}
.btn.ghost{background:var(--panel2);color:var(--ink)}
#pin{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:5}
#pin[hidden]{display:none}
#pin .count{font-size:52px;font-weight:900;color:#fff;text-shadow:0 0 20px var(--red),0 4px 0 #000;line-height:1}
#pin .need{font-size:14px;background:#000c;display:inline-block;padding:4px 10px;border-radius:8px;margin-top:4px}
.ladder{display:flex;gap:6px;justify-content:center;margin:10px 0}
.ladder img{width:52px;height:52px;border-radius:8px;object-fit:cover;opacity:.5;border:2px solid transparent}
.ladder img.done{opacity:.25;filter:grayscale(1)}
.ladder img.now{opacity:1;border-color:var(--gold)}
.howto{text-align:left;font-size:13px;color:var(--ink);margin:8px 0;padding-left:18px}
.howto li{margin:3px 0}
/* Full-height screens keep the primary action in view independently of content. */
[hidden]{display:none!important}
body{touch-action:manipulation}
#app{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.btn,.mute,select{min-height:44px}
button:disabled{opacity:.52;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mute{width:44px;min-height:32px;color:var(--ink)}
.t-reversal .face{background:linear-gradient(140deg,#4e6d90,#283248)}
.t-weapon .face{background:linear-gradient(140deg,#777,#68401e)}
.blueRopes#board{border-color:#458cfb;box-shadow:0 0 0 3px #184ebe88}
.goldAttire img{outline:2px solid var(--gold);filter:sepia(.65) saturate(1.65)}
#app[data-mode=cage] #board{background:repeating-linear-gradient(45deg,#c4c9da24 0 1px,transparent 1px 13px),repeating-linear-gradient(-45deg,#888ca42e 0 1px,#171422 1px 13px);border-color:#8b92aa}
#app[data-mode=hardcore] #board{border-color:#d08340}
#app[data-mode=submission] #stipulation{color:#aee6cf}
#app[data-mode=iron] #stipulation{color:#ffcc64}
#app[data-mode=last] #stipulation{color:#ff98a6}
#stipulation{text-align:center;color:#d8c6fb;font-size:12px;font-weight:800}
#moveBar{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#moveBar button{font:700 12px system-ui;background:linear-gradient(#372957,#231931);color:var(--ink);border:1px solid #9f70df;border-radius:8px;min-height:42px;padding:3px}
#moveBar button:not(:disabled){background:linear-gradient(#ffd274,#e5a32e);color:#24122e}
#tagTools{text-align:center}
#tagTools .btn{margin:0 2px;padding:0 12px;min-height:40px}
#pin{top:31%;z-index:6}
#pin .count{font-size:clamp(25px,8vw,52px)}
.overlay{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.menuCard{display:flex;flex-direction:column;max-height:100%;padding:12px;margin:auto;border:1px solid #614879;background:linear-gradient(#231833,#151222);overflow:hidden}
.menuCard header{position:relative;padding:5px 52px 8px;min-height:48px;display:grid;align-content:center}
.menuCard h2{margin:0;font-size:clamp(17px,4vw,23px)}
#menuBack{position:absolute;left:0;top:0;margin:0;padding:0 7px;min-width:48px;font-size:12px}
.menuContent{overflow:auto;min-height:0;overscroll-behavior:contain;padding:0 4px 4px;touch-action:pan-y}
.menuCard footer:empty,#saveNotice:empty{display:none}
.menuCard footer{flex:none;padding-top:6px;border-top:1px solid #543966;display:flex;gap:6px}
.menuCard footer .btn{flex:1;margin:0}
#saveNotice{color:#ffc480;padding:6px 0 0;font-size:12px}
.spotlight{min-height:160px;display:grid;align-content:center;justify-items:center;margin-bottom:6px;border-radius:10px;
 background:linear-gradient(0deg,#130a21,#40205265),var(--arena) center/cover;color:#fff}
.spotlight span{font-size:10px;letter-spacing:.18em;font-weight:800}
.spotlight strong,.spotlight b{font-size:clamp(27px,8vw,46px);letter-spacing:.06em;font-weight:1000;font-style:italic;line-height:1.02;text-shadow:0 3px #211032}
.spotlight b{color:var(--gold)}
.navButton{width:100%;margin:4px 0;text-transform:uppercase;letter-spacing:.08em;text-align:left}
.navButton::after{content:'›';float:right}
.rosterGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:5px 0}
.rosterCard{background:#211830;color:var(--ink);border:2px solid #543965;border-radius:10px;overflow:hidden;text-align:left;padding:5px;font:inherit;min-width:0}
.rosterCard[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 12px #f2b33d44}
.rosterCard img{display:block;width:100%;height:clamp(59px,12dvh,102px);object-fit:cover;object-position:center 32%;border-radius:5px}
.rosterCard b,.rosterCard small{display:block;padding-left:2px}
.rosterCard b{font-size:13px}
.rosterCard small{color:var(--dim);font-size:11px}
.menuRow{padding:8px;margin:5px 0;border:1px solid #4e3b66;border-radius:9px;text-align:left;background:#221932}
.menuRow small,.menuRow strong{display:block}
.menuRow small{color:#c7b9d8}
.field{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:4px 0;text-align:left;font-weight:700;font-size:13px}
.field select{min-width:0;max-width:67%;background:#302241;color:var(--ink);border:1px solid #775295;border-radius:8px;padding:5px 7px;font:inherit}
.field input[type=range]{width:54%;accent-color:var(--gold)}
.field.check{min-height:47px}
.field.check input{width:22px;height:22px;accent-color:var(--gold)}
details{text-align:left;padding:7px 0}
summary{cursor:pointer;color:#ded0f4}
#entrancePic{width:min(100%,245px);max-height:37dvh;object-fit:cover;border-radius:12px;border:2px solid var(--gold)}
#entrance .card{animation:arrival .35s ease-out}
#entrance.pyro .card,.celebration .card{box-shadow:0 0 85px #e4a42f;color:#ffe8b3}
@keyframes arrival{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.reducedMotion *, .reducedMotion *::before,.reducedMotion *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media(max-height:700px){
 .spotlight{min-height:115px}
 #app{gap:4px}
 #ticker{font-size:12px;min-height:31px;padding:3px 6px}
 #moveBar button{min-height:38px}
}
@media(orientation:landscape) and (max-height:620px){
 #app{grid-template-rows:repeat(7,min-content);align-content:stretch}
 #boardWrap{grid-row:1 / -1}
}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1>Ringside <span>Combo</span></h1><button id="pauseBtn" class="mute" aria-label="Pause match">Ⅱ</button></div>
  <div class="fighters">
    <div class="fighter" id="pBox"><img id="pImg" alt=""><div class="meta"><div class="name" id="pName"></div>
      <div class="bar"><i id="pHp"></i></div><div class="hpnum" id="pHpN"></div><div class="status" id="pStat"></div></div></div>
    <div class="vs">VS</div>
    <div class="fighter opp" id="oBox"><img id="oImg" alt=""><div class="meta"><div class="name" id="oName"></div>
      <div class="bar"><i id="oHp"></i></div><div class="hpnum" id="oHpN"></div><div class="status" id="oStat"></div></div></div>
  </div>
  <div class="meters">
  <div class="clock" id="clock"><span id="clockN">⏱ 15s</span><div class="bar"><i id="clockBar"></i></div></div>
  <div class="crowd" id="crowd"><div class="crowdrow"><span>🔥 Crowd</span><span id="crowdN">0%</span></div><div class="bar"><i id="crowdBar"></i></div></div>
  </div>
  <div id="boardWrap"><div id="board"><div id="float"></div></div></div>
  <div id="ticker">Ring the bell!</div>
  <div id="stipulation" hidden></div>
  <div id="moveBar" aria-label="Signature moves"><button></button><button></button><button></button><button></button></div>
  <div id="tagTools" hidden><button id="tagBtn" class="btn ghost"></button><button id="teamBtn" class="btn ghost"></button></div>
</div>

<div id="pin" hidden><div class="count" id="pinCount">1</div><div class="need" id="pinNeed"></div></div>

<section class="overlay" id="menu" aria-label="Main navigation">
  <div class="card menuCard">
    <header><button id="menuBack" class="btn ghost" hidden>‹ Back</button><h2 id="menuTitle">Ringside Combo</h2></header>
    <div id="menuContent" class="menuContent"></div>
    <footer id="menuFooter"></footer>
    <div id="saveNotice" role="status"></div>
  </div>
</section>
<section id="pauseMenu" class="overlay" hidden>
  <div class="card"><h2>Match paused</h2><p id="pauseRules"></p>
    <button class="btn" id="resumeBtn">Resume</button>
    <button class="btn ghost" id="restartBtn">Restart match</button>
    <button class="btn ghost" id="exitBtn">Exit match</button>
  </div>
</section>
<section id="entrance" class="overlay" hidden>
  <div class="card"><img id="entrancePic" alt=""><h2 id="entranceName"></h2><p id="entranceRules"></p>
  <button class="btn" id="bellBtn">Ring the bell</button></div>
</section>

<div class="overlay" id="between" hidden>
  <div class="card">
    <img id="bBelt" class="belt" alt="" hidden>
    <h2 id="bTitle"></h2>
    <p id="bText"></p>
    <div class="ladder" id="ladder"></div>
    <button class="btn" id="bGo"></button>
    <button class="btn ghost" id="bMenu">Main menu</button>
  </div>
</div>

<script>
(() => {
// Images are packed in by build.py. Anything missing falls back to the built-in look.
const PORTRAITS = {/*__PORTRAITS__*/};
const ART = {/*__ART__*/};
const MATCH_MUSIC = "/*__MUSIC__*/";
const pic = file => PORTRAITS[file.split('.')[0]] || '';
const N = 7;
const TYPES = ['strike','grapple','kick','show','heal','reversal'];
const ICON = {strike:'👊',grapple:'🤼',kick:'🦶',show:'⭐',heal:'🩹',fin:'🌀',chair:'🪑',knux:'🥊',reversal:'🛡',weapon:'🔧'};

/*__UNIVERSE__*/

const $ = id => document.getElementById(id);
const board = $('board'), floatEl = $('float');
const cancelled = Symbol('cancelled match');
let epoch=0, paused=false;
async function sleep(ms){
  const generation=epoch;
  while(ms>0){
    const slice=Math.min(40,ms);
    await new Promise(resolve=>setTimeout(resolve,slice));
    if(generation!==epoch) throw cancelled;
    if(!paused && !document.hidden) ms-=slice;
  }
}
function runTurn(promise){
  promise.catch(error=>{if(error!==cancelled) console.error(error);});
}
const rnd = n => Math.floor(Math.random()*n);
const pickOne = a => a[rnd(a.length)];

let S = 48, grid = [], nextId = 1, busy = false, sel = null;
let hero, rung = 0, st;
/*__PROGRESSION__*/
/*__MODES__*/

function sizeBoard(){
  const wrap = $('boardWrap');
  const avail = Math.min(wrap.clientWidth, wrap.clientHeight) - 6; // 6 = board border
  S = Math.max(18, Math.floor(avail / N));
  document.documentElement.style.setProperty('--S', S + 'px');
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (grid[r]?.[c]) place(grid[r][c], r, c);
}

/* ---------- tiles ---------- */
function makeTile(type, r, c, fromRow){
  const t = {id:nextId++, type, special:null, cd:0, el:document.createElement('div')};
  t.el.innerHTML = '<div class="face"></div>';
  t.el.addEventListener('pointerdown', e => onDown(e, t));
  board.appendChild(t.el);
  paint(t);
  place(t, fromRow ?? r, c);
  return t;
}
function paint(t){
  t.el.className = 'tile t-' + t.type + (t.special==='h' ? ' line-h' : t.special==='v' ? ' line-v' : '') + (t.type==='fin' ? ' own-'+t.owner : '');
  const face = ART[t.type] ? `<img class="art" src="${ART[t.type]}" alt="" draggable="false">` : ICON[t.type];
  t.el.firstChild.innerHTML = face + (t.type==='knux' ? `<span class="cd">${t.cd}</span>` : '');
}
function place(t, r, c){ t.el.style.transform = `translate(${c*S}px,${r*S}px)`; }
const matchable = t => t && tilePool().includes(t.type);
const blocker = t => t && (t.type==='chair' || t.type==='knux');
function posOf(t){ for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (grid[r][c]===t) return [r,c]; }

function fillFresh(){
  board.querySelectorAll('.tile').forEach(e => e.remove());
  grid = [];
  for (let r=0;r<N;r++){ grid[r]=[]; for (let c=0;c<N;c++){
    let type; do { type = pickOne(tilePool()); } while (
      (c>=2 && grid[r][c-1].type===type && grid[r][c-2].type===type) ||
      (r>=2 && grid[r-1][c].type===type && grid[r-2][c].type===type));
    grid[r][c] = makeTile(type, r, c);
  }}
  if (!hasMove()) fillFresh();
}

/* ---------- matching ---------- */
function findRuns(){
  const runs = [];
  for (let r=0;r<N;r++){ let c=0; while (c<N){ const t=grid[r][c]; let e=c+1;
    if (matchable(t)) while (e<N && matchable(grid[r][e]) && grid[r][e].type===t.type) e++;
    if (matchable(t) && e-c>=3) runs.push({dir:'h', cells:[...Array(e-c)].map((_,i)=>[r,c+i])});
    c = e; } }
  for (let c=0;c<N;c++){ let r=0; while (r<N){ const t=grid[r][c]; let e=r+1;
    if (matchable(t)) while (e<N && matchable(grid[e][c]) && grid[e][c].type===t.type) e++;
    if (matchable(t) && e-r>=3) runs.push({dir:'v', cells:[...Array(e-r)].map((_,i)=>[r+i,c])});
    r = e; } }
  return runs;
}
function wouldMatch(r1,c1,r2,c2,who='p'){
  const a=grid[r1][c1], b=grid[r2][c2];
  if (blocker(a)||blocker(b)) return false;
  if (a.type==='fin'||b.type==='fin') return [a,b].every(t => t.type!=='fin' || t.owner===who);
  grid[r1][c1]=b; grid[r2][c2]=a;
  const ok = findRuns().length>0;
  grid[r1][c1]=a; grid[r2][c2]=b;
  return ok;
}
function findMove(who='p'){
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (c+1<N && wouldMatch(r,c,r,c+1,who)) return [[r,c],[r,c+1]];
    if (r+1<N && wouldMatch(r,c,r+1,c,who)) return [[r,c],[r+1,c]];
  }
  return null;
}
const hasMove = () => !!findMove();

/* ---------- input ---------- */
let down = null;
function onDown(e, t){
  if (busy || overlayOpen() || ended || !st || !e.isPrimary) return;
  e.preventDefault();
  down = {t,id:e.pointerId,x:e.clientX,y:e.clientY};

window.addEventListener('pointerup', e => {
  if (!down || down.id!==e.pointerId) return;
  if (busy || ended || overlayOpen()){down=null;return;}
  const {t, x, y} = down; down = null;
  const dx = e.clientX-x, dy = e.clientY-y;
  const position=posOf(t);if(!position)return;
  const [r,c]=position;
  if (Math.hypot(dx,dy) > S*0.35){
    const [r2,c2] = Math.abs(dx)>Math.abs(dy) ? [r, c+Math.sign(dx)] : [r+Math.sign(dy), c];
    clearSel();
    if (r2>=0&&r2<N&&c2>=0&&c2<N) runTurn(tryMove(r,c,r2,c2));
    return;
  }
  if (sel && sel!==t){
    const [sr,sc] = posOf(sel)||[-2,-2];
    if (Math.abs(sr-r)+Math.abs(sc-c)===1){ clearSel(); runTurn(tryMove(sr,sc,r,c)); return; }
  }
  const wasSel = sel===t;
  clearSel();

/* ---------- moves ---------- */
async function tryMove(r1,c1,r2,c2){
  const a=grid[r1][c1], b=grid[r2][c2];
  if (blocker(a)||blocker(b)){ sfx.bad(); say('Can\'t move that. Make a match next to it to knock it away!'); return; }
  if ([a,b].some(t => t.type==='fin' && t.owner!=='p')){
    sfx.bad(); say(`That red-ringed 🌀 is ${st.opp.name}'s finisher. Only gold-ringed finishers are yours.`); return;
  }
  busy = true; hideHint();
  if (!await doSwap(r1,c1,r2,c2,'p')){ busy=false;ui();return; }
  await endPlayerTurn();
}
// Swap two tiles for either side. Returns false (and swaps back) if nothing matched.
async function doSwap(r1,c1,r2,c2,who){
  const a=grid[r1][c1], b=grid[r2][c2];
  grid[r1][c1]=b; grid[r2][c2]=a; place(a,r2,c2); place(b,r1,c1);
  sfx.swap();
  await sleep(180);
  if (a.type==='fin' || b.type==='fin'){
    const fin = a.type==='fin'?a:b, other = fin===a?b:a;
    await finisher(fin, other, who);
    return true;
  }
  if (!findRuns().length){
    grid[r1][c1]=a; grid[r2][c2]=b; place(a,r1,c1); place(b,r2,c2);
    sfx.bad(); await sleep(180); return false;
  }
  await cascade([r2,c2],[r1,c1],who);
  return true;
}

async function cascade(swapA, swapB, who){
  let step = 0;
  while (step<16){
    const runs = findRuns();
    if (!runs.length) break;
    step++;
    const clear = new Set(), keep = new Map();
    const key = (r,c)=>r*N+c;
    for (const run of runs){
      run.cells.forEach(([r,c])=>clear.add(key(r,c)));
      if (run.cells.length>=4){
        let at = run.cells.find(([r,c]) => (swapA && r===swapA[0]&&c===swapA[1]) || (swapB && r===swapB[0]&&c===swapB[1]))
              || run.cells[Math.floor(run.cells.length/2)];
        const k = key(...at);
        const isFin = run.cells.length>=5;
        if (!keep.has(k) || isFin) keep.set(k, isFin ? 'fin' : (run.dir==='h'?'h':'v'));
      }
    }
    // Clotheslines already on the board fire when cleared.
    let lineHits = 0, grew = true;
    while (grew){ grew=false;
      for (const k of [...clear]){ const r=Math.floor(k/N), c=k%N, t=grid[r][c];
        if (t && (t.special==='h'||t.special==='v') && !t._fired){ t._fired=true; lineHits++;
          for (let i=0;i<N;i++){ const kk = t.special==='h'?key(r,i):key(i,c);
            if (!clear.has(kk)){ clear.add(kk); grew=true; } }
          fx('CLOTHESLINE!', '#fff', r, c);
        } } }
    // Weapons next to a match get knocked away.
    let blocks = 0;
    for (const k of [...clear]){ const r=Math.floor(k/N), c=k%N;
      for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const rr=r+dr, cc=c+dc;
        if (rr>=0&&rr<N&&cc>=0&&cc<N && blocker(grid[rr][cc]) && !clear.has(key(rr,cc))){ clear.add(key(rr,cc)); } } }
    const tally = Object.fromEntries(tilePool().map(type=>[type,0]));
    tally.weapon??=0;
    for (const k of clear){
      if (keep.has(k)) continue;
      const r=Math.floor(k/N), c=k%N, t=grid[r][c]; if (!t) continue;
      if (tilePool().includes(t.type)) tally[t.type]++; else if (blocker(t)) blocks++;
      t.el.classList.add('pop'); grid[r][c]=null;
      setTimeout(()=>t.el.remove(), 220);
    }
    for (const [k,sp] of keep){ const r=Math.floor(k/N), c=k%N, t=grid[r][c]; if (!t) continue;
      if (sp==='fin'){ t.type='fin'; t.special=null; t.owner=who;
        fx(who==='p' ? 'FINISHER READY!' : first(st.opp.name).toUpperCase()+' FINISHER!', who==='p'?'#f2b33d':'#ff6b80', r, c);
        setTimeout(sfx.finReady, 150); }
      else { t.special=sp; }
      paint(t);
    }
    applyTally(tally, step, lineHits, blocks, who);
    playTally(tally, step, lineHits, blocks);
    ui();
    await sleep(230);
    await gravity();
    swapA = swapB = null;
  }
  if(findRuns().length) fillFresh();
}

function playTally(t, step, lineHits, blocks){
  const top = Object.entries(t).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0).map(e=>e[0]);
  top.slice(0,2).forEach((k,i)=>setTimeout(()=>sfx[k](), i*70));
  if (step>=2) setTimeout(()=>sfx.combo(step), 60);
  if (lineHits) sfx.line();
  if (blocks) setTimeout(sfx.weaponGone, 120);
}
function applyTally(t, step, lineHits, blocks, who){
  const chain = 1 + 0.25*(step-1);
  const tiles = Object.values(t).reduce((sum,n)=>sum+n,blocks);
  if (!st.pin && !st.kick && modeTally(t,who,blocks,tiles)) return;
  if (t.reversal && !st.pin && !st.kick) st.reversal[who]=1;
  if (who==='o') return applyOppTally(t, chain, step, lineHits);
  const m = hero.mod;
  let crowdGain = (t.grapple*3 + t.show*8 + blocks*6 + (step>1?step*3:0)) * (m.crowd||1) * (0.91+stat(hero,3)*0.03);
  if (st.pin || st.kick){
    (st.pin || st.kick).got += tiles;
    if(st.kick?.rope && t.heal>=3)st.kick.broke=true;
    st.crowd = Math.min(100, st.crowd+crowdGain);
    st.pin ? renderPin() : renderKick(); return;
  }
  let msgs = [];
  if (t.kick && st.guard){ st.guard=false; msgs.push('A kick breaks the guard!'); }
  let dmg = (t.strike*2.5 + t.grapple*3*(m.grapple||1)) * (st.guard?0.5:1) + t.kick*2 + lineHits*(m.line||0);
  dmg *= chain*activeStamina('p')*(0.94+stat(hero,0)*0.02);
  damage('o',dmg);
  if (t.heal){ const h=Math.round(t.heal*(1.3+stat(hero,2)*0.08)); st.php=Math.min(st.pmax, st.php+h); fx('+'+h, '#3ec97a', 1, 1); }
  st.crowd = Math.min(100, st.crowd+crowdGain);
  if (blocks) msgs.push('Weapon knocked out of the ring!');
  if (step>=2) msgs.unshift(`<b>${step}x COMBO!</b>`);
  const flavor = t.grapple>=3 ? 'Suplex! The ring shakes!' : t.strike>=3 ? 'Rapid-fire strikes in the corner!' :
                 t.kick>=3 ? 'Superkick!' : t.show>=3 ? 'Playing to the crowd!' : t.heal>=3 ? 'Catching a breather.' : '';
  if (flavor) msgs.push(flavor);
  if (msgs.length) say(msgs.join(' '));
}
// The opponent's matches: attacks hurt you, showboating steals your crowd, recovering heals them.
function applyOppTally(t, chain, step, lineHits){
  const o = st.opp, n = first(o.name);
  const dmg = (t.strike*2.5 + t.grapple*3 + t.kick*2 + lineHits*4) * chain * o.power * activeStamina('o');
  damage('p',dmg);
  if (t.heal){ const h=Math.round(t.heal*1.5); st.ohp=Math.min(st.omax, st.ohp+h); fx('+'+h, '#3ec97a', 1, 5); }
  if (t.show){ st.crowd = Math.max(0, st.crowd - t.show*5); }
  const msgs = [];
  if (step>=2) msgs.push(`<b>${n} chains a ${step}x combo!</b>`);
  const flavor = t.grapple>=3 ? `${n} hits a brainbuster!` : t.strike>=3 ? `${n} unloads with forearms!` :
                 t.kick>=3 ? `Enziguri from ${n}!` : t.show>=3 ? `${n} turns the crowd against you!` : t.heal>=3 ? `${n} rolls out to recover.` : '';
  if (flavor) msgs.push(flavor);
  if (msgs.length) say(msgs.join(' '));
}

async function gravity(){
  for (let c=0;c<N;c++){
    let w = N-1;
    for (let r=N-1;r>=0;r--){ const t=grid[r][c]; if (t){ if (w!==r){ grid[w][c]=t; grid[r][c]=null; place(t,w,c); } w--; } }
    let spawn = -1;
    for (let r=w;r>=0;r--){ const t = makeTile(pickOne(tilePool()), r, c, spawn--); grid[r][c]=t; }
  }
  await sleep(30);
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) place(grid[r][c], r, c);
  await sleep(240);
}

async function finisher(fin, other, who){
  const [fr,fc] = posOf(fin);
  const target = other.type==='fin' ? null : other.type;
  fin.el.classList.add('pop'); grid[fr][fc]=null; setTimeout(()=>fin.el.remove(),220);
  let cleared = 0;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){ const t=grid[r][c];
    if (t && (target===null ? !blocker(t) : t.type===target)){ t.el.classList.add('pop'); grid[r][c]=null; setTimeout(()=>t.el.remove(),220); cleared++; } }
  if((st.recovery||st.downed)?.side===who){
    const challenge=st.recovery||st.downed;challenge.got+=st.downed?cleared+5:3;
  } else if (who==='o'){
    const landed=damage('p',24*st.opp.power,'finish');sfx.finisher();haptic(28);
    if(landed) say(`<b>${st.opp.name.toUpperCase()} HITS THE FINISHER!</b>`);
  } else if (st.pin || st.kick){
    (st.pin || st.kick).got += cleared + 6; st.pin ? renderPin() : renderKick(); sfx.grapple();
  } else {
    const hot = st.crowd>=100;
    let dmg = 22 + st.crowd*0.12; if (hot) dmg *= 1.5;
    st.guard = false;
    st.finUsed=!!damage('o',dmg,'finish');st.crowd=0;sfx.finisher();haptic(35);shake('boardWrap');
    if(st.finUsed) say(`<b>${hero.name.toUpperCase()} HITS THE FINISHER!</b> ${hot?'The crowd is going insane!':''}`);
  }
  ui(); await sleep(260); await gravity();
  await cascade(null,null,who);
}

/* ---------- turns: you move, then they move ---------- */
async function endPlayerTurn(){
  st.moves++;
  if (ironExpired()) return;
  if (st.recovery || st.downed){
    const action=st.recovery||st.downed;
    if (action.got>=action.need){
      finishRecovery(true,!!st.recovery);
      return oppTurn();
    }
    if (st.recovery && --action.turns<=0) return finishRecovery(false,true);
    if (st.downed && action.time<=0) return finishRecovery(false,false);
    return yourTurn();
  }
  if (st.kick) return resolveKickout();
  if (st.pin){
    const result=await pinTick();
    if (result==='win') return;
    if (result==='counting') return yourTurn();
  } else {
    if(advanceSpecial('p')) return ended?undefined:rivalRecovery();
    if(st.php<=0){
      if(['standard','hardcore','tag','iron'].includes(st.mode)){startKickout();return yourTurn();}
      if(st.mode==='last'||st.mode==='submission'){beginRecovery('p',st.mode==='submission');return yourTurn();}
      if(st.mode==='cage') st.php=1;
    }
    const pinLine=hero.mod.pinAt||0.3;
    if (['standard','hardcore','tag','iron'].includes(st.mode) &&
        (st.ohp<=0 || (st.finUsed && st.ohp<=st.omax*pinLine))){
      st.finUsed=false;startPin();return yourTurn();
    }
    st.finUsed=false;
  }
  await oppTurn();
}
function yourTurn(){
  if (ended) return;
  st.turn='p';busy=false;ui();afterSettle();
}
async function oppTurn(){
  if (ended || ironExpired()) return;
  st.turn='o';busy=true;clearSel();hideHint();ui();
  await sleep(410);
  if(st.mode==='tag' && st.php>0){
    const team=st.teams.o, partner=team[1-st.active.o];
    if(weak('o') && partner.hp>st.ohp+18 && tagSide('o')){await sleep(350);return yourTurn();}
    if(st.teamMomentum.o>=100 || (weak('p') && st.teamMomentum.o>=60)){
      teamAttack('o');
      if(st.php<=0) startKickout();
      return yourTurn();
    }
  }
  await tickKnux();
  const pins=['standard','hardcore','tag','iron'].includes(st.mode);
  if (pins && st.php<=0){startKickout();return yourTurn();}
  if (!findMove('o')){await reshuffle();if(!findMove('o'))fillFresh();}
  const mv=aiPick();
  if (mv){
    const [[r1,c1],[r2,c2]]=mv;
    const a=grid[r1][c1], b=grid[r2][c2];
    a.el.classList.add('ai');b.el.classList.add('ai');sfx.select();
    await sleep(380);
    a.el.classList.remove('ai');b.el.classList.remove('ai');
    await doSwap(r1,c1,r2,c2,'o');
  }
  if (ended || ironExpired()) return;
  const o=st.opp;
  st.trickIn--;
  if (st.trickIn<=0){
    await sleep(200);
    await doTrick(st.nextTrick);
    st.trickIn=o.trickEvery;st.nextTrick=pickOne(o.tricks);
  }
  if(advanceSpecial('o')) return ended?undefined:yourTurn();
  if(st.ohp<=0 && pins){startPin();return yourTurn();}
  if(st.php<=0 && pins) startKickout();
  if(st.mode==='cage'){st.php=Math.max(1,st.php);st.ohp=Math.max(1,st.ohp);}
  await sleep(180);
  yourTurn();
}
// The opponent looks at every legal swap. Smarter opponents take the best one more often.
function aiPick(){
  const moves=[];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) for (const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr, c2=c+dc; if (r2>=N||c2>=N) continue;
    if (wouldMatch(r,c,r2,c2,'o')) moves.push({m:[[r,c],[r2,c2]], score:scoreMove(r,c,r2,c2)});
  }
  if (!moves.length) return null;
  if (Math.random() > st.opp.smart) return pickOne(moves).m;
  moves.sort((a,b)=>b.score-a.score);
  return moves[0].m;
}
function scoreMove(r1,c1,r2,c2){
  const a=grid[r1][c1], b=grid[r2][c2];
  if (a.type==='fin'||b.type==='fin') return 100;
  const W = {strike:2.5,grapple:3,kick:2,show:1.5,heal:weak('o')?3:0.5,reversal:1.9,weapon:6};
  if(st.mode==='cage') W.show=weak('p')?10:4.5;
  if(st.mode==='submission') W.grapple=7;
  if(st.recovery?.side==='o') Object.assign(W,{strike:0,grapple:0,kick:4,show:0,heal:11,reversal:11,weapon:0});
  if(st.downed?.side==='o') for(const key of Object.keys(W)) W[key]=5;
  grid[r1][c1]=b; grid[r2][c2]=a;
  let sc = 0;
  for (const run of findRuns()){
    const [r,c] = run.cells[0], len = run.cells.length;
    sc += W[grid[r][c].type]*len + (len>=5 ? 15 : len>=4 ? 6 : 0);
  }
  grid[r1][c1]=a; grid[r2][c2]=b;
  return sc + Math.random();
}
async function doTrick(a){
  const o = st.opp;
  if (a==='guard'){
    st.guard = true; sfx.guard(); say(`${o.name} covers up. Your damage is halved until you land a 🦶 kick!`);
  } else {
    const spots=[]; for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (matchable(grid[r][c]) && !grid[r][c].special) spots.push([r,c]);
    const n = a==='chair'?2:1;
    for (let i=0;i<n && spots.length;i++){
      const [r,c] = spots.splice(rnd(spots.length),1)[0], t=grid[r][c];
      t.type=a; t.cd = a==='knux'?3:0; paint(t);
    }
    a==='chair' ? sfx.chair() : sfx.guard();
    say(a==='chair' ? `${o.name} slides chairs into the ring! 🪑 Make matches next to them to clear them.`
                    : `${o.name} slips on brass knucks! 🥊 Clear it within 3 turns or take a big hit!`);
  }
  await sleep(250);
}

async function tickKnux(){
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){ const t=grid[r][c];
    if (t?.type==='knux'){ t.cd--; paint(t); if (t.cd>0) sfx.knuxTick();
      if (t.cd<=0){ sfx.knuxBoom(); damage('p',15);
        say(`KNUCKS SHOT! ${st.opp.name} cheats to get ahead!`);
        t.type=pickOne(tilePool()); paint(t); ui(); await sleep(300); } } }
}

/* ---------- your pin attempt ---------- */
function startPin(){
  const need=9+Math.round(Math.max(0,st.ohp)/4)+rung*2;
  st.pin={count:0,need,got:0,nearRope:st.mode!=='hardcore'&&st.rope.o&&st.ohp>0&&st.ohp>=st.omax*0.23};
  say(`<b>THE COVER!</b> Clear ${need} tiles in three moves.`);
  renderPin();ui();
}
function renderPin(){
  const p=st.pin;
  $('pin').hidden=false;
  $('pinCount').textContent=p.count===0?'COVER!':p.count+'…';
  $('pinNeed').textContent=`Tiles cleared ${Math.min(p.got,p.need)} / ${p.need} · ${3-p.count} moves left`;
}
async function pinTick(){
  const p=st.pin;
  p.count++;renderPin();
  if(p.count<3){sfx.refCount(p.count);return 'counting';}
  if(p.got>=p.need && !p.nearRope){
    sfx.refCount(3);$('pinCount').textContent='3!';await sleep(750);
    $('pin').hidden=true;st.pin=null;scoreFall('p');return 'win';
  }
  st.pin=null;
  if(p.nearRope) st.rope.o=0;
  $('pinCount').textContent=p.nearRope?'ROPE BREAK!':'2.9!';
  sfx.kickout();haptic(20);await sleep(730);$('pin').hidden=true;
  st.ohp=Math.max(st.ohp,0)+15;st.crowd=Math.min(100,st.crowd+20);
  say(p.nearRope?'<b>ROPE BREAK!</b> Drag them away from the ropes with more damage.':
    `<b>${st.opp.name} KICKS OUT AT 2.9!</b>`);
  ui();return 'kickout';
}
function startKickout(){
  const need=Math.max(6,8+rung*2+st.kickouts*3-Math.floor(stat(hero,1)/2));
  st.kick={need,got:0,count:0,rope:st.mode!=='hardcore'&&st.rope.p};
  st.php=0;
  $('pin').hidden=false;
  $('pinCount').textContent='COVER!';
  renderKick();ui();
  say(`<b>${st.opp.name.toUpperCase()} COVERS YOU!</b> Clear ${need} tiles in two moves.`);
}
function renderKick(){
  const k=st.kick;
  $('pinNeed').textContent=`KICK OUT · ${Math.min(k.got,k.need)} / ${k.need} tiles`+(k.rope?' · Recover match reaches rope':'');
}
async function resolveKickout(){
  const k=st.kick;
  if(k.count<2){
    k.count++;sfx.refCount(k.count);
    $('pinCount').textContent=k.count+'…';
    if(k.count===1) return yourTurn();
    await sleep(470);
  }
  st.kick=null;
  if (k.got>=k.need || k.broke){
    $('pinCount').textContent=k.broke?'ROPE BREAK!':'2.9!';sfx.kickout();haptic(20);
    await sleep(780);$('pin').hidden=true;
    st.kickouts++;st.php=20;if(k.broke)st.rope.p=0;
    say(k.broke?'<b>YOU REACH THE ROPE!</b>':'<b>YOU KICK OUT AT 2.9!</b>');
    ui();return oppTurn();
  }
  sfx.refCount(3);$('pinCount').textContent='3!';await sleep(710);$('pin').hidden=true;
  scoreFall('o');
}

/* ---------- flow ---------- */
let ended = false;
function afterSettle(){
  if (ended) return;
  resetClock();
  if (!hasMove()) reshuffle();
  if(st.downed?.side==='p') clockLeft=st.downed.time;
  scheduleHint();
}
async function reshuffle(){
  say('No moves left. Ref resets the action!'); sfx.swap();
  const ts=[]; for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (matchable(grid[r][c])) ts.push(grid[r][c]);
  let tries=0;
  do { ts.forEach(t=>{ t.type=pickOne(tilePool()); t.special=null; paint(t); }); tries++; }
  while ((findRuns().length || !hasMove()) && tries<50);
  if (tries>=50) fillFresh();
}
let hintT=null;
function hideHint(){ clearTimeout(hintT); board.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint')); }
function scheduleHint(){ hideHint(); hintT=setTimeout(()=>{ const m=findMove('p'); if (m && !busy) m.forEach(([r,c])=>grid[r][c].el.classList.add('hint')); }, 6000); }

function finishMatch(result,method){
  if(ended) return;
  ended=true;busy=true;hideHint();$('pin').hidden=true;
  const reward=settleResult(result);
  const won=result==='win', ladder=st.queue==='ladder';
  const champion=won && ladder && rung===LADDER.length-1;
  if(won){sfx.win();sfx.theme(hero,true);haptic([20,35,30]);}
  else sfx.lose();
  $('bTitle').textContent=st.titleWon?championship[st.titleWon].name:
    champion?'New Ringside Champion':won?'You win':result==='draw'?'Match drawn':st.opp.name+' wins';
  $('bText').textContent=method+(reward.cash?' · +'+reward.cash+' cash':'')+(reward.note?' · '+reward.note:'');
  $('bBelt').hidden=!(ART.belt&&(champion||st.titleWon));
  if(!$('bBelt').hidden) $('bBelt').src=ART.belt;
  $('between').classList.toggle('celebration',won&&owns('celebration',hero)&&wrestlerData(hero).look?.celebration);
  $('ladder').innerHTML=ladder?LADDER.map((o,i)=>`<img src="${pic(o.img)}" alt="${o.name}" class="${champion||i<rung?'done':i===rung?'now':''}">`).join(''):'';
  if(ladder&&won) rung=champion?0:rung+1;
  $('bGo').textContent=ladder?(won?(champion?'Run it back':'Next match'):'Rematch'):st.queue==='quick'?'Rematch':'Continue';
  ui();musicActive=false;syncMusic();$('between').hidden=false;
}

const matchMusic = new Audio(MATCH_MUSIC);
matchMusic.loop = true;
matchMusic.preload = 'auto';
matchMusic.setAttribute('playsinline', '');
let musicActive = false;

function syncMusic(){
  matchMusic.volume=Math.min(1,profile.settings.music*(st?.crowd>=80?1.25:1));
  if (!musicActive || profile.settings.muted || paused || document.hidden || !profile.settings.music) {
    matchMusic.pause();
  } else if (matchMusic.paused) {
    matchMusic.play().catch(() => {});
  }
}

document.addEventListener('visibilitychange', syncMusic);
window.addEventListener('click', syncMusic, {capture: true});

function start(){
  sfx.init();
  sfx.sync();
  sfx.bellStart();
  musicActive = true;
  syncMusic();
  ended=false;busy=false;paused=false;clearSel();down=null;
  $('pin').hidden=true;newBout();resetClock();scheduleHint();
}

/* ---------- turn clock: run out and you lose your turn ---------- */
let clockLeft = 15, lastSecond = 99, lastTick = performance.now();
function resetClock(){ clockLeft = st ? st.opp.clock : 15; lastSecond = 99; drawClock(); }
function drawClock(){
  const lim = st ? st.opp.clock : 15, secs = Math.ceil(clockLeft);
  const theirs = st && st.turn==='o' && !ended;
  $('clockN').textContent = theirs ? `${first(st.opp.name)}'s turn` : 'Your turn ⏱ ' + secs + 's';
  $('clockBar').style.width = theirs ? '100%' : Math.max(0, clockLeft/lim*100) + '%';
  $('clock').classList.toggle('theirs', theirs);
  $('clock').classList.toggle('low', !theirs && secs <= 3);
}
const overlayOpen=()=>['menu','between','pauseMenu','entrance'].some(id=>!$(id).hidden);
let playedUnflushed=0;
setInterval(()=>{
  const now=performance.now(),dt=Math.min(0.25,(now-lastTick)/1000);
  lastTick=now;
  if(!st||ended||overlayOpen()||document.hidden) return;
  playedUnflushed+=dt;profile.played+=dt;
  if(playedUnflushed>=60){playedUnflushed=0;persist();}
  if(st.mode==='iron'){
    st.remaining=Math.max(0,st.remaining-dt);showMode();
    if(!busy && ironExpired()) return;
  }
  if(st.downed?.side==='p'){
    const d=st.downed;
    d.time=Math.max(0,d.time-dt);
    const count=10-Math.ceil(d.time);
    if(count>d.count && d.time>0){d.count=count;sfx.refCount(count);showRecovery();}
    if(!busy && d.time<=0){finishRecovery(false,false);return;}
  }
  if(busy || st.turn!=='p') return;
  clockLeft-=dt;
  const secs=Math.ceil(clockLeft);
  if(secs<=3 && secs>0 && secs!==lastSecond){lastSecond=secs;sfx.clockTick();}
  drawClock();
  if(clockLeft>0 || st.downed) return;
  busy=true;clearSel();hideHint();
  if(st.pin || st.kick || st.recovery) runTurn(endPlayerTurn());
  else{
    sfx.bad();say('<b>TOO SLOW!</b> You lose your turn.');
    runTurn(oppTurn());
  }
},100);

function haptic(pattern){
  if(!profile.settings.haptics) return;
  if(navigator.vibrate) navigator.vibrate(pattern);
  else window.RingsideNative?.haptic();
}

/*__MENUS__*/

// Optional art: arena backdrop, ring-mat board, logo.
if (ART.arena){ document.documentElement.classList.add('has-arena'); document.documentElement.style.setProperty('--arena', `url("${ART.arena}")`); }
if (ART.mat){ document.documentElement.classList.add('has-mat'); document.documentElement.style.setProperty('--mat', `url("${ART.mat}")`); }
if (ART.logo){document.querySelector('.top h1').innerHTML=`<img class="logo" src="${ART.logo}" alt="Ringside Combo">`;}
renderMenu('home');
window.addEventListener('resize', sizeBoard);
if (window.ResizeObserver) new ResizeObserver(() => sizeBoard()).observe($('boardWrap'));
if (window.visualViewport) visualViewport.addEventListener('resize', sizeBoard);
sizeBoard();
})();
