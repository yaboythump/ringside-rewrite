}
function gain(n){s.score=Math.min(100,s.score+n)}
function findEvidence(id){if(s.found.includes(id)){selectEvidence(id);return}const item=ROOMS.flatMap(r=>r.items).find(x=>x.id===id);if(!item)return;s.found.push(id);gain(3);store();haptic("success");toast("Evidence collected: "+item.name);render()}
function selectEvidence(id){s.tab="evidence";s.selected=s.selected.includes(id)?s.selected.filter(x=>x!==id):s.selected.length>=2?[s.selected[1],id]:[...s.selected,id];renderDesk()}
function renderStage(){const room=ROOMS.find(r=>r.id===s.room)||ROOMS[0];$("room-title").textContent=room.name;$("room-stamp").textContent=room.stamp;$("stage-label").textContent=room.subtitle;$("scene-count").textContent=s.found.length+" / 16 items";$("scene-progress").style.width=Math.round(s.found.length/16*100)+"%";$("scene-art").innerHTML=art(room.id);$("hotspots").innerHTML="";
room.items.forEach(item=>{const btn=document.createElement("button");const found=s.found.includes(item.id);btn.className="hotspot"+(found?" found":"");btn.style.left=item.x+"%";btn.style.top=item.y+"%";btn.setAttribute("aria-label",(found?"Review ":"Collect ")+item.name);btn.title=item.name;btn.innerHTML="<b>"+item.icon+"</b><span class='hotspot-label'>"+esc(item.name)+"</span>";btn.addEventListener("click",()=>{if(!found)findEvidence(item.id);else{showDetail(item)}});$("hotspots").append(btn)});
$("rooms").innerHTML=ROOMS.map(room=>'<button class="room-btn '+(s.room===room.id?'active':'')+'" data-room="'+room.id+'" aria-pressed="'+String(s.room===room.id)+'">'+room.short+'</button>').join("");
}
function foundItem(id){return ROOMS.flatMap(r=>r.items).find(x=>x.id===id)}
function renderDesk(){const titles={evidence:"EVIDENCE LOCKER",interviews:"WITNESS INTERVIEWS",deductions:"THE DEDUCTION BOARD",verdict:"FINAL RECONSTRUCTION"};$("desk-title").textContent=titles[s.tab];$("case-status").textContent=s.finished?"CASE CLOSED":s.linked.length+"/4 LEADS SOLVED";
document.querySelectorAll(".tab").forEach(btn=>btn.setAttribute("aria-selected",String(btn.dataset.tab===s.tab)));
let html="";
if(s.tab==="evidence"){
 html='<p class="section-intro">Tap glowing points in the scene. Tap two items here to connect them in <strong>Deduce</strong>.</p>';
 if(!s.found.length)html+='<p class="notice">Your evidence locker is empty. Investigate the hotel suite to begin.</p>';
 html+='<div class="clue-grid">'+s.found.map(id=>{const v=foundItem(id);return '<button class="evidence '+(s.selected.includes(id)?"selected":"")+'" data-evidence="'+id+'"><span class="symbol">'+v.icon+'</span><strong>'+esc(v.name)+'</strong><small>'+esc(v.desc)+'</small><span class="note">'+(s.selected.includes(id)?"✓ SELECTED":"Tap to select")+'</span></button>'}).join("")+'</div>';
 if(s.selected.length)html+='<div class="toolrow"><button id="goDeduce">Connect '+s.selected.length+' / 2 →</button><button class="ghost" id="clearSelected">Clear selection</button></div>';
}
if(s.tab==="interviews"){
 const person=PEOPLE.find(x=>x.id===s.person)||PEOPLE[0];
 html='<p class="section-intro">Question everyone. New evidence unlocks sharper questions.</p><div class="suspects">'+PEOPLE.map(p=>'<button class="suspect '+(s.person===p.id?"selected":"")+'" data-person="'+p.id+'"><strong>'+p.icon+' '+p.name+'</strong><small>'+p.role+'</small></button>').join("")+'</div>';
 html+='<div class="dialogue"><strong>'+esc(person.name)+':</strong> '+esc(s.dialogue||person.intro)+'</div><div class="choices">'+person.topics.map((t,i)=>'<button data-question="'+i+'" '+(t.requires&&!s.found.includes(t.requires)?"disabled":"")+'>↳ '+esc(t.label)+(t.requires&&!s.found.includes(t.requires)?" · find evidence":"")+'</button>').join("")+'</div>';
 html+='<div class="meter">Testimonies '+s.interviewed.length+' / 12<div><i style="width:'+s.interviewed.length/12*100+'%"></i></div></div>';
}
if(s.tab==="deductions"){
 html='<p class="section-intro">Select two collected clues in Evidence, then connect them to expose the truth.</p>';
 html+='<div class="links">'+LINKS.map(l=>'<div class="linkcard '+(s.linked.includes(l.id)?"done":"")+'"><strong>'+(s.linked.includes(l.id)?"✓ ":"◇ ")+esc(l.name)+'</strong><small>'+esc(s.linked.includes(l.id)?l.truth:l.hint)+'</small></div>').join("")+'</div>';
 html+='<div class="dialogue"><strong>Selected clues:</strong> '+(s.selected.length?s.selected.map(id=>esc(foundItem(id).name)).join(" + "):"None yet. Open Evidence to select two clues.")+'</div>';
 html+='<div class="toolrow"><button id="linkNow" '+(s.selected.length!==2?"disabled":"")+'>Connect Evidence</button><button class="ghost" id="pickEvidence">Choose clues</button></div>';
}
if(s.tab==="verdict"){
 html='<p class="section-intro">Reconstruct what happened to Lena Vale. A strong case needs all four deductions.</p><div class="meter">Solved deductions '+s.linked.length+' / 4<div><i style="width:'+s.linked.length/4*100+'%"></i></div></div>';
 html+=question("Who was behind the cover-up?","suspect",[{v:"mara",t:"Mara Voss"},{v:"theo",t:"Theo Reed"},{v:"elias",t:"Elias Rook"},{v:"iris",t:"Iris Vale"}]);
 html+=question("What was the motive?","motive",[{v:"fraud",t:"Conceal fraudulent contracts"},{v:"money",t:"Steal Lena's personal belongings"},{v:"revenge",t:"Settle a family dispute"}]);
 html+=question("How did Lena get away?","route",[{v:"roof",t:"Service stairs and rooftop gate"},{v:"lift",t:"Passenger elevator"},{v:"front",t:"Hotel front entrance"}]);
 html+='<div class="toolrow"><button id="submitCase" '+(s.finished?"disabled":"")+'>⚖ File Case Report</button></div>';
 if(s.finished)html+='<p class="notice">CASE CLOSED · '+esc(s.ending)+'</p>';
}
$("desk-body").innerHTML=html;
$("desk-body").querySelectorAll("[data-evidence]").forEach(b=>b.addEventListener("click",()=>selectEvidence(b.dataset.evidence)));
$("desk-body").querySelectorAll("[data-person]").forEach(b=>b.addEventListener("click",()=>{s.person=b.dataset.person;s.dialogue="";s.interviewed.includes(s.person+":intro")||s.interviewed.push(s.person+":intro");store();renderDesk()}));
$("desk-body").querySelectorAll("[data-question]").forEach(b=>b.addEventListener("click",()=>{const p=PEOPLE.find(x=>x.id===s.person),i=+b.dataset.question,t=p.topics[i];if(t.requires&&!s.found.includes(t.requires))return;s.dialogue=t.line;const k=p.id+":"+i;if(!s.interviewed.includes(k)){s.interviewed.push(k);gain(2)}store();haptic("light");renderDesk()}));
$("desk-body").querySelectorAll("[data-answer]").forEach(b=>b.addEventListener("click",()=>{s[b.dataset.answer]=b.dataset.value;store();renderDesk()}));
const bind=(id,cb)=>{const b=$(id);if(b)b.addEventListener("click",cb)};
bind("goDeduce",()=>{s.tab="deductions";renderDesk()});bind("clearSelected",()=>{s.selected=[];renderDesk()});bind("pickEvidence",()=>{s.tab="evidence";renderDesk()});bind("linkNow",connect);bind("submitCase",solve);
}
function question(title,key,options){return '<p class="notice">'+title+'</p><div class="accuse">'+options.map(o=>'<button data-answer="'+key+'" data-value="'+o.v+'" class="'+(s[key]===o.v?"choice":"")+'">'+esc(o.t)+'</button>').join("")+'</div>'}
function connect(){if(s.selected.length!==2){toast("Select two items in Evidence.");return}const l=LINKS.find(t=>[t.a,t.b].every(id=>s.selected.includes(id)));if(!l){haptic("warning");toast("These clues do not form a lead. Try another pair.");return}if(!s.linked.includes(l.id)){s.linked.push(l.id);gain(7);haptic("success");toast("Breakthrough: "+l.name)}else toast("This lead is already solved.");s.selected=[];store();renderDesk()}
function solve(){if(s.linked.length<4){haptic("warning");toast("Resolve all four deductions before filing.");return}if(!s.suspect||!s.motive||!s.route){toast("Complete all three questions.");return}
if(s.suspect==="mara"&&s.motive==="fraud"&&s.route==="roof"){s.finished=true;s.ending="The Meridian Cover-Up";s.score=100;store();haptic("success");modal("CASE CLOSED · 001","You followed the call, decoded MV-04, and traced the rooftop escape. Mara Voss tried to bury Lena's investigation into falsified contracts. Lena escaped through the service route with the invoices. Your report reaches her newsroom, and Lena is found safe with the original records.",true)}
else{haptic("warning");modal("THE THEORY DOESN'T HOLD","Your reconstruction conflicts with the evidence. Revisit your deductions, witness statements, and the connection between MV-04 and the hotel invoices. You can revise your report without losing progress.",false)}
}
function modal(title,copy,done){const o=$("overlay");o.hidden=false;o.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">CTINTERACTIVE · DETECTIVE DUO</div><div class="eyeline"></div><h2 id="modal-title">'+esc(title)+'</h2><p>'+esc(copy)+'</p>'+(done?'<p class="notice">DETECTIVE RANK: MASTER INVESTIGATOR · CASE SCORE 100/100</p>':'')+'<div class="modal-foot"><button class="button-primary" id="dismissModal">'+(done?"Return to case file":"Keep investigating")+'</button></div></div>';$("dismissModal").addEventListener("click",()=>{o.hidden=true;o.innerHTML="";render()});}
function showDetail(item){modal(item.name,item.desc,false)}
function welcome(){const o=$("overlay");o.hidden=false;o.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">PRIVATE INVESTIGATOR · CASE 001</div><h2 id="modal-title">THE LAST CALL AT MERIDIAN</h2><p>11:47 PM. Reporter Lena Vale vanishes from Suite 904 after a call to her newsroom cuts out. The hotel says she checked out. Her belongings say otherwise.</p><ul><li>Investigate four interactive scenes.</li><li>Interview four witnesses and suspects.</li><li>Connect clues to unlock four deductions.</li><li>Reconstruct what happened and close the case.</li></ul><p><strong>iPhone Duo:</strong> Play on the outer screen, then unfold to see the scene beside your case board. Your progress stays in place.</p><div class="modal-foot"><button class="button-primary" id="beginCase">Begin Investigation →</button></div></div>';
$("beginCase").addEventListener("click",()=>{o.hidden=true;o.innerHTML="";s.briefed=true;store();haptic("success")})}
function render(){renderStage();renderDesk()}
$("rooms").addEventListener("click",e=>{const b=e.target.closest("[data-room]");if(b){s.room=b.dataset.room;store();haptic("light");renderStage()}});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){s.tab=b.dataset.tab;store();renderDesk()}});
$("help").addEventListener("click",()=>modal("INVESTIGATION BRIEF","Explore four rooms by tapping golden hotspots. Collect evidence, interview the people involved, connect clue pairs in Deduce, and file your reconstruction in Solve. Unfold iPhone Duo for side-by-side scene and desk views. The case auto-saves on this device.",false));
$("settings").addEventListener("click",()=>{const o=$("overlay");o.hidden=false;o.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">DETECTIVE DUO · CASE MANAGEMENT</div><h2>Open a new case file?</h2><p>This restarts Case 001 and clears collected evidence, leads, and interviews on this device.</p><div class="modal-foot"><button id="cancelReset" class="button-primary">Keep my case</button><button id="resetCase" class="button-primary">Restart case</button></div></div>';$("cancelReset").addEventListener("click",()=>o.hidden=true);$("resetCase").addEventListener("click",()=>{s=empty();store();o.hidden=true;render();welcome()})});
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)$("overlay").hidden=true});
window.DetectiveDuoTest=Object.freeze({state:()=>JSON.parse(JSON.stringify(s)),rooms:ROOMS.map(x=>x.id),links:LINKS.map(x=>({id:x.id,a:x.a,b:x.b})),collect:findEvidence,choose:(a,b)=>{s.selected=[a,b];connect()},solve,go:room=>{s.room=room;renderStage()},openTab:tab=>{s.tab=tab;renderDesk()}});
render();if(!s.briefed)welcome();
})();
</script>
