<title>Ringside Card Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:ital,wght@0,600;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: fight-night broadcast column over a live arena canvas. Opponent up top, ring ticker in the middle, you below, foil cards at the bottom. Single dark arena look by choice. */
:root{
  --bg:#060608; --panel:rgba(18,18,22,.78); --panel-2:#1c1c22; --line:#2c2c34;
  --fg:#f1efe8; --muted:#8f8f99; --steel:#c3c6cf;
  --gold:#e2bd62; --gold-hi:#fff1c4; --gold-deep:#8f6a22; --crimson:#d1213b; --crimson-deep:#6d0f1d; --good:#64d18a;
  --strike:#ff7a3d; --grapple:#ff3d5a; --defense:#7fb2ff; --hype:#ffd25e; --finisher:#ffe08a;
  --display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:Barlow,system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --metal:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 38%,var(--gold-deep) 52%,var(--gold) 70%,var(--gold-hi) 100%);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
#arena{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:#fff;opacity:0}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;display:grid;gap:14px}
.app.quake{animation:quake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-8px,3px)}40%,60%{transform:translate(8px,-3px)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* type */
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(226,189,98,.25))}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.logo{margin:0;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.82;letter-spacing:-.01em}
.logo .l1{display:block;font-size:clamp(22px,5vw,30px);color:var(--steel);letter-spacing:.18em;font-weight:800}
.logo .l2{display:block;font-size:clamp(46px,12vw,78px)}
.tag{font-family:var(--label);letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.eyebrow{font-family:var(--label);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--gold)}

/* select */
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.pick{position:relative;text-align:left;display:grid;gap:8px;padding:10px 10px 14px;background:linear-gradient(170deg,rgba(40,40,48,.9),rgba(10,10,12,.92));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);transition:transform .2s ease,filter .2s}
.pick::before{content:"";position:absolute;inset:0;padding:1px;background:linear-gradient(160deg,var(--gold),transparent 40%,transparent 70%,var(--gold-deep));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pick:hover{transform:translateY(-4px) scale(1.015);filter:drop-shadow(0 10px 24px rgba(226,189,98,.25))}
.pick h3{font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:.9;margin:0;text-transform:uppercase}
.pick p{margin:0;color:var(--steel);font-size:13px;line-height:1.4}
.pick .fin{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.statline{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.statline b{color:var(--fg);font-weight:600}
.tape{font-family:var(--label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson)}

/* portraits */
.portrait{aspect-ratio:1;width:100%;max-width:100%;overflow:hidden;position:relative;background:var(--panel-2);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.08) saturate(1.05)}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.plate{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.plate .beam{position:absolute;inset:-20%;background:radial-gradient(ellipse 40% 60% at 50% 0%,rgba(255,255,255,.35),transparent 70%)}
.plate .ini{position:relative;font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.85);text-shadow:0 0 24px rgba(255,255,255,.25)}
.portrait .note{position:absolute;bottom:6px;left:6px;right:6px;z-index:1;font-family:var(--label);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);text-align:center}

/* fighter panels */
.fighter{position:relative;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;padding:26px 14px 12px;margin-top:8px;
  background:linear-gradient(100deg,rgba(28,28,34,.92),rgba(10,10,12,.85));clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.fighter::before{content:"";position:absolute;inset:0;padding:2px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.fighter.me::before{background:linear-gradient(110deg,var(--gold-hi),var(--gold) 30%,var(--gold-deep) 60%,var(--gold))}
.fighter.them::before{background:linear-gradient(110deg,#ff6a7e,var(--crimson) 40%,var(--crimson-deep))}
.fighter.me{box-shadow:inset 0 0 40px rgba(226,189,98,.08)}
.fighter.them{box-shadow:inset 0 0 40px rgba(209,33,59,.10)}
.fighter .portrait{width:92px}
.side{position:absolute;top:0;left:26px;padding:3px 12px 2px;font-family:var(--display);font-weight:900;font-style:italic;font-size:14px;letter-spacing:.14em;text-transform:uppercase;z-index:2;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.me .side{background:var(--metal);color:#1a1405}
.them .side{background:linear-gradient(180deg,#ff5a70,var(--crimson));color:#fff}
.fighter .name{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(24px,6vw,32px);line-height:.9;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:6px}
.fighter .name small{font-family:var(--label);font-style:normal;font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--muted)}
.bars{display:grid;gap:6px;min-width:0}
.lbl{display:flex;justify-content:space-between;gap:8px;font-family:var(--label);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:-3px}
.lbl .num{color:var(--fg);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.lbl .num.ready{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 1s ease-in-out infinite}
.bar{height:12px;background:#0a0a0c;position:relative;overflow:hidden;transform:skewX(-18deg);border:1px solid rgba(255,255,255,.08)}
.bar .ghost{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.85;transition:width .9s cubic-bezier(.2,.8,.2,1) .25s}
.bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#ff6b7a,var(--crimson) 55%,#8c1225);transition:width .25s ease-out;box-shadow:0 0 12px rgba(209,33,59,.6)}
.me .bar .fill{background:linear-gradient(180deg,#9ff0b8,#2fb565 55%,#147a3f);box-shadow:0 0 12px rgba(100,209,138,.45)}
.bar .fill.low{animation:low .6s ease-in-out infinite}
@keyframes low{50%{filter:brightness(1.6)}}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px) 10%)}
.hype{display:flex;gap:3px;align-items:center}
.hype span{flex:1;height:8px;background:#0a0a0c;transform:skewX(-18deg);transition:background .2s,box-shadow .2s;border:1px solid rgba(255,255,255,.06)}
.hype span.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 0 6px rgba(226,189,98,.55)}
.hype.full span.on{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.45);box-shadow:0 0 14px rgba(255,224,138,.9)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--label);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chip{padding:2px 9px;background:rgba(255,255,255,.06);color:var(--steel);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.chip.block{color:var(--defense)} .chip.weak{color:var(--strike)} .chip.rev{color:var(--good)}
.intent{display:flex;align-items:center;gap:8px;font-family:var(--label);font-size:14px}
.intent .k{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.intent .v{padding:3px 12px;font-family:var(--display);font-weight:800;font-style:italic;font-size:17px;text-transform:uppercase;letter-spacing:.03em;background:rgba(255,255,255,.06);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.intent .v.strike{color:var(--strike)} .intent .v.grapple{color:var(--grapple)} .intent .v.defense{color:var(--defense)} .intent .v.hype{color:var(--hype)}
.intent .v.finisher{color:#1a1405;background:var(--metal);animation:glow .8s ease-in-out infinite}
.hit{animation:hit .4s}
@keyframes hit{0%{filter:brightness(2.2)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}100%{filter:none}}
.float{position:absolute;right:18px;top:10px;z-index:3;font-family:var(--display);font-weight:900;font-style:italic;font-size:44px;line-height:1;pointer-events:none;-webkit-text-stroke:2px #000;animation:rise 1s ease-out forwards}
.float.big{font-size:64px}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

/* ring ticker */
.ticker{position:relative;padding:12px 16px 10px;background:linear-gradient(180deg,rgba(10,10,12,.92),rgba(22,22,28,.9));display:grid;gap:3px}
.ticker::before,.ticker::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--crimson) 12%,#ff6a7e 50%,var(--crimson) 88%,transparent);box-shadow:0 0 10px rgba(209,33,59,.6)}
.ticker::before{top:0} .ticker::after{bottom:0}
.ticker .now{font-family:var(--display);font-weight:800;font-style:italic;font-size:21px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.ticker .now.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.12);opacity:0}to{transform:none;opacity:1}}
.ticker .prev{color:var(--muted);font-size:13px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.energy{display:flex;gap:7px;align-items:center}
.energy i{width:20px;height:20px;transform:rotate(45deg);border:2px solid var(--gold-deep);display:block;transition:all .2s}
.energy i.on{background:var(--metal);border-color:var(--gold-hi);box-shadow:0 0 10px rgba(226,189,98,.6)}
.energy span{margin-left:6px;color:var(--fg)}

/* foil cards */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;perspective:900px}
.card{--c:var(--steel);position:relative;text-align:left;display:grid;gap:5px;align-content:start;min-height:150px;padding:10px 10px 12px;overflow:hidden;
  background:linear-gradient(165deg,color-mix(in srgb,var(--c) 32%,#16161b) 0%,#121216 42%,#0b0b0e 100%);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  transition:transform .18s ease,filter .18s;animation:deal .35s ease-out backwards;animation-delay:calc(var(--i) * 60ms)}
.card::before{content:"";position:absolute;inset:0;padding:1.5px;background:linear-gradient(160deg,var(--c),transparent 45%,transparent 65%,var(--c));opacity:.9;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.card::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 48%,rgba(255,240,200,.08) 52%,transparent 60%);transform:translateX(-60%);transition:transform .7s ease;pointer-events:none}
.card:hover:not(:disabled){transform:translateY(-6px) rotateX(6deg);filter:drop-shadow(0 12px 18px color-mix(in srgb,var(--c) 45%,transparent))}
.card:hover:not(:disabled)::after{transform:translateX(60%)}
.card:disabled{filter:grayscale(.85) brightness(.55);cursor:not-allowed}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-4deg)}to{opacity:1;transform:none}}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .cost{width:26px;height:26px;flex:none;display:grid;place-items:center;position:relative}
.card .cost::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);background:var(--metal);box-shadow:0 0 8px rgba(226,189,98,.5)}
.card .cost b{position:relative;font-family:var(--display);font-weight:900;font-size:17px;color:#1a1405}
.card .type{font-family:var(--label);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.card h4{margin:2px 0 0;font-family:var(--display);font-weight:900;font-style:italic;font-size:23px;line-height:.9;text-transform:uppercase}
.card .big{font-family:var(--display);font-weight:900;font-style:italic;font-size:30px;line-height:1;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.card p{margin:0;font-size:12.5px;line-height:1.35;color:var(--steel)}
.card.sig{--sig:1}
.card.sig .seal{position:absolute;right:8px;bottom:7px;font-family:var(--label);font-weight:700;font-size:9px;letter-spacing:.18em;text-transform:uppercase;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-strike{--c:var(--strike)} .t-grapple{--c:var(--grapple)} .t-defense{--c:var(--defense)} .t-hype{--c:var(--hype)}

/* buttons */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.btn{padding:13px 22px;font-family:var(--display);font-weight:900;font-style:italic;font-size:22px;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.06);color:var(--fg);
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:filter .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
.btn.primary{background:var(--metal);color:#1a1405}
.btn.fin{background:linear-gradient(110deg,var(--crimson-deep),var(--crimson) 30%,#ff5a70 50%,var(--crimson) 70%,var(--crimson-deep));background-size:220% 100%;color:#fff;animation:sheen 1.4s linear infinite;text-shadow:0 0 12px rgba(255,255,255,.5)}
@keyframes sheen{to{background-position:-220% 0}}
.btn:disabled{opacity:.3;cursor:not-allowed;animation:none;filter:grayscale(1)}
.grow{flex:1}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(20,14,4,.75),rgba(3,3,4,.94) 70%);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.count{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(120px,38vw,220px);line-height:1;color:var(--fg);text-align:center;animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
.count.three{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(226,189,98,.6))}
.count.out{color:var(--crimson);font-size:clamp(56px,16vw,110px);text-shadow:0 0 30px rgba(209,33,59,.7)}
.ref{font-family:var(--label);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);text-align:center;font-size:13px}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.vs{width:100%;max-width:640px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .side-l{animation:inL .5s cubic-bezier(.2,.9,.3,1.2) both}
.vs .side-r{animation:inR .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes inL{from{transform:translateX(-120%);opacity:0}}
@keyframes inR{from{transform:translateX(120%);opacity:0}}
.vs .who{display:grid;gap:8px;justify-items:center;text-align:center}
.vs .who .portrait{width:min(34vw,200px)}
.vs .who h3{margin:0;font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(22px,6vw,38px);line-height:.9;text-transform:uppercase}
.vs .who small{font-family:var(--label);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.vs .x{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(54px,15vw,110px);line-height:1;animation:slam .4s .35s cubic-bezier(.2,1.6,.4,1) both}
.vs-foot{grid-column:1/-1;text-align:center;margin-top:8px}
.finisher{text-align:center;display:grid;gap:6px;justify-items:center}
.finisher .by{font-family:var(--label);font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--steel);animation:slam .3s both}
.finisher h2{margin:0;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:clamp(54px,16vw,120px);line-height:.85;animation:slam .45s .1s cubic-bezier(.2,1.6,.4,1) both}
.finisher .streak{width:min(80vw,560px);height:4px;background:var(--metal);box-shadow:0 0 20px var(--gold);animation:streak .5s .2s ease-out both}
@keyframes streak{from{transform:scaleX(0)}}
.result{max-width:460px;text-align:center;display:grid;gap:14px;justify-items:center}
.result h2{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(48px,13vw,84px);line-height:.85;margin:0;text-transform:uppercase;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
.result p{margin:0;color:var(--steel);line-height:1.5}
.belt{font-size:0;width:min(70vw,320px);aspect-ratio:3.2;position:relative;animation:slam .5s .2s cubic-bezier(.2,1.6,.4,1) both}
.belt::before{content:"";position:absolute;inset:30% 0;background:linear-gradient(180deg,#2a2a2a,#0c0c0c);border-radius:6px}
.belt::after{content:"";position:absolute;left:30%;right:30%;top:0;bottom:0;background:var(--metal);clip-path:polygon(15% 0,85% 0,100% 50%,85% 100%,15% 100%,0 50%);box-shadow:0 0 30px rgba(226,189,98,.7)}
.ladder{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ladder span{padding:4px 10px;background:rgba(255,255,255,.06);color:var(--muted);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.ladder span.done{color:var(--good)} .ladder span.cur{color:#1a1405;background:var(--metal)}
.howto{color:var(--steel);font-size:14px;line-height:1.55;margin:0;max-width:65ch;padding:14px 16px;background:var(--panel);border-left:3px solid var(--gold)}
.howto b{color:var(--gold)}
.foot{color:var(--muted);font-size:11px;font-family:var(--label);letter-spacing:.08em}
.skip{font-family:var(--label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* ---------- arena canvas ---------- */
const cv=$("#arena"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1,bulbs=[],burst=0,tint=null;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);if(RM)drawArena(0);}
addEventListener("resize",resize);
function crowd(n=40,color){burst=Math.max(burst,n);tint=color||null;}
function drawArena(t){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0d0c10");g.addColorStop(.55,"#060608");g.addColorStop(1,"#0a0708");
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // spotlights
  cx.globalCompositeOperation="lighter";
  const beams=[{x:.18,s:.00031,c:"255,236,190"},{x:.82,s:-.00027,c:"255,236,190"},{x:.5,s:.00019,c:tint||"226,189,98"}];
  for(const b of beams){
    const ang=Math.sin(t*b.s*3+b.x*7)*.38;
    cx.save();cx.translate(W*b.x,-20);cx.rotate(ang);
    const len=H*1.25,wd=Math.max(W,H)*.22;
    const lg=cx.createLinearGradient(0,0,0,len);lg.addColorStop(0,`rgba(${b.c},.20)`);lg.addColorStop(1,`rgba(${b.c},0)`);
    cx.fillStyle=lg;cx.beginPath();cx.moveTo(-8,0);cx.lineTo(8,0);cx.lineTo(wd,len);cx.lineTo(-wd,len);cx.closePath();cx.fill();cx.restore();
  }
  // haze
  for(let i=0;i<3;i++){
    const hx=(W*(.2+.3*i)+Math.sin(t*.0002+i)*W*.15),hy=H*(.35+.12*i);
    const rg=cx.createRadialGradient(hx,hy,0,hx,hy,W*.5);rg.addColorStop(0,"rgba(120,110,130,.05)");rg.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=rg;cx.fillRect(0,0,W,H);
  }
  // camera flashes in the crowd
  const rate=burst>0?6:.35; if(burst>0)burst-=1;
  if(Math.random()<rate/6) for(let k=0;k<(burst>0?4:1);k++) bulbs.push({x:Math.random()*W,y:H*(.55+Math.random()*.45),life:1,r:1+Math.random()*2.2});
  for(const p of bulbs){
    const a=p.life;const rg=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*14);
    rg.addColorStop(0,`rgba(255,255,255,${.9*a})`);rg.addColorStop(.2,`rgba(255,245,220,${.35*a})`);rg.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=rg;cx.fillRect(p.x-p.r*14,p.y-p.r*14,p.r*28,p.r*28);p.life-=.06;
  }
  bulbs=bulbs.filter(p=>p.life>0);
  cx.globalCompositeOperation="source-over";
  // vignette
  const vg=cx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.2,W/2,H*.45,Math.max(W,H)*.75);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.7)");
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
}
function loop(t){drawArena(t);requestAnimationFrame(loop);}
resize(); if(!RM) requestAnimationFrame(loop);

function flash(){const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");}
function quake(){app.classList.remove("quake");void app.offsetWidth;app.classList.add("quake");}

/* ---------- pieces ---------- */
function portrait(w,note){
  if(w.img) return `<div class="portrait"><img src="${w.img}" alt="${esc(w.name)}"></div>`;
  const ini=w.name.split(" ").map(s=>s[0]).join("");
  return `<div class="portrait" style="background:radial-gradient(circle at 50% 30%,${w.color},#0b0b0e 75%)"><div class="plate"><div class="beam"></div><span class="ini">${ini}</span></div>${note?`<span class="note">Art coming from RunPod</span>`:""}</div>`;
}
const logo=()=>`<h1 class="logo"><span class="l1">Ringside</span><span class="l2 metal">Card Clash</span></h1>`;

/* ---------- screens ---------- */
function selectScreen(){
  const best=loadBest();
  app.innerHTML=`
  <header class="brand">${logo()}<span class="tag">Wrestling history. Booked differently.</span></header>
  <div class="eyebrow">Choose your wrestler</div>
  <div class="roster">${Object.values(WRESTLERS).map(w=>`
    <button class="pick" data-w="${w.id}">
      ${portrait(w,true)}
      <div class="tape">${esc(w.tag)}</div>
      <h3>${esc(w.name)}</h3>
      <div class="statline"><span>${w.style}</span><span><b>${w.hp}</b> stamina</span></div>
      <p>${esc(w.passive)}</p>
      <div class="fin metal">Finisher: ${esc(w.fin.name)}</div>
      ${best[w.id]?`<div class="chip rev" style="justify-self:start">Champion ×${best[w.id]}</div>`:""}
    </button>`).join("")}
  </div>
  <p class="howto"><b>How a match works.</b> Each turn you get 3 energy and 5 cards. Strikes and grapples do damage, defense keeps you standing, hype fills your meter. You can always see your opponent's next move, so block the big hits and save Reversal for their grapples. Fill hype to 10 to unleash your finisher. Drop them to 0 stamina for the pin, but anyone with 5 hype can kick out at two, once per match. Win three in a row to take the Rewrite Championship.</p>
  <div class="foot">Original fictional wrestlers. Unofficial and fan-made. Brick Malone's portrait was generated on RunPod with MiniMax H3.</div>`;
  app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>startRun(b.dataset.w));
}

function makeFighter(id){
  const w=WRESTLERS[id];
  return {w,hp:w.hp,max:w.hp,hype:id==="kid"?4:0,block:0,weak:0,kicked:false,
    deck:shuffle([...BASE_DECK,...w.sig,...w.sig.slice(0,1)]),hand:[],discard:[],energy:ENERGY,reversal:false};
}
function startRun(id){
  G={pid:id,ladder:shuffle(Object.keys(WRESTLERS).filter(k=>k!==id)),round:0,log:[]};
  startMatch();
}
async function startMatch(){
  G.p=makeFighter(G.pid); G.o=makeFighter(G.ladder[G.round]);
  G.turn=1; G.busy=true; G.over=false; G.bars={};
  G.log=[`Round ${G.round+1} of 3. ${G.o.w.name} is waiting in the ring.`];
  pickIntent(); dealHand(); render();
  await vsSplash();
  G.busy=false; render();
}
function vsSplash(){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="overlay";
    ov.innerHTML=`<div class="vs">
      <div class="who side-l">${portrait(G.p.w)}<small class="metal">You</small><h3>${esc(G.p.w.name)}</h3></div>
      <div class="x metal">VS</div>
      <div class="who side-r">${portrait(G.o.w)}<small style="color:var(--crimson)">Round ${G.round+1} of 3</small><h3>${esc(G.o.w.name)}</h3></div>
      <div class="vs-foot skip">Tap to fight</div></div>`;
    document.body.appendChild(ov); crowd(70);
    let done=false;const end=()=>{if(done)return;done=true;ov.remove();res();};
    ov.onclick=end; setTimeout(end,RM?600:2200);
  });
}

/* ---------- core ---------- */
function draw(f,n){
  for(let i=0;i<n;i++){
    if(!f.deck.length){ if(!f.discard.length) return; f.deck=shuffle(f.discard); f.discard=[]; }
    f.hand.push(f.deck.pop());
  }
}
function dealHand(){const p=G.p;p.block=0;p.reversal=false;p.energy=ENERGY;p.discard.push(...p.hand);p.hand=[];draw(p,HAND);G.dealt=true;}
function startTurn(){dealHand();render();}
function say(t){G.log.unshift(t);G.log=G.log.slice(0,2);G.fresh=true;}
function gainHype(f,n){f.hype=Math.min(HYPE_MAX,f.hype+n);}

function pickIntent(){
  const o=G.o,w=o.w;
  if(o.hype>=HYPE_MAX){G.intent={type:"finisher",label:w.fin.name,dmg:w.fin.dmg};return;}
  const bag=[];for(const [k,v] of Object.entries(w.ai)) for(let i=0;i<v;i++) bag.push(k);
  if(o.hp<o.max*.35) bag.push("defense","defense");
  const t=bag[rnd(bag.length)], lvl=Math.min(G.round,2);
  if(t==="strike"){const d=[5,6,7,8][rnd(4)]+lvl;G.intent={type:"strike",label:`Strike ${d}`,dmg:d};}
  else if(t==="grapple"){let d=[7,8,9,10][rnd(4)]+lvl;if(w.id==="brick")d+=2;G.intent={type:"grapple",label:`Grapple ${d}`,dmg:d};}
  else if(t==="defense"){const b=6+rnd(4);G.intent={type:"defense",label:`Block ${b}`,block:b};}
  else G.intent={type:"hype",label:"Play to the crowd",hype:3+(w.id==="kid"?1:0)};
}
function damage(t,amount,{ignoreBlock=false}={}){
  let d=amount;
  if(!ignoreBlock&&t.block>0){const u=Math.min(t.block,d);t.block-=u;d-=u;}
  t.hp=Math.max(0,t.hp-d);return d;
}
function impact(who,amount,big){
  fx(who,amount,big);
  if(amount>=8||big){quake();crowd(big?90:30);}
  if(big) flash();
}

function playCard(i){
  if(G.busy||G.over) return;
  const p=G.p,o=G.o,id=p.hand[i],c=CARDS[id];
  if(c.cost>p.energy) return;
  p.energy-=c.cost;p.hand.splice(i,1);p.discard.push(id);G.dealt=false;
  let msg=`${c.name}!`;
  if(c.dmg){
    let d=c.dmg;
    if(c.type==="grapple"&&G.pid==="brick") d+=2;
    if(p.weak>0) d=Math.max(0,d-3);
    const dealt=damage(o,d);
    msg=`${c.name} for ${dealt}${dealt<d?` (${d-dealt} blocked)`:""}!`;
    impact("o",dealt,false);
    gainHype(p,(c.hype||0)+(c.type==="strike"&&G.pid==="raven"?1:0));
    gainHype(o,1);
  }
  if(c.self){p.hp=Math.max(1,p.hp-c.self);fx("p",c.self);}
  if(c.block){p.block+=c.block;msg+=` Blocking ${p.block}.`;}
  if(c.weak){o.weak=Math.max(o.weak,c.weak);}
  if(c.heal){p.hp=Math.min(p.max,p.hp+c.heal);msg=`Second wind! +${c.heal} stamina.`;}
  if(c.hypeGain){gainHype(p,c.hypeGain+(G.pid==="kid"?1:0));crowd(25);}
  if(c.reversal){p.reversal=true;msg="Reversal ready.";}
  if(c.draw) draw(p,c.draw);
  say(msg);
  if(checkPin(o,p)) return;
  render();
}

function finisherSplash(w,byYou){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="overlay";
    ov.innerHTML=`<div class="finisher"><div class="by">${esc(w.name)}${byYou?"":" is going for it"}</div><h2 class="metal">${esc(w.fin.name)}</h2><div class="streak"></div></div>`;
    document.body.appendChild(ov);flash();crowd(120);
    setTimeout(()=>{ov.remove();res();},RM?500:1500);
  });
}
async function useFinisher(){
  const p=G.p,o=G.o,f=p.w.fin;
  if(G.busy||G.over||p.hype<HYPE_MAX) return;
  G.busy=true;render();
  await finisherSplash(p.w,true);
  p.hype=0;
  const dealt=damage(o,f.dmg,{ignoreBlock:G.pid==="raven"});
  if(G.pid==="dutch") o.weak=Math.max(o.weak,2);
  if(G.pid==="kid") p.hp=Math.min(p.max,p.hp+5);
  impact("o",dealt,true);
  say(`${f.name}! ${dealt} damage!`);
  gainHype(o,1);
  G.busy=false;
  if(checkPin(o,p)) return;
  render();
}
async function endTurn(){
  if(G.busy||G.over) return;
  G.busy=true;render();
  await wait(450);
  if(G.intent.type==="finisher") await finisherSplash(G.o.w,false);
  oppAct();
}
function oppAct(){
  const p=G.p,o=G.o,it=G.intent;
  o.block=0;let msg="";
  if(it.type==="finisher"){
    o.hype=0;let d=it.dmg;if(o.weak>0)d=Math.max(0,d-3);
    const dealt=damage(p,d,{ignoreBlock:o.w.id==="raven"});
    if(o.w.id==="dutch") p.weak=Math.max(p.weak,2);
    if(o.w.id==="kid") o.hp=Math.min(o.max,o.hp+5);
    impact("p",dealt,true);msg=`${o.w.name} hits the ${it.label}! ${dealt} damage!`;
  } else if(it.type==="grapple"&&p.reversal){
    const back=5+(G.pid==="dutch"?3:0);
    if(G.pid==="dutch") p.block+=3;
    const dealt=damage(o,back);impact("o",dealt,false);crowd(60);
    gainHype(p,2);msg=`REVERSED! You counter for ${dealt}!`;
  } else if(it.type==="strike"||it.type==="grapple"){
    if(p.reversal&&it.type==="strike") p.block+=3;
    let d=it.dmg;if(o.weak>0)d=Math.max(0,d-3);
    const dealt=damage(p,d);impact("p",dealt,false);
    gainHype(o,it.type==="grapple"?2:1);gainHype(p,1);
    msg=`${o.w.name} ${it.type==="grapple"?"grapples":"strikes"} for ${dealt}${dealt<d?` (${d-dealt} blocked)`:""}.`;
  } else if(it.type==="defense"){
    o.block=it.block;msg=`${o.w.name} covers up. Blocking ${it.block}.`;
  } else {
    gainHype(o,it.hype);crowd(30);msg=`${o.w.name} plays to the crowd. +${it.hype} hype.`;
  }
  if(o.weak>0&&it.type!=="defense"&&it.type!=="hype") o.weak--;
  say(msg);
  if(p.weak>0) p.weak--;
  if(checkPin(p,o)) return;
  G.turn++;pickIntent();G.busy=false;startTurn();
}

/* ---------- pinfall ---------- */
function checkPin(down,up){
  if(down.hp>0) return false;
  G.busy=true;render();
  const canKick=!down.kicked&&down.hype>=5;
  pinCount(canKick).then(()=>{
    if(canKick){
      down.kicked=true;down.hype-=5;down.hp=5;crowd(120);
      say(`${down.w.name} KICKS OUT AT TWO!`);
      G.busy=false;
      if(down===G.o) render(); else {G.turn++;pickIntent();startTurn();}
    } else finishMatch(up===G.p);
  });
  return true;
}
async function pinCount(kick){
  const ov=document.createElement("div");ov.className="overlay";document.body.appendChild(ov);
  const steps=kick?["1","2","KICK OUT!"]:["1","2","3"];
  for(const s of steps){
    ov.innerHTML=`<div><div class="ref">The referee counts</div><div class="count ${s==="3"?"three":""} ${s.length>2?"out":""}">${s}</div></div>`;
    if(s==="3"||s.length>2){flash();crowd(140);quake();}
    await wait(s.length>2||s==="3"?1000:700);
  }
  ov.remove();
}

function finishMatch(won){
  G.over=true;
  const ov=document.createElement("div");ov.className="overlay";document.body.appendChild(ov);
  const champ=won&&G.round===2;
  if(champ){const b=loadBest();b[G.pid]=(b[G.pid]||0)+1;saveBest(b);}
  if(won) crowd(200);
  const ladder=G.ladder.map((k,i)=>`<span class="${i<G.round||(won&&i===G.round)?"done":i===G.round?"cur":""}">${WRESTLERS[k].name}</span>`).join("");
  ov.innerHTML=`<div class="result">
    <div class="eyebrow">${won?"Winner by pinfall":"Pinned, one two three"}</div>
    ${champ?`<div class="belt"></div>`:""}
    <h2 class="${won?"metal":""}" ${won?"":'style="color:var(--crimson)"'}>${champ?"Rewrite Champion":won?`${esc(G.p.w.name)} wins`:`${esc(G.o.w.name)} wins`}</h2>
    <div class="ladder">${ladder}</div>
    <p>${champ?`Three straight wins. ${esc(G.p.w.name)} walks out with the gold.`:won?`Next up: ${esc(WRESTLERS[G.ladder[G.round+1]].name)}. You start the next match fresh.`:`You lasted ${G.turn} turns. Run it back or pick someone new.`}</p>
    <div class="actions">${won&&!champ?`<button class="btn primary" id="next">Next match</button>`:`<button class="btn primary" id="again">Run it back</button>`}<button class="btn" id="roster">Pick wrestler</button></div>
  </div>`;
  const close=()=>ov.remove();
  ov.querySelector("#next")?.addEventListener("click",()=>{close();G.round++;startMatch();});
  ov.querySelector("#again")?.addEventListener("click",()=>{close();startRun(G.pid);});
  ov.querySelector("#roster").addEventListener("click",()=>{close();G=null;selectScreen();});
}

/* ---------- render ---------- */
let pendingFx=[];
function fx(who,amount,big){pendingFx.push({who,amount,big});}

function fighterHTML(f,who){
  const pct=(f.hp/f.max*100);
  const prev=(G.bars&&G.bars[who]!=null)?G.bars[who]:pct;
  const pips=Array.from({length:HYPE_MAX},(_,i)=>`<span class="${i<f.hype?"on":""}"></span>`).join("");
  const chips=[f.block?`<span class="chip block">Block ${f.block}</span>`:"",f.weak?`<span class="chip weak">Weakened ${f.weak}</span>`:"",f.reversal?`<span class="chip rev">Reversal ready</span>`:"",f.kicked?`<span class="chip">Kick-out used</span>`:""].join("");
  const intent=who==="o"?`<div class="intent"><span class="k">Next move</span><span class="v ${G.intent.type}">${esc(G.intent.label)}</span></div>`:"";
  return `<section class="fighter ${who==="p"?"me":"them"}" id="f-${who}"><span class="side">${who==="p"?"You":"Opponent"}</span>
    ${portrait(f.w,false)}
    <div class="bars">
      <div class="name">${esc(f.w.name)} <small>${esc(f.w.style)}</small></div>
      <div class="lbl"><span>Stamina</span><span class="num">${f.hp} / ${f.max}</span></div>
      <div class="bar"><div class="ghost" data-to="${pct.toFixed(1)}" style="width:${prev.toFixed(1)}%"></div><div class="fill ${pct<30?"low":""}" data-to="${pct.toFixed(1)}" style="width:${prev.toFixed(1)}%"></div></div>
      <div class="lbl"><span>Hype</span><span class="num ${f.hype>=HYPE_MAX?"ready":""}">${f.hype>=HYPE_MAX?"Finisher ready":`${f.hype} / ${HYPE_MAX}`}</span></div>
      <div class="hype ${f.hype>=HYPE_MAX?"full":""}">${pips}</div>
      ${intent}
      ${chips?`<div class="chips">${chips}</div>`:""}
    </div></section>`;
}
function cardHTML(id,i,p){
  const c=CARDS[id];
  let big=c.big||"";
  if(c.dmg){let d=c.dmg+(c.type==="grapple"&&G.pid==="brick"?2:0);big=`${d} DMG`;}
  return `<button class="card t-${c.type}${c.sig?" sig":""}" style="--i:${G.dealt?i:0}" data-i="${i}" ${c.cost>p.energy||G.busy?"disabled":""}>
    <div class="top"><span class="type">${c.type}</span><span class="cost"><b>${c.cost}</b></span></div>
    <h4>${esc(c.name)}</h4><div class="big">${big}</div><p>${esc(c.text)}</p>${c.sig?`<span class="seal">Signature</span>`:""}</button>`;
}
function render(){
  if(!G||!G.p) return;
  const p=G.p,o=G.o;
  const ladder=G.ladder.map((k,i)=>`<span class="${i<G.round?"done":i===G.round?"cur":""}">${WRESTLERS[k].name}</span>`).join("");
  app.innerHTML=`
  <header class="brand">${logo()}<div class="ladder">${ladder}</div></header>
  <div class="eyebrow">You are ${esc(p.w.name)} · vs ${esc(o.w.name)}</div>
  ${fighterHTML(o,"o")}
  <div class="ticker"><div class="now ${G.fresh?"pop":""}">${esc(G.log[0]||"")}</div>${G.log[1]?`<div class="prev">${esc(G.log[1])}</div>`:""}</div>
  ${fighterHTML(p,"p")}
  <div class="meta"><div class="energy">${Array.from({length:ENERGY},(_,i)=>`<i class="${i<p.energy?"on":""}"></i>`).join("")}<span>${p.energy} energy</span></div>
    <span>Turn ${G.turn} · Deck ${p.deck.length} · Discard ${p.discard.length}</span></div>
  <div class="hand">${p.hand.map((id,i)=>cardHTML(id,i,p)).join("")||`<p class="howto">No cards left. End your turn.</p>`}</div>
  <div class="actions">
    <button class="btn fin" id="fin" ${p.hype<HYPE_MAX||G.busy?"disabled":""}>${esc(p.w.fin.name)}</button>
    <span class="grow"></span>
    <button class="btn primary" id="end" ${G.busy?"disabled":""}>End turn</button>
  </div>`;
  G.fresh=false; G.dealt=false;
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>playCard(+b.dataset.i));
  $("#end").onclick=endTurn;$("#fin").onclick=useFinisher;
  // animate bars from previous to new values
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    app.querySelectorAll(".bar .ghost,.bar .fill").forEach(el=>el.style.width=el.dataset.to+"%");
  }));
  G.bars={p:p.hp/p.max*100,o:o.hp/o.max*100};
  for(const e of pendingFx){
    const el=$(`#f-${e.who}`);if(!el)continue;
    el.classList.add("hit");
    const n=document.createElement("span");n.className="float"+(e.big?" big":"");n.textContent=e.amount?`-${e.amount}`:"0";
    n.style.color=e.big?"var(--finisher)":(e.who==="p"?"#ff5a70":"#fff");el.appendChild(n);
  }
  pendingFx=[];
}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.G&&data.G.p){G=data.G;G.busy=false;render();} else selectScreen();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
