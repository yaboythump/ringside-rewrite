<title>Ringside Card Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one fight-night column. Opponent on top, ring call in the middle, you below, your hand at the bottom. Single dark arena look by choice. */
:root{
  --bg:#0b0b0d; --panel:#16161a; --panel-2:#1f1f25; --line:#2c2c34;
  --fg:#ecebe6; --muted:#9a9aa4; --steel:#b9bcc4;
  --gold:#d8b25a; --gold-deep:#a8822e; --crimson:#c4243a; --good:#5fbf7a;
  --strike:#d9663b; --grapple:#c4243a; --defense:#7f98b8; --hype:#d8b25a; --finisher:#f1d27a;
  --display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:Barlow,system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  background-image:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(216,178,90,.10),transparent 70%)}
.app{max-width:760px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:.01em;line-height:.9;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.tag{font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.eyebrow{font-family:var(--label);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--gold)}

/* select screen */
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:grid;gap:8px;transition:border-color .15s,transform .15s}
.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
.pick h3{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;text-transform:uppercase}
.pick p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.pick .fin{font-family:var(--label);font-size:13px;color:var(--gold)}
.statline{display:flex;gap:10px;font-family:var(--label);font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums}

.portrait{aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;overflow:hidden;position:relative;background:var(--panel-2);display:grid;place-items:center}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.mono{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,56px);letter-spacing:.02em;color:var(--bg);line-height:1}
.portrait .plate{position:absolute;inset:0;display:grid;place-items:center}
.portrait .note{position:absolute;bottom:6px;left:6px;right:6px;font-family:var(--label);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(11,11,13,.75);text-align:center}

/* match */
.fighter{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.fighter .portrait{width:84px}
.fighter .name{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fighter .name small{font-family:var(--label);font-weight:500;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.fighter.me{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(216,178,90,.12)}
.fighter.them{border:2px solid rgba(196,36,58,.55)}
.side{position:absolute;top:-10px;left:12px;padding:1px 9px;border-radius:4px;font-family:var(--label);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.me .side{background:var(--gold);color:var(--bg)}
.them .side{background:var(--crimson);color:var(--fg)}
.fighter{margin-top:6px}
.vs{font-family:var(--display);font-weight:800;color:var(--muted);font-size:13px;letter-spacing:.2em;text-align:center}
.bars{display:grid;gap:6px;min-width:0}
.lbl{display:flex;justify-content:space-between;gap:8px;font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-3px}
.lbl .num{color:var(--fg);font-size:13px;letter-spacing:.04em;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--panel-2);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--crimson),#e04a52);transition:width .35s ease}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-family:var(--label);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.hype{display:flex;gap:3px;align-items:center}
.hype span{flex:1;height:7px;border-radius:2px;background:var(--panel-2);transition:background .2s}
.hype span.on{background:var(--gold)}
.hype.full span.on{background:var(--finisher);box-shadow:0 0 6px rgba(241,210,122,.6)}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--label);font-size:12px}
.chip{padding:2px 8px;border-radius:99px;background:var(--panel-2);color:var(--steel);letter-spacing:.04em}
.chip.block{color:var(--defense)} .chip.weak{color:var(--strike)} .chip.rev{color:var(--good)}
.intent{display:flex;align-items:center;gap:8px;margin-top:2px;font-family:var(--label);font-size:14px}
.intent .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.intent .v{padding:3px 10px;border-radius:4px;font-weight:600;background:var(--panel-2)}
.intent .v.strike{color:var(--strike)} .intent .v.grapple{color:#ff6b7c} .intent .v.defense{color:var(--defense)} .intent .v.hype{color:var(--hype)}
.intent .v.finisher{color:var(--bg);background:var(--finisher);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(241,210,122,.25)}}
.hit{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.float{position:absolute;right:14px;top:6px;font-family:var(--display);font-weight:800;font-size:30px;pointer-events:none;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}

.call{background:var(--panel-2);border-left:3px solid var(--gold);border-radius:4px;padding:8px 12px;min-height:44px;display:grid;gap:2px}
.call .now{font-family:var(--label);font-size:16px;font-weight:600}
.call .prev{color:var(--muted);font-size:13px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--label);font-size:13px;color:var(--muted)}
.energy{display:flex;gap:5px;align-items:center}
.energy i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);display:block}
.energy i.on{background:var(--gold)}

.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c,var(--steel));border-radius:8px;padding:8px 9px;text-align:left;display:grid;gap:4px;align-content:start;min-height:122px;transition:transform .12s,border-color .12s,opacity .12s;position:relative}
.card:hover:not(:disabled){transform:translateY(-3px);border-color:var(--c)}
.card:disabled{opacity:.38;cursor:not-allowed}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .cost{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;flex:none}
.card .type{font-family:var(--label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.card h4{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;text-transform:uppercase}
.card p{margin:0;font-size:12.5px;line-height:1.35;color:var(--steel)}
.card.sig::after{content:"Signature";position:absolute;right:8px;bottom:6px;font-family:var(--label);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
.t-strike{--c:var(--strike)} .t-grapple{--c:#ff6b7c} .t-defense{--c:var(--defense)} .t-hype{--c:var(--hype)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:6px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;background:var(--panel-2);border:1px solid var(--line)}
.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.fin{background:var(--finisher);color:var(--bg);border-color:var(--finisher);animation:pulse 1s ease-in-out infinite}
.btn:disabled{opacity:.35;cursor:not-allowed;animation:none}
.grow{flex:1}

.overlay{position:fixed;inset:0;background:rgba(5,5,7,.86);display:grid;place-items:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.count{font-family:var(--display);font-weight:800;font-size:clamp(90px,30vw,180px);line-height:1;color:var(--fg);text-align:center}
.count.three{color:var(--gold)}
.count.out{color:var(--crimson);font-size:clamp(48px,14vw,96px)}
.result{max-width:440px;text-align:center;display:grid;gap:12px;justify-items:center}
.result h2{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,64px);line-height:.95;margin:0;text-transform:uppercase}
.result p{margin:0;color:var(--steel);line-height:1.5}
.ladder{display:flex;gap:6px;font-family:var(--label);font-size:12px;letter-spacing:.06em}
.ladder span{padding:3px 8px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.ladder span.done{color:var(--good)} .ladder span.cur{color:var(--bg);background:var(--gold)}
.howto{color:var(--muted);font-size:13px;line-height:1.5;margin:0;max-width:65ch}
.howto b{color:var(--steel)}
.foot{color:var(--muted);font-size:11px;font-family:var(--label);letter-spacing:.06em}
@media (max-width:420px){.fighter{grid-template-columns:64px 1fr}.fighter .portrait{width:64px}.hand{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let G=null; // game state
const $=s=>document.querySelector(s);
const app=$("#app");
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function loadBest(){try{return JSON.parse(localStorage.getItem("rcc-best")||"{}")}catch(e){return {}}}
function saveBest(b){try{localStorage.setItem("rcc-best",JSON.stringify(b))}catch(e){}}

function portrait(w,note){
  if(w.img) return `<div class="portrait"><img src="${w.img}" alt="${esc(w.name)}"></div>`;
  const ini=w.name.split(" ").map(s=>s[0]).join("");
  const fg = w.id==="raven" ? "var(--steel)" : "var(--bg)";
  return `<div class="portrait" style="background:${w.color}"><div class="plate"><span class="mono" style="color:${fg}">${ini}</span></div>${note?`<span class="note" style="color:${fg}">Art pending</span>`:""}</div>`;
}

/* ---------- screens ---------- */
function selectScreen(){
  const best=loadBest();
  app.innerHTML=`
  <header class="brand"><h1>Ringside <span>Card Clash</span></h1><span class="tag">Wrestling history. Booked differently.</span></header>
  <div class="eyebrow">Pick your wrestler</div>
  <div class="roster">${Object.values(WRESTLERS).map(w=>`
    <button class="pick" data-w="${w.id}">
      ${portrait(w,true)}
      <h3>${esc(w.name)}</h3>
      <div class="statline"><span>${w.style}</span><span>${w.hp} stamina</span></div>
      <p>${esc(w.passive)}</p>
      <div class="fin">Finisher: ${esc(w.fin.name)}</div>
      ${best[w.id]?`<div class="chip rev" style="justify-self:start">Champion ×${best[w.id]}</div>`:""}
    </button>`).join("")}
  </div>
  <p class="howto"><b>How a match works.</b> Each turn you get 3 energy and 5 cards. Strikes and grapples do damage, defense keeps you standing, hype fills your meter. You can always see what your opponent will do next, so block the big hits and save Reversal for their grapples. Fill hype to 10 to unlock your finisher. Drop them to 0 stamina for the pin, but anyone with 5 hype can kick out at two, once per match. Win three matches in a row to take the Rewrite Championship.</p>
  <div class="foot">Original fictional wrestlers. Unofficial and fan-made. Brick Malone's portrait was generated on RunPod with MiniMax H3.</div>`;
  app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>startRun(b.dataset.w));
}

function makeFighter(id){
  const w=WRESTLERS[id];
  return {w,hp:w.hp,max:w.hp,hype:id==="kid"?4:0,block:0,weak:0,kicked:false,
    deck:shuffle([...BASE_DECK,...w.sig,...w.sig.slice(0,1)]),hand:[],discard:[],energy:ENERGY,reversal:false};
}

function startRun(id){
  const others=shuffle(Object.keys(WRESTLERS).filter(k=>k!==id));
  G={pid:id,ladder:others,round:0,log:[]};
  startMatch();
}

function startMatch(){
  G.p=makeFighter(G.pid);
  G.o=makeFighter(G.ladder[G.round]);
  G.turn=1; G.busy=false; G.over=false;
  G.log=[`Round ${G.round+1} of 3. ${G.o.w.name} is waiting in the ring.`];
  pickIntent();
  startTurn();
}

/* ---------- core ---------- */
function draw(f,n){
  for(let i=0;i<n;i++){
    if(!f.deck.length){ if(!f.discard.length) return; f.deck=shuffle(f.discard); f.discard=[]; }
    f.hand.push(f.deck.pop());
  }
}
function startTurn(){
  const p=G.p;
  p.block=0; p.reversal=false; p.energy=ENERGY;
  p.discard.push(...p.hand); p.hand=[];
  draw(p,HAND);
  render();
}
function say(t){G.log.unshift(t); G.log=G.log.slice(0,2);}
function gainHype(f,n){f.hype=Math.min(HYPE_MAX,f.hype+n);}

function pickIntent(){
  const o=G.o, w=o.w;
  if(o.hype>=HYPE_MAX){G.intent={type:"finisher",label:w.fin.name,dmg:w.fin.dmg};return;}
  const bag=[];
  for(const [k,v] of Object.entries(w.ai)) for(let i=0;i<v;i++) bag.push(k);
  if(o.hp<o.max*0.35) bag.push("defense","defense");
  const t=bag[rnd(bag.length)];
  const lvl=Math.min(G.round,2);
  if(t==="strike"){const d=[5,6,7,8][rnd(4)]+lvl; G.intent={type:"strike",label:`Strike ${d}`,dmg:d};}
  else if(t==="grapple"){let d=[7,8,9,10][rnd(4)]+lvl; if(w.id==="brick")d+=2; G.intent={type:"grapple",label:`Grapple ${d}`,dmg:d};}
  else if(t==="defense"){const b=6+rnd(4); G.intent={type:"defense",label:`Block ${b}`,block:b};}
  else G.intent={type:"hype",label:"Play to the crowd",hype:3+(w.id==="kid"?1:0)};
}

function damage(target,amount,{ignoreBlock=false}={}){
  let d=amount;
  if(!ignoreBlock && target.block>0){const used=Math.min(target.block,d); target.block-=used; d-=used;}
  target.hp=Math.max(0,target.hp-d);
  return d;
}

function playCard(i){
  if(G.busy||G.over) return;
  const p=G.p, o=G.o, id=p.hand[i], c=CARDS[id];
  if(c.cost>p.energy) return;
  p.energy-=c.cost; p.hand.splice(i,1); p.discard.push(id);
  let msg=`${c.name}.`;
  if(c.dmg){
    let d=c.dmg;
    if(c.type==="grapple"&&G.pid==="brick") d+=2;
    if(p.weak>0) d=Math.max(0,d-3);
    const dealt=damage(o,d);
    msg=`${c.name} for ${dealt}${dealt<d?` (${d-dealt} blocked)`:""}.`;
    fx("o",dealt);
    gainHype(p,(c.hype||0)+(c.type==="strike"&&G.pid==="raven"?1:0));
    if(c.dmg) gainHype(o,1);
  } else if(c.hype){gainHype(p,c.hype);}
  if(c.self){p.hp=Math.max(1,p.hp-c.self); fx("p",c.self);}
  if(c.block){p.block+=c.block; msg+=` Blocking ${p.block}.`;}
  if(c.weak){o.weak=Math.max(o.weak,c.weak);}
  if(c.heal){p.hp=Math.min(p.max,p.hp+c.heal); msg=`Second wind. +${c.heal} stamina.`;}
  if(c.hypeGain){gainHype(p,c.hypeGain+(G.pid==="kid"?1:0));}
  if(c.reversal){p.reversal=true; msg="Reversal ready.";}
  if(c.draw) draw(p,c.draw);
  say(msg);
  if(checkPin(o,p)) return;
  render();
}

function useFinisher(){
  const p=G.p,o=G.o,f=p.w.fin;
  if(G.busy||G.over||p.hype<HYPE_MAX) return;
  p.hype=0;
  const dealt=damage(o,f.dmg,{ignoreBlock:G.pid==="raven"});
  if(G.pid==="dutch") o.weak=Math.max(o.weak,2);
  if(G.pid==="kid") p.hp=Math.min(p.max,p.hp+5);
  fx("o",dealt,true);
  say(`${f.name.toUpperCase()}! ${dealt} damage.`);
  gainHype(o,1);
  if(checkPin(o,p)) return;
  render();
}

function endTurn(){
  if(G.busy||G.over) return;
  G.busy=true; render();
  setTimeout(oppAct,450);
}

function oppAct(){
  const p=G.p,o=G.o,it=G.intent;
  o.block=0;
  let msg="";
  if(it.type==="finisher"){
    o.hype=0;
    let d=it.dmg; if(o.weak>0) d=Math.max(0,d-3);
    const dealt=damage(p,d,{ignoreBlock:o.w.id==="raven"});
    if(o.w.id==="dutch") p.weak=Math.max(p.weak,2);
    if(o.w.id==="kid") o.hp=Math.min(o.max,o.hp+5);
    fx("p",dealt,true); msg=`${o.w.name} hits the ${it.label}! ${dealt} damage.`;
  } else if(it.type==="grapple" && p.reversal){
    const back=5+(G.pid==="dutch"?3:0);
    if(G.pid==="dutch") p.block+=3;
    const dealt=damage(o,back); fx("o",dealt);
    gainHype(p,2);
    msg=`Reversed! You counter the grapple for ${dealt}.`;
  } else if(it.type==="strike"||it.type==="grapple"){
    if(p.reversal && it.type==="strike") p.block+=3;
    let d=it.dmg; if(o.weak>0) d=Math.max(0,d-3);
    const dealt=damage(p,d); fx("p",dealt);
    gainHype(o,it.type==="grapple"?2:1); gainHype(p,1);
    msg=`${o.w.name}: ${it.type} for ${dealt}${dealt<d?` (${d-dealt} blocked)`:""}.`;
  } else if(it.type==="defense"){
    o.block=it.block; msg=`${o.w.name} covers up. Blocking ${it.block} on your turn.`;
  } else {
    gainHype(o,it.hype); msg=`${o.w.name} plays to the crowd. +${it.hype} hype.`;
  }
  if(o.weak>0 && it.type!=="defense" && it.type!=="hype") o.weak--;
  say(msg);
  if(p.weak>0) p.weak--;
  if(checkPin(p,o)) return;
  G.turn++; pickIntent(); G.busy=false; startTurn();
}

/* ---------- pinfall ---------- */
function checkPin(down,up){
  if(down.hp>0) return false;
  G.busy=true; render();
  const canKick = !down.kicked && down.hype>=5;
  pinCount(canKick, ()=>{
    if(canKick){
      down.kicked=true; down.hype-=5; down.hp=5;
      say(`${down.w.name} KICKS OUT AT TWO!`);
      G.busy=false;
      if(down===G.o){render();} else {G.turn++; pickIntent(); startTurn();}
    } else finishMatch(up===G.p);
  });
  return true;
}
function pinCount(kick,done){
  const ov=document.createElement("div"); ov.className="overlay"; document.body.appendChild(ov);
  const steps=kick?["1","2","KICK OUT!"]:["1","2","3"];
  let i=0;
  const tick=()=>{
    if(i>=steps.length){ setTimeout(()=>{ov.remove();done();}, kick?500:350); return; }
    const s=steps[i]; ov.innerHTML=`<div class="count ${s==="3"?"three":""} ${s.length>2?"out":""}">${s}</div>`;
    i++; setTimeout(tick, i===steps.length?900:650);
  };
  tick();
}

function finishMatch(won){
  G.over=true;
  const ov=document.createElement("div"); ov.className="overlay"; document.body.appendChild(ov);
  const champ = won && G.round===2;
  if(champ){const b=loadBest(); b[G.pid]=(b[G.pid]||0)+1; saveBest(b);}
  const ladder=G.ladder.map((k,i)=>`<span class="${i<G.round||(won&&i===G.round)?"done":i===G.round?"cur":""}">${WRESTLERS[k].name}</span>`).join("");
  ov.innerHTML=`<div class="result">
    <div class="eyebrow">${won?"Winner by pinfall":"Pinned"}</div>
    <h2>${champ?"Rewrite Champion":won?`${esc(G.p.w.name)} wins`:`${esc(G.o.w.name)} wins`}</h2>
    <div class="ladder">${ladder}</div>
    <p>${champ?`Three straight wins. ${esc(G.p.w.name)} walks out with the gold.`:won?`Next up: ${esc(WRESTLERS[G.ladder[G.round+1]].name)}. You start the next match fresh.`:`You lasted ${G.turn} turns. Run it back or pick someone new.`}</p>
    <div class="actions">${won&&!champ?`<button class="btn primary" id="next">Next match</button>`:`<button class="btn primary" id="again">Run it back</button>`}<button class="btn" id="roster">Pick wrestler</button></div>
  </div>`;
  const close=()=>ov.remove();
  ov.querySelector("#next")?.addEventListener("click",()=>{close();G.round++;startMatch();});
  ov.querySelector("#again")?.addEventListener("click",()=>{close();startRun(G.pid);});
  ov.querySelector("#roster").addEventListener("click",()=>{close();G=null;selectScreen();});
}

/* ---------- render ---------- */
let pendingFx=[];
function fx(who,amount,big){pendingFx.push({who,amount,big});}

function fighterHTML(f,who){
  const pips=Array.from({length:HYPE_MAX},(_,i)=>`<span class="${i<f.hype?"on":""}"></span>`).join("");
  const chips=[f.block?`<span class="chip block">Block ${f.block}</span>`:"",f.weak?`<span class="chip weak">Weakened ${f.weak}</span>`:"",f.reversal?`<span class="chip rev">Reversal ready</span>`:"",f.kicked?`<span class="chip">Kick-out used</span>`:""].join("");
  const intent= who==="o" ? `<div class="intent"><span class="k">Next</span><span class="v ${G.intent.type}">${esc(G.intent.label)}</span></div>` : "";
  return `<section class="fighter ${who==="p"?"me":"them"}" id="f-${who}"><span class="side">${who==="p"?"You":"Opponent"}</span>
    ${portrait(f.w,false)}
    <div class="bars">
      <div class="name">${esc(f.w.name)} <small>${esc(f.w.style)}</small></div>
      <div class="lbl"><span>Stamina</span><span class="num">${f.hp} left of ${f.max}</span></div>
      <div class="bar"><i style="width:${(f.hp/f.max*100).toFixed(1)}%"></i></div>
      <div class="lbl"><span>Hype</span><span class="num">${f.hype>=HYPE_MAX?"FINISHER READY":`${f.hype} / ${HYPE_MAX}`}</span></div>
      <div class="hype ${f.hype>=HYPE_MAX?"full":""}" title="Hype ${f.hype}/10">${pips}</div>
      ${intent}
      ${chips?`<div class="chips">${chips}</div>`:""}
    </div></section>`;
}

function render(){
  if(!G||!G.p) return;
  const p=G.p,o=G.o;
  const ladder=G.ladder.map((k,i)=>`<span class="${i<G.round?"done":i===G.round?"cur":""}">${WRESTLERS[k].name}</span>`).join("");
  app.innerHTML=`
  <header class="brand"><h1>Ringside <span>Card Clash</span></h1><div class="ladder">${ladder}</div></header>
  <div class="eyebrow">You are ${esc(p.w.name)} · vs ${esc(o.w.name)}</div>
  ${fighterHTML(o,"o")}
  <div class="vs">Your cards play against the opponent above</div>
  <div class="call"><div class="now">${esc(G.log[0]||"")}</div>${G.log[1]?`<div class="prev">${esc(G.log[1])}</div>`:""}</div>
  ${fighterHTML(p,"p")}
  <div class="meta"><div class="energy">${Array.from({length:ENERGY},(_,i)=>`<i class="${i<p.energy?"on":""}"></i>`).join("")}<span>&nbsp;${p.energy} energy</span></div>
    <span>Turn ${G.turn} · Deck ${p.deck.length} · Discard ${p.discard.length}</span></div>
  <div class="hand">${p.hand.map((id,i)=>{const c=CARDS[id];return `<button class="card t-${c.type}${c.sig?" sig":""}" data-i="${i}" ${c.cost>p.energy||G.busy?"disabled":""}>
      <div class="top"><span class="type">${c.type}</span><span class="cost">${c.cost}</span></div>
      <h4>${esc(c.name)}</h4><p>${esc(c.text)}</p></button>`}).join("")||`<p class="howto">No cards left. End your turn.</p>`}</div>
  <div class="actions">
    <button class="btn fin" id="fin" ${p.hype<HYPE_MAX||G.busy?"disabled":""}>${esc(p.w.fin.name)}</button>
    <span class="grow"></span>
    <button class="btn primary" id="end" ${G.busy?"disabled":""}>End turn</button>
  </div>`;
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>playCard(+b.dataset.i));
  $("#end").onclick=endTurn; $("#fin").onclick=useFinisher;
  for(const e of pendingFx){
    const el=$(`#f-${e.who}`); if(!el) continue;
    el.classList.add("hit");
    const n=document.createElement("span"); n.className="float"; n.textContent=e.amount?`-${e.amount}`:"0";
    n.style.color=e.big?"var(--finisher)":"var(--crimson)"; el.appendChild(n);
  }
  pendingFx=[];
}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.G&&data.G.p){G=data.G;G.busy=false;render();} else selectScreen();
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
