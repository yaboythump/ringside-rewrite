[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ringside-rewrite"
version = "1.0.0"
description = "Automated sourced fantasy-booking production and YouTube publishing for Ringside Rewrite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
  "pydantic>=2.8.0",
  "Pillow>=10.4.0",
  "python-dotenv>=1.0.1",
  "google-api-python-client>=2.140.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "APScheduler>=3.10.4",
]

[project.scripts]
ringside = "ringside.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
