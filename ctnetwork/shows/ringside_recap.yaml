show: Ringside Recap
show_id: ringside_recap
formula_lock: Fast-but-breathing premium wrestling recap show for RAW, SmackDown, AEW, PLE/PPV, and major wrestling events.
narrator:
  name: F06
  voice_key: F06
  provider: ctnetwork_local_qwen
  status: locked
workflow:
  thumbnail_first: true
  picture_storyboard_second: true
  no_script_or_narration_before_visual_approval: true
  visuals_created_in_chatgpt: true
  server_role: narration_only
  server_visual_generation_forbidden: true
  server_video_assembly_forbidden: true
  final_assembly: outside_server_from_approved_visuals_and_narration
  shorts_source: approved_master_only
episode:
  target_runtime_minutes: 4-5
  minimum_visuals: 16
  preferred_visuals: 18-22
  pacing: deliberate_wrestling_recap
  average_visual_hold_seconds: 10-18
  rapid_fire_editing_forbidden: true
  cover_full_show_story: true
visuals:
  wrestling_event_recap: true
  arena_ring_crowd_backstage_scorecards: true
  premium_visual_floor_required: true
  use_distinct_images_for_major_beats: true
  preserve_readability_and_breathing_room: true
captions:
  burned_in: false
shorts:
  count_policy: at_least_one_short_per_covered_match
  minimum_count: match_count_from_verified_results
  major_nonmatch_segments: optional_additional_shorts
  main_event_fallout: optional_extra_short
  all_short_video_sources: exact_approved_master_only
  target_seconds: 50-58
  default_hashtag_count: 5
  content_gate:
    match_manifest_required: true
    every_match_must_have_a_matching_short: true
    title_must_match_actual_wrestlers_and_result: true
    block_publish_if_match_missing_or_title_inaccurate: true
    no_generic_vague_clickbait: true
  youtube:
    title_pattern: "[Wrestler A] vs [Wrestler B] — [Accurate Result/Hook] | Ringside Recap"
    multiperson_title_pattern: "[Match Participants or Match Type] — [Actual Result] | Ringside Recap"
    label: "match names first, outcome second"
  facebook:
    title_pattern: "[Accurate Result/Hook] — [Actual Match] | Ringside Recap"
    description_first_line: actual_corresponding_full_youtube_episode_url
    upload_type: REELS
  tiktok:
    caption_pattern: "Short hook. Actual match and result. Exactly five relevant hashtags."
    default_hashtags: ["#RingsideRecap", promotion_tag, event_tag, wrestler_tag, matchup_or_result_tag]
  qc:
    verify_each_short_covers_its_named_match: true
    verify_match_count_equals_short_coverage: true
    verify_youtube_facebook_tiktok_titles_and_captions: true
audio:
  music_bed_id: ringside_recap_arena_rock_bed_v1
  music_bed_path: assets/ringside-recap/Ringside_Recap_Arena_Rock_Bed.mp3
  music_style_locked: true
  music_description: aggressive modern arena rock and premium sports-broadcast bed with real electric guitars, live-sounding drums, bass, and restrained cinematic hits
  forbid_video_game_music: true
  forbid_synthwave: true
  forbid_chiptune: true
  forbid_edm_leads: true
  ring_bell_sfx: true
  crowd_sfx: true
  normalize_lufs: -14
  music_ducking: true
  narrator_speed: native
thumbnail:
  required_before_storyboard: true
  distinct_from_ringside_rewrite: true
qc:
  verify_narrator: F06
  verify_thumbnail: true
  verify_music_bed_id: ringside_recap_arena_rock_bed_v1
  verify_runtime_minutes: 4-5
  verify_visual_count_minimum: 16
  reject_robotic_voice: true
  reject_video_game_or_arcade_music: true
  reject_rushed_pacing: true
publish:
  require_manual_approval: true
  default_allowed: false
